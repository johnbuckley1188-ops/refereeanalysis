// Helper: aggregate stats for a set of matches from ALL participating teams
function leagueAvgByWeek(ms){
  // Returns [{week, date, v: {tries, pen, penW, loW, loT, to, pts, ptsC, fkC, fkW, scrum, scrumW, scrumT}}] per week
  const byWeek={};
  ms.forEach(m=>{
    const w=m.week||'?';
    if(!byWeek[w])byWeek[w]={week:w,date:m.date,games:0,tries:0,pen:0,penW:0,loW:0,loT:0,to:0,pts:0,ptsC:0,fkC:0,fkW:0,scrum:0,scrumW:0,scrumT:0};
    const bw=byWeek[w];
    [m.hid,m.aid].forEach(tid=>{
      const s=m.stats[tid]||{};
      const oppId=tid===m.hid?m.aid:m.hid;
      const oScore=tid===m.hid?m.as:m.hs;
      bw.games++;bw.tries+=s.tries||0;bw.pen+=s.pen||0;bw.penW+=s.penW||0;
      bw.loW+=s.loW||0;bw.loT+=s.loT||0;bw.to+=s.to||0;
      bw.pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
      bw.ptsC+=oScore||0;
      bw.fkC+=s.fkC||0;bw.fkW+=s.fkW||0;
      bw.scrum+=s.scrum||0;bw.scrumW+=s.scrumW||0;bw.scrumT+=s.scrumT||0;
    });
  });
  return Object.values(byWeek).sort((a,b)=>+(a.week||0)-(+(b.week||0)));
}
// Helper: aggregate season stats per team for a set of matches
function teamSeasonStats(ms,tid){
  let t={games:0,wins:0,draws:0,losses:0,pts:0,ptsC:0,tries:0,triesC:0,pen:0,penW:0,fkC:0,fkW:0,loW:0,loT:0,scrum:0,scrumW:0,scrumT:0,to:0,yel:0,red:0};
  ms.forEach(m=>{
    const s=m.stats[tid]||{};
    const oppId=m.hid===tid?m.aid:m.hid;
    const os=m.stats[oppId]||{};
    const tScore=m.hid===tid?m.hs:m.as,oScore=m.hid===tid?m.as:m.hs;
    t.games++;if(tScore>oScore)t.wins++;else if(tScore<oScore)t.losses++;else t.draws++;
    t.tries+=s.tries||0;t.pen+=s.pen||0;t.penW+=s.penW||0;
    t.fkC+=s.fkC||0;t.fkW+=s.fkW||0;
    t.loW+=s.loW||0;t.loT+=s.loT||0;
    t.scrum+=s.scrum||0;t.scrumW+=s.scrumW||0;t.scrumT+=s.scrumT||0;
    t.to+=s.to||0;t.yel+=s.yel||0;t.red+=s.red||0;
    t.pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
    t.ptsC+=oScore||0;
    t.triesC+=os.tries||0;
  });
  return t;
}

function renderTR(){
  const el=document.getElementById('tr');
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">📈</div><h2>No data yet</h2><p>Upload XML files to explore weekly trends.</p></div>`;return;}
  const ts=tours();
  if(!SEL_T)SEL_T=ts[0]?.id||null;
  if(!SEL_COMPARE_T2)SEL_COMPARE_T2=ts[1]?.id||ts[0]?.id||null;
  // Sync single-team view with global team filter
  const gfTeam=GLOBAL_FILTERS.teams&&GLOBAL_FILTERS.teams.length?GLOBAL_FILTERS.teams[0]:null;
  if(TR_VIEW==='team'){SEL_TEAM=gfTeam||'ALL';if(!gfTeam)TR_VIEW='league';}
  const tms=teamsFor(SEL_T);
  // Still needed for Compare Leagues view
  const tourOpts=ts.map(t=>`<option value="${t.id}"${t.id===SEL_T?' selected':''}>${TID_NAMES[+t.id]||t.id} (${t.c}g)</option>`).join('');
  const tourOpts2=ts.map(t=>`<option value="${t.id}"${t.id===SEL_COMPARE_T2?' selected':''}>${TID_NAMES[+t.id]||t.id} (${t.c}g)</option>`).join('');
  const viewBtns=`<div style="display:flex;gap:6px;margin-bottom:14px">
    <button class="metric-chip${TR_VIEW==='team'?' active':''}" onclick="TR_VIEW='team';renderTR()">Single Team</button>
    <button class="metric-chip${TR_VIEW==='league'?' active':''}" onclick="TR_VIEW='league';renderTR()">League View</button>
    <button class="metric-chip${TR_VIEW==='compare'?' active':''}" onclick="TR_VIEW='compare';renderTR()">Compare Leagues</button>
  </div>`;

  // ---- VIEW: Compare Leagues ----
  if(TR_VIEW==='compare'){
    const ms1=MATCHES.filter(m=>m.tour===SEL_T);
    const ms2=MATCHES.filter(m=>m.tour===SEL_COMPARE_T2);
    const byWeek1=leagueAvgByWeek(ms1),byWeek2=leagueAvgByWeek(ms2);
    const n1=TID_NAMES[+SEL_T]||SEL_T||'League 1';
    const n2=TID_NAMES[+SEL_COMPARE_T2]||SEL_COMPARE_T2||'League 2';
    // Per-league season averages per game
    function leagueSeasonAvg(ms){
      let g=0,tries=0,pen=0,penW=0,loW=0,loT=0,to=0,pts=0;
      ms.forEach(m=>[m.hid,m.aid].forEach(tid=>{
        const s=m.stats[tid]||{};g++;
        tries+=s.tries||0;pen+=s.pen||0;penW+=s.penW||0;
        loW+=s.loW||0;loT+=s.loT||0;to+=s.to||0;
        pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
      }));
      return g?{tries:tries/g,pen:pen/g,penW:penW/g,lo:loT>0?Math.round(loW/loT*100):null,to:to/g,pts:pts/g}:{};
    }
    const avg1=leagueSeasonAvg(ms1),avg2=leagueSeasonAvg(ms2);
    const metrics=[
      {l:'Avg Points/Game',k:'pts'},{l:'Avg Tries/Game',k:'tries'},
      {l:'Avg Penalties Conceded/Game',k:'pen'},{l:'Avg Penalties Won/Game',k:'penW'},
      {l:'Lineout Win %',k:'lo',pct:true},{l:'Avg Turnovers Won/Game',k:'to'},
    ];
    const compRows=metrics.map(m=>{
      const v1=avg1[m.k],v2=avg2[m.k];
      const f=v=>v==null?'—':(m.pct?Math.round(v)+'%':v.toFixed(1));
      const better1=v1!=null&&v2!=null&&(m.k==='pen'?v1<v2:v1>v2);
      const better2=v1!=null&&v2!=null&&(m.k==='pen'?v2<v1:v2>v1);
      return`<tr>
        <td style="font-weight:500;color:var(--txt)">${m.l}</td>
        <td class="td-num" style="${better1?'color:var(--green);font-weight:700':''}">${f(v1)}</td>
        <td class="td-num" style="${better2?'color:var(--green);font-weight:700':''}">${f(v2)}</td>
      </tr>`;
    }).join('');
    // Charts comparing both leagues per week
    const chartMetrics=[
      {label:'Tries/Game',col1:'#2d7a4f',col2:'#e57373',k:'tries'},
      {label:'Penalties/Game',col1:'#2d7a4f',col2:'#e57373',k:'pen'},
    ];
    el.innerHTML=`
      <div class="page-hdr"><h2>Team Trends</h2><p>League comparison</p></div>
      ${viewBtns}
      <div class="ctrl-row">
        <div class="ctrl-group"><div class="ctrl-lbl">League 1</div><select onchange="SEL_T=this.value;renderTR()">${tourOpts}</select></div>
        <div class="ctrl-group"><div class="ctrl-lbl">League 2</div><select onchange="SEL_COMPARE_T2=this.value;renderTR()">${tourOpts2}</select></div>
      </div>
      <div style="margin-bottom:16px">
        <div class="table-wrap"><table>
          <thead><tr><th>Metric</th><th style="text-align:center">${n1}</th><th style="text-align:center">${n2}</th></tr></thead>
          <tbody>${compRows}</tbody>
        </table></div>
      </div>
      <div class="ctrl-lbl" style="margin-bottom:10px">Per-Week Comparison</div>
      <div class="t-grid2" id="tr-charts-grid"></div>`;
    // Build comparison charts (two series per chart)
    setTimeout(()=>{
      const grid=document.getElementById('tr-charts-grid');if(!grid)return;
      grid.innerHTML='';
      const metrics2=[
        {label:'Penalties/Game',k:'pen'},{label:'Tries/Game',k:'tries'},
        {label:'Penalties Won/Game',k:'penW'},{label:'Turnovers Won/Game',k:'to'},
      ];
      metrics2.forEach(m=>{
        const wrap=document.createElement('div');
        wrap.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)';
        wrap.innerHTML=`<div style="font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:8px 12px 4px;color:var(--txt);border-bottom:1px solid var(--border-light)">
          ${m.label} <span style="font-size:9px;font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px">
          <span style="color:#2d7a4f">■ ${n1}</span> &nbsp; <span style="color:#e57373">■ ${n2}</span></span></div>
          <canvas style="display:block;height:140px;width:100%"></canvas>`;
        grid.appendChild(wrap);
        const canvas=wrap.querySelector('canvas');
        const d1=byWeek1.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?w[m.k]/w.games:0}));
        const d2=byWeek2.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?w[m.k]/w.games:0}));
        requestAnimationFrame(()=>drawChartDual(canvas,d1,d2,{lineCol1:'#2d7a4f',lineCol2:'#e57373'}));
      });
    },50);
    return;
  }

  // ---- VIEW: League or Single Team (uses global filtered matches) ----
  const ms=getFilteredMatches();
  const teamN=TR_VIEW==='team'?(MATCHES.find(m=>m.hid===SEL_TEAM)?.hn||MATCHES.find(m=>m.aid===SEL_TEAM)?.an||SEL_TEAM):'All Teams';

  // ---- VIEW: League (All Teams) ----
  if(TR_VIEW==='league'){
    const allTids=[...new Set(ms.flatMap(m=>[m.hid,m.aid]))];
    const teamData=allTids.map(tid=>{
      const tn=ms.find(m=>m.hid===tid)?.hn||ms.find(m=>m.aid===tid)?.an||tid;
      const tms2=ms.filter(m=>m.hid===tid||m.aid===tid);
      const t=teamSeasonStats(tms2,tid);
      const g=t.games||1;
      return{tid,tn,games:t.games,wins:t.wins,draws:t.draws,losses:t.losses,
        pts:t.pts/g,ptsC:t.ptsC/g,tries:t.tries/g,triesC:t.triesC/g,
        pen:t.pen/g,penW:t.penW/g,lo:t.loT>0?Math.round(t.loW/t.loT*100):null,to:t.to/g,
        scrumWpct:t.scrumT>0?Math.round(t.scrumW/t.scrumT*100):null};
    });
    const TRS=TR_SORT;
    teamData.sort((a,b)=>{
      const av=a[TRS.col]??-Infinity,bv=b[TRS.col]??-Infinity;
      return (bv-av)*TRS.dir;
    });
    function thSort(col,lbl){
      const active=TRS.col===col;
      const arrow=active?(TRS.dir===-1?'↓':'↑'):'↕';
      const style=active?'color:var(--green);font-weight:700;':'';
      return`<th style="text-align:center;cursor:pointer;user-select:none;${style}" onclick="TR_SORT={col:'${col}',dir:TR_SORT.col==='${col}'?-TR_SORT.dir:-1};renderTR()">${lbl} <span style="font-size:9px;opacity:.7">${arrow}</span></th>`;
    }
    const teamRows=teamData.map(d=>{
      const loStr=d.lo!==null?d.lo+'%':'—';
      return`<tr>
        <td class="tw">${d.tn}</td>
        <td class="td-num">${d.games}</td>
        <td class="td-num">${d.wins}W ${d.draws}D ${d.losses}L</td>
        <td class="td-num" style="color:var(--green)">${d.pts.toFixed(1)}</td>
        <td class="td-num" style="color:var(--red)">${d.ptsC.toFixed(1)}</td>
        <td class="td-num">${d.tries.toFixed(1)}</td>
        <td class="td-num" style="color:var(--red)">${d.triesC.toFixed(1)}</td>
        <td class="td-num" style="color:${d.pen>8?'var(--red)':d.pen>5?'#e0891a':'inherit'}">${d.pen.toFixed(1)}</td>
        <td class="td-num">${d.penW.toFixed(1)}</td>
        <td class="td-num">${loStr}</td>
        <td class="td-num">${d.scrumWpct!==null?d.scrumWpct+'%':'—'}</td>
        <td class="td-num">${d.to.toFixed(1)}</td>
      </tr>`;
    }).join('');
    // League average row
    const avgRow=(teamData.length>0)?`<tr style="background:#f0f5f1;font-weight:600;font-style:italic;border-top:2px solid var(--border)">
  <td style="font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--txt-faint)">League Avg</td>
  <td class="td-num">—</td>
  <td class="td-num">—</td>
  <td class="td-num" style="color:var(--green)">${(teamData.reduce((s,d)=>s+d.pts,0)/teamData.length).toFixed(1)}</td>
  <td class="td-num" style="color:var(--red)">${(teamData.reduce((s,d)=>s+d.ptsC,0)/teamData.length).toFixed(1)}</td>
  <td class="td-num">${(teamData.reduce((s,d)=>s+d.tries,0)/teamData.length).toFixed(1)}</td>
  <td class="td-num" style="color:var(--red)">${(teamData.reduce((s,d)=>s+d.triesC,0)/teamData.length).toFixed(1)}</td>
  <td class="td-num">${(teamData.reduce((s,d)=>s+d.pen,0)/teamData.length).toFixed(1)}</td>
  <td class="td-num">${(teamData.reduce((s,d)=>s+d.penW,0)/teamData.length).toFixed(1)}</td>
  <td class="td-num">${(() => { const vs=teamData.filter(d=>d.lo!==null); return vs.length?Math.round(vs.reduce((s,d)=>s+d.lo,0)/vs.length)+'%':'—'; })()}</td>
  <td class="td-num">${(() => { const vs=teamData.filter(d=>d.scrumWpct!==null); return vs.length?Math.round(vs.reduce((s,d)=>s+d.scrumWpct,0)/vs.length)+'%':'—'; })()}</td>
  <td class="td-num">${(teamData.reduce((s,d)=>s+d.to,0)/teamData.length).toFixed(1)}</td>
</tr>`:'';
    const byWeek=leagueAvgByWeek(ms);
    const chartDefs=[
      {label:'Avg Points/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.pts/w.games).toFixed(1):0}))},
      {label:'Avg Points Conceded/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.ptsC/w.games).toFixed(1):0}))},
      {label:'Avg Tries/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.tries/w.games).toFixed(1):0}))},
      {label:'Avg Pens Conceded/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.pen/w.games).toFixed(1):0}))},
      {label:'Avg Pens Won/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.penW/w.games).toFixed(1):0}))},
      {label:'Avg Free Kicks Conceded/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.fkC/w.games).toFixed(1):0}))},
      {label:'Avg Free Kicks Won/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.fkW/w.games).toFixed(1):0}))},
      {label:'Avg Lineouts/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.loT/w.games).toFixed(1):0}))},
      {label:'Lineout Win %',col:'#1a6b3e',pct:true,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.loT>0?Math.round(w.loW/w.loT*100):null}))},
      {label:'Avg Scrums/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.scrum/w.games).toFixed(1):0}))},
      {label:'Scrum Win %',col:'#1a6b3e',pct:true,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.scrumT>0?Math.round(w.scrumW/w.scrumT*100):null}))},
      {label:'Avg Turnovers Won/Game',col:'#1a6b3e',pct:false,data:byWeek.map(w=>({opp:`Wk ${w.week}`,date:w.date,v:w.games?+(w.to/w.games).toFixed(1):0}))},
    ];
    el.innerHTML=`
      <div class="page-hdr"><h2>Team Trends</h2><p>${teamN} — all teams</p></div>
      ${viewBtns}
      <div style="color:var(--txt-faint);font-size:11px;padding-bottom:9px;padding-left:2px">${ms.length} match${ms.length!==1?'es':''}</div>
      ${!allTids.length?'<div class="no-data">No data.</div>':`
      <div class="table-wrap"><table class="trend-table">
        <thead><tr>
          <th style="cursor:default">Team</th>
          ${thSort('games','P')}
          <th style="text-align:center;cursor:default">Record</th>
          ${thSort('pts','Pts/g')}
          ${thSort('ptsC','PtsC/g')}
          ${thSort('tries','Tries/g')}
          ${thSort('triesC','TrC/g')}
          ${thSort('pen','Pens/g')}
          ${thSort('penW','PenW/g')}
          ${thSort('lo','LO%')}
          ${thSort('scrumWpct','Scrum W%')}
          ${thSort('to','TO Won/g')}
        </tr></thead>
        <tbody>${teamRows}${avgRow}</tbody>
      </table></div>
      <div style="margin-top:20px">
        <div class="ctrl-lbl" style="margin-bottom:10px">League Weekly Averages</div>
        <div class="t-grid3" id="tr-charts-grid"></div>
      </div>`}`;
    setTimeout(()=>renderTRCharts('tr-charts-grid',chartDefs),50);
    return;
  }

  // ---- VIEW: Single Team ----
  const singleMs=ms.filter(m=>m.hid===SEL_TEAM||m.aid===SEL_TEAM);
  const rows=singleMs.map(m=>{
    const isHome=m.hid===SEL_TEAM;
    const opp=isHome?m.an:m.hn;
    const tScore=isHome?m.hs:m.as;const oScore=isHome?m.as:m.hs;
    const res=tScore>oScore?'W':tScore<oScore?'L':'D';
    const s=m.stats[SEL_TEAM]||{};
    const lo=s.loT>0?Math.round(s.loW/s.loT*100)+'%':'—';
    const tPts=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
    const scrumWpct=s.scrumT>0?Math.round(s.scrumW/s.scrumT*100)+'%':'—';
    return`<tr>
      <td><span class="week-pill">W${m.week}</span></td>
      <td style="white-space:nowrap;color:var(--txt-dim)">${fdate(m.date)}</td>
      <td class="tw">${opp}</td>
      <td>${isHome?'<span class="ha-h">H</span>':'<span class="ha-a">A</span>'}</td>
      <td><span class="res-${res.toLowerCase()}">${res}</span></td>
      <td class="score-cell">${tScore}–${oScore}</td>
      <td class="td-num" style="color:var(--green)">${tPts}</td>
      <td class="td-num">${s.tries||0}</td>
      <td class="td-num">${s.penG||0}</td>
      <td class="td-num" style="color:${(s.pen||0)>8?'var(--red)':(s.pen||0)>5?'#e0891a':'inherit'}">${s.pen||0}</td>
      <td class="td-num">${s.penW||0}</td>
      <td class="td-num">${s.fkC||0}</td>
      <td class="td-num">${s.fkW||0}</td>
      <td class="td-num">${lo}</td>
      <td class="td-num">${s.loT||0}</td>
      <td class="td-num">${s.scrum||0}</td>
      <td class="td-num">${scrumWpct}</td>
      <td class="td-num">${s.to||0}</td>
      <td class="td-num" style="${(s.yel||0)>0?'color:#e0891a':''}">${s.yel||0}</td>
      <td class="td-num" style="${(s.red||0)>0?'color:var(--red)':''}">${s.red||0}</td>
    </tr>`;
  });
  let totals={games:0,pts:0,tries:0,penG:0,pen:0,penW:0,fkC:0,fkW:0,loW:0,loT:0,scrum:0,scrumW:0,scrumT:0,to:0,yel:0,red:0};
  singleMs.forEach(m=>{const s=m.stats[SEL_TEAM]||{};totals.games++;totals.tries+=s.tries||0;totals.penG+=s.penG||0;totals.pen+=s.pen||0;totals.penW+=s.penW||0;totals.fkC+=s.fkC||0;totals.fkW+=s.fkW||0;totals.loW+=s.loW||0;totals.loT+=s.loT||0;totals.scrum+=s.scrum||0;totals.scrumW+=s.scrumW||0;totals.scrumT+=s.scrumT||0;totals.to+=s.to||0;totals.yel+=s.yel||0;totals.red+=s.red||0;totals.pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;});
  const g=totals.games||1;
  const avgsRow=totals.games?`<tr style="background:#f7fbf8;font-style:italic">
    <td colspan="4" style="text-align:right;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--txt-faint)">Average</td>
    <td></td><td></td>
    <td class="td-num" style="color:var(--green)">${(totals.pts/g).toFixed(1)}</td>
    <td class="td-num">${(totals.tries/g).toFixed(1)}</td>
    <td class="td-num">${(totals.penG/g).toFixed(1)}</td>
    <td class="td-num">${(totals.pen/g).toFixed(1)}</td>
    <td class="td-num">${(totals.penW/g).toFixed(1)}</td>
    <td class="td-num">${(totals.fkC/g).toFixed(1)}</td>
    <td class="td-num">${(totals.fkW/g).toFixed(1)}</td>
    <td class="td-num">${totals.loT>0?Math.round(totals.loW/totals.loT*100)+'%':'—'}</td>
    <td class="td-num">${(totals.loT/g).toFixed(1)}</td>
    <td class="td-num">${(totals.scrum/g).toFixed(1)}</td>
    <td class="td-num">${totals.scrumT>0?Math.round(totals.scrumW/totals.scrumT*100)+'%':'—'}</td>
    <td class="td-num">${(totals.to/g).toFixed(1)}</td>
    <td class="td-num">${(totals.yel/g).toFixed(1)}</td>
    <td class="td-num">${(totals.red/g).toFixed(1)}</td>
  </tr>`:'';
  const C='#1a6b3e';
  function mkDat(fn){return singleMs.map(m=>{const isHome=m.hid===SEL_TEAM;const s=m.stats[SEL_TEAM]||{};const tScore=isHome?m.hs:m.as,oScore=isHome?m.as:m.hs;const res=tScore>oScore?'W':tScore<oScore?'L':'D';return{opp:`W${m.week} vs ${isHome?m.an:m.hn}`,date:m.date,res,...fn(s,m,isHome,tScore,oScore)};});}
  const chartDefs=[
    {label:'Points Scored',col:C,pct:false,data:mkDat((s,m,ih,ts)=>({v:(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3}))},
    {label:'Points Conceded',col:C,pct:false,data:mkDat((s,m,ih,ts,os)=>({v:os}))},
    {label:'Tries Scored',col:C,pct:false,data:mkDat(s=>({v:s.tries||0}))},
    {label:'Pens Conceded',col:C,pct:false,data:mkDat(s=>({v:s.pen||0}))},
    {label:'Pens Won',col:C,pct:false,data:mkDat(s=>({v:s.penW||0}))},
    {label:'Free Kicks Conceded',col:C,pct:false,data:mkDat(s=>({v:s.fkC||0}))},
    {label:'Free Kicks Won',col:C,pct:false,data:mkDat(s=>({v:s.fkW||0}))},
    {label:'Lineouts',col:C,pct:false,data:mkDat(s=>({v:s.loT||0}))},
    {label:'Lineout Win %',col:C,pct:true,data:mkDat(s=>({v:s.loT>0?Math.round(s.loW/s.loT*100):null}))},
    {label:'Scrums',col:C,pct:false,data:mkDat(s=>({v:s.scrum||0}))},
    {label:'Scrum Win %',col:C,pct:true,data:mkDat(s=>({v:s.scrumT>0?Math.round(s.scrumW/s.scrumT*100):null}))},
    {label:'Turnovers Won',col:C,pct:false,data:mkDat(s=>({v:s.to||0}))},
  ];
  el.innerHTML=`
    <div class="page-hdr"><h2>Team Trends</h2><p>${teamN} — week by week</p></div>
    ${viewBtns}
    <div style="color:var(--txt-faint);font-size:11px;padding-bottom:9px;padding-left:2px">${singleMs.length} match${singleMs.length!==1?'es':''}</div>
    ${!singleMs.length?'<div class="no-data">No matches for this selection.</div>':`

// ===== CHART =====
function drawChart(canvas,data,opts={}){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||200,H=canvas.offsetHeight||130;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const P={t:16,r:10,b:42,l:30};const pw=W-P.l-P.r,ph=H-P.t-P.b;
  const vals=data.map(d=>d.v).filter(v=>v!=null&&!isNaN(v));
  if(!vals.length){ctx.fillStyle='#aaa';ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);return;}
  const mx=Math.max(...vals),mn=Math.min(...vals),sp=mx-mn||1;
  const yMn=0,yMx=opts.pct?100:Math.max(mx+sp*.25,1);
  const n=data.length;
  const xp=i=>P.l+(n<2?pw/2:i/(n-1)*pw);
  const yp=v=>v==null||isNaN(v)?null:P.t+ph*(1-(v-yMn)/(yMx-yMn));
  [0,1,2,3].forEach(i=>{
    const v=yMn+(yMx-yMn)*(i/3),y=yp(v);
    ctx.strokeStyle='#e8ede9';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+pw,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#aab5ad';ctx.font='9px Inter';ctx.textAlign='right';
    ctx.fillText(Math.round(v)+(opts.pct?'%':''),P.l-4,y+3);
  });
  const avgs=data.map((_,i)=>{const w=data.slice(Math.max(0,i-2),i+1).map(d=>d.v).filter(v=>v!=null&&!isNaN(v));return w.length?w.reduce((a,b)=>a+b,0)/w.length:null;});
  ctx.beginPath();ctx.strokeStyle=opts.lineCol||'rgba(26,107,62,.25)';ctx.lineWidth=2;let first=true;
  avgs.forEach((av,i)=>{const y=yp(av);if(y==null)return;first?(ctx.moveTo(xp(i),y),first=false):ctx.lineTo(xp(i),y);});ctx.stroke();
  const baseY=P.t+ph;
  data.forEach((d,i)=>{
    const v=d.v,x=xp(i),y=yp(v);if(y==null)return;
    const fill=d.res==='W'?'#1a6b3e':d.res==='L'?'#c0392b':'#7a8f80';
    ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='bold 11px Inter';ctx.fillStyle='#2a3a2e';ctx.textAlign='center';
    ctx.fillText(v==null?'':Math.round(v)+(opts.pct?'%':''),x,y-8);
    if(n<=10||i%2===0||i===n-1){
      const oppShort=(d.opp||'?').length>14?(d.opp||'?').slice(0,13)+'…':(d.opp||'?');
      ctx.save();ctx.translate(x,baseY+3);ctx.rotate(-Math.PI/4);
      ctx.font='7px Inter';ctx.fillStyle='#5a6e60';ctx.textAlign='right';
      ctx.fillText(oppShort,0,0);
      if(d.date){ctx.font='6px Inter';ctx.fillStyle='#9aad9f';ctx.fillText(fdate(d.date),0,8);}
      ctx.restore();
    }
  });
}

// dual-series line chart for league comparison
function drawChartDual(canvas,data1,data2,opts={}){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||200,H=canvas.offsetHeight||140;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const P={t:16,r:10,b:36,l:30};const pw=W-P.l-P.r,ph=H-P.t-P.b;
  const allVals=[...data1,...data2].map(d=>d.v).filter(v=>v!=null&&!isNaN(v));
  if(!allVals.length){ctx.fillStyle='#aaa';ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);return;}
  const yMn=0,yMx=Math.max(...allVals)*1.2||1;
  function xp(i,n){return P.l+(n<2?pw/2:i/(n-1)*pw);}
  function yp(v){return v==null?null:P.t+ph*(1-(v-yMn)/(yMx-yMn));}
  [0,1,2,3].forEach(i=>{
    const v=yMn+(yMx-yMn)*(i/3),y=yp(v);
    ctx.strokeStyle='#e8ede9';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+pw,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#aab5ad';ctx.font='9px Inter';ctx.textAlign='right';
    ctx.fillText(v.toFixed(1),P.l-4,y+3);
  });
  function drawLine(data,col){
    if(!data.length)return;
    const n=data.length;
    ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2;let first=true;
    data.forEach((d,i)=>{const y=yp(d.v);if(y==null)return;first?(ctx.moveTo(xp(i,n),y),first=false):ctx.lineTo(xp(i,n),y);});ctx.stroke();
    data.forEach((d,i)=>{const y=yp(d.v);if(y==null)return;
      ctx.beginPath();ctx.arc(xp(i,n),y,3.5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      const lbl=(d.opp||'').replace(/^Wk /,'');
      if(i===0||i===data.length-1||i%2===0){
        ctx.save();ctx.translate(xp(i,n),P.t+ph+3);ctx.rotate(-Math.PI/4);
        ctx.font='7px Inter';ctx.fillStyle='#5a6e60';ctx.textAlign='right';
        ctx.fillText('Wk '+(lbl||i+1),0,0);ctx.restore();
      }
    });
  }
  drawLine(data1,opts.lineCol1||'#2d7a4f');
  drawLine(data2,opts.lineCol2||'#e57373');
}

// ===== REFEREE =====
function renderRF(){
  const el=document.getElementById('rf');
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">👤</div><h2>No data yet</h2><p>Upload XML files to analyse referee patterns.</p></div>`;return;}
  const rs=refs();
  if(GLOBAL_FILTERS.ref)SEL_REF=GLOBAL_FILTERS.ref;
  if(!SEL_REF||!rs.find(r=>r.id===SEL_REF))SEL_REF=rs[0]?.id||null;
  const sr=rs.find(r=>r.id===SEL_REF);

  // Compute stats for this referee across all/selected matches
  let detH='';
  let pitchLocs=[],homePens=[],awayPens=[],homeCards=[],awayCards=[],homeFKs=[],awayFKs=[];
  let totalPen=0,totalFK=0,totalYel=0,totalRed=0,hPen=0,aPen=0;
  let ng=0;
  let rms=[];
  let selMatchObj=null;
  let homeLabel='Home',awayLabel='Away';

  if(sr){
    const gfBase=getFilteredMatches().filter(m=>m.rid===SEL_REF);
    rms=[...gfBase].sort((a,b)=>dsort(b.date)-dsort(a.date));
    ng=rms.length;
    // Validate SEL_REF_MATCHES (remove stale IDs)
    const validIds=new Set(rms.map(m=>matchDocId(m)));
    SEL_REF_MATCHES.forEach(id=>{if(!validIds.has(id))SEL_REF_MATCHES.delete(id);});

    let matchesToProcess=SEL_REF_MATCHES.size>0?rms.filter(m=>SEL_REF_MATCHES.has(matchDocId(m))):rms;
    // Apply card filter only when no specific games are manually selected (to avoid hiding explicitly-chosen games)
    if(SEL_REF_MATCHES.size===0){
      if(RF_CARD_FILTER==='yel')matchesToProcess=matchesToProcess.filter(m=>{const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};return(hs.yel||0)+(as2.yel||0)>0;});
      if(RF_CARD_FILTER==='red')matchesToProcess=matchesToProcess.filter(m=>{const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};return(hs.red||0)+(as2.red||0)>0;});
    }
    // Set team labels: use team names whenever exactly one match is in view
    if(matchesToProcess.length===1){homeLabel=matchesToProcess[0].hn;awayLabel=matchesToProcess[0].an;}
    selMatchObj=matchesToProcess.length===1?matchesToProcess[0]:null;
    const infT={},fkInfT={};

    matchesToProcess.forEach(m=>{
      const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};
      const hHasTime=(hs.timeline||[]).length>0,aHasTime=(as2.timeline||[]).length>0;
      const matchLabel=`${m.hn} v ${m.an} (${fdate(m.date)})`;

      // Home team
      if(RF_TEAM_FILTER===null||RF_TEAM_FILTER==='h'){
        if(hHasTime){
          const tl=(hs.timeline||[]).filter(p=>p.mins>=RF_TIME_FROM&&p.mins<=RF_TIME_TO);
          hPen+=tl.length;
          tl.forEach(p=>{if(p.type)infT[p.type]=(infT[p.type]||0)+1;});
          tl.forEach(p=>homePens.push({...p,match:matchLabel,teamName:m.hn}));
          const hfc=(hs.cards||[]).filter(c=>c.mins>=RF_TIME_FROM&&c.mins<=RF_TIME_TO);
          hfc.forEach(c=>homeCards.push({...c,match:matchLabel,teamName:m.hn}));
          totalYel+=hfc.filter(c=>c.cardType==='yellow').length;
          totalRed+=hfc.filter(c=>c.cardType==='red').length;
          (hs.fkTimeline||[]).filter(f=>f.mins>=RF_TIME_FROM&&f.mins<=RF_TIME_TO).forEach(f=>homeFKs.push({...f,match:matchLabel,teamName:m.hn}));
          (hs.locs||[]).filter(l=>l.mins>=RF_TIME_FROM&&l.mins<=RF_TIME_TO).forEach(l=>{pitchLocs.push({...l,team:m.hn,ha:'h'});});
        }else{
          hPen+=(hs.pen||0);
          Object.entries(hs.inf||{}).forEach(([k,v])=>{infT[k]=(infT[k]||0)+v;});
          (hs.locs||[]).forEach(l=>{pitchLocs.push({...l,team:m.hn,ha:'h'});});
          totalYel+=(hs.yel||0);totalRed+=(hs.red||0);
        }
        Object.entries(hs.fkInf||{}).forEach(([k,v])=>{fkInfT[k]=(fkInfT[k]||0)+v;});
        totalFK+=(hs.fkC||0);
      }

      // Away team
      if(RF_TEAM_FILTER===null||RF_TEAM_FILTER==='a'){
        if(aHasTime){
          const tl=(as2.timeline||[]).filter(p=>p.mins>=RF_TIME_FROM&&p.mins<=RF_TIME_TO);
          aPen+=tl.length;
          tl.forEach(p=>{if(p.type)infT[p.type]=(infT[p.type]||0)+1;});
          tl.forEach(p=>awayPens.push({...p,match:matchLabel,teamName:m.an}));
          const afc=(as2.cards||[]).filter(c=>c.mins>=RF_TIME_FROM&&c.mins<=RF_TIME_TO);
          afc.forEach(c=>awayCards.push({...c,match:matchLabel,teamName:m.an}));
          totalYel+=afc.filter(c=>c.cardType==='yellow').length;
          totalRed+=afc.filter(c=>c.cardType==='red').length;
          (as2.fkTimeline||[]).filter(f=>f.mins>=RF_TIME_FROM&&f.mins<=RF_TIME_TO).forEach(f=>awayFKs.push({...f,match:matchLabel,teamName:m.an}));
          (as2.locs||[]).filter(l=>l.mins>=RF_TIME_FROM&&l.mins<=RF_TIME_TO).forEach(l=>{pitchLocs.push({...l,team:m.an,ha:'a'});});
        }else{
          aPen+=(as2.pen||0);
          Object.entries(as2.inf||{}).forEach(([k,v])=>{infT[k]=(infT[k]||0)+v;});
          (as2.locs||[]).forEach(l=>{pitchLocs.push({...l,team:m.an,ha:'a'});});
          totalYel+=(as2.yel||0);totalRed+=(as2.red||0);
        }
        Object.entries(as2.fkInf||{}).forEach(([k,v])=>{fkInfT[k]=(fkInfT[k]||0)+v;});
        totalFK+=(as2.fkC||0);
      }

    totalPen=hPen+aPen;
    const gCount=matchesToProcess.length;
    RF_CURRENT_GCOUNT=gCount;

function drawPitch(canvas,locs){
  const dpr=window.devicePixelRatio||1;
  const H=canvas.offsetHeight||320;
  const W=Math.round(H*70/90);
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);

  // Portrait: pitch width (0-70) → canvas x; pitch length (5-95, try line to try line) → canvas y (inverted)
  // 0 and 100 labels displayed at the try lines; dead-ball zones not shown
  const PAD=10,PW=W-PAD*2,PH=H-PAD*2;
  PITCH_HOVER_DATA={locs:locs||[],W,H,PAD,PW,PH};
  const cpx=y=>PAD+(y/70)*PW;
  const cpy=x=>PAD+PH-((x-5)/90)*PH;  // x=5 → canvas bottom, x=95 → canvas top

  // ====== BACKGROUND ======
  ctx.fillStyle='#2b2e38';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#363a47';ctx.fillRect(PAD,PAD,PW,PH);

  // ====== HELPERS ======
  const W1='rgba(255,255,255,.85)';
  const W2='rgba(255,255,255,.48)';
  const W3='rgba(255,255,255,.28)';
  function hl(x,col,lw,dash){
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash||[]);
    ctx.beginPath();ctx.moveTo(PAD,cpy(x));ctx.lineTo(PAD+PW,cpy(x));ctx.stroke();
    ctx.setLineDash([]);
  }
  function vl(y,xa,xb,col,lw){
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(cpx(y),cpy(xa));ctx.lineTo(cpx(y),cpy(xb));ctx.stroke();
  }

  // ====== PITCH LINES ======
  // Canvas border IS the try lines (x=5 and x=95 in Opta coords, displayed as 0 and 100)
  ctx.strokeStyle=W1;ctx.lineWidth=1.2;ctx.setLineDash([]);
  ctx.strokeRect(PAD,PAD,PW,PH);
  hl(22,W1,0.9);hl(78,W1,0.9);
  hl(40,W2,0.75,[4,4]);hl(60,W2,0.75,[4,4]);
  hl(50,W1,0.9);

  // ====== LINEOUT MARKERS ======
  const tk=Math.max(2.5,PW/55);
  function tMark(x,ch,dir){ // T-mark pointing dir(+1=down/-1=up)
    const px=cpx(ch),py=cpy(x);
    ctx.strokeStyle=W2;ctx.lineWidth=0.8;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px-tk,py);ctx.lineTo(px+tk,py);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+dir*tk*1.6);ctx.stroke();
  }
  function plusMark(x,ch){
    const px=cpx(ch),py=cpy(x);
    ctx.strokeStyle=W2;ctx.lineWidth=0.8;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px-tk,py);ctx.lineTo(px+tk,py);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py-tk);ctx.lineTo(px,py+tk);ctx.stroke();
  }
  function dashMark(x,ch){
    const px=cpx(ch),py=cpy(x);
    ctx.strokeStyle=W3;ctx.lineWidth=0.8;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px-tk,py);ctx.lineTo(px+tk,py);ctx.stroke();
  }
  // T marks: 10m inside from each try line (x=15 bottom, x=85 top), pointing into field
  [5,15,55,65].forEach(ch=>{tMark(15,ch,1);tMark(85,ch,-1);});
  dashMark(15,35);dashMark(85,35);
  // At 22m, 40m, 60m, 78m: plus marks at channel positions
  [22,40,60,78].forEach(x=>{
    [5,15,55,65].forEach(ch=>plusMark(x,ch));
    dashMark(x,35);
  });

  // ====== GOAL POSTS ======
  // Parallel angled lines (same direction), cross piece at field end (try line)
  // Posts are centred at y=35 (pitch width), spread ±3 units
  const pHalf=cpx(35+3)-cpx(35);
  const pC=cpx(35);
  const postAngleX=pHalf*0.6;  // horizontal offset for top of post (angled away from centre)
  ctx.strokeStyle=W2;ctx.lineWidth=0.85;ctx.setLineDash([]);
  // Top posts (in-goal at x=100 end): cross at try-line (x=95), uprights angle into in-goal
  const tCross=cpy(95),tTip=cpy(100)+2;
  // Left post: parallel angled — base slightly left of centre, top further left
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,tCross);ctx.lineTo(pC-pHalf*0.5-postAngleX,tTip);ctx.stroke();
  // Right post: same angle
  ctx.beginPath();ctx.moveTo(pC+pHalf*0.5,tCross);ctx.lineTo(pC+pHalf*0.5-postAngleX,tTip);ctx.stroke();
  // Cross bar at field end (try line)
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,tCross);ctx.lineTo(pC+pHalf*0.5,tCross);ctx.stroke();
  // Bottom posts (in-goal at x=0 end): cross at try-line (x=5), uprights angle into in-goal
  const bCross=cpy(5),bTip=cpy(0)-2;
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,bCross);ctx.lineTo(pC-pHalf*0.5+postAngleX,bTip);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pC+pHalf*0.5,bCross);ctx.lineTo(pC+pHalf*0.5+postAngleX,bTip);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,bCross);ctx.lineTo(pC+pHalf*0.5,bCross);ctx.stroke();

  // ====== LABELS ======
  // Try lines displayed as 0 and 100; 22m lines as 22/78; halfway as 50
  ctx.fillStyle=W2;ctx.font='7px Inter';ctx.textAlign='right';
  [[5,'0'],[22,'22'],[50,'50'],[78,'78'],[95,'100']].forEach(([x,l])=>{
    ctx.fillText(l,PAD-2,cpy(x)+3);
  });

  // ====== DOTS ======
  const dotR=Math.max(2,Math.min(PW,PH)/60);
  function drawDots(dotLocs,alpha){
    dotLocs.forEach(l=>{
      const cx=cpx(l.y),cy=cpy(l.x);
      const col=INF_C[l.type]||'#e06020';
      ctx.globalAlpha=0.9*alpha;
      ctx.beginPath();ctx.arc(cx,cy,dotR,0,Math.PI*2);
      ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=0.5;ctx.stroke();
      ctx.globalAlpha=1;
    });
  }

  // ====== SELECTION ======
  const cornerR=4.5;
  if(pitchSelIsFull()){
    // Full pitch selected: draw all dots normally, white corner handles as drag affordance
    drawDots(locs,1);
    [[PAD,PAD],[PAD+PW,PAD],[PAD,PAD+PH],[PAD+PW,PAD+PH]].forEach(([hx,hy])=>{
      ctx.beginPath();ctx.arc(hx,hy,cornerR,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
    });
  }else{
    const {x0,x1,y0,y1}=PITCH_SEL;
    const sx=Math.min(cpx(x0),cpx(x1));
    const sw=Math.abs(cpx(x1)-cpx(x0));
    const sy=Math.min(cpy(y0),cpy(y1));
    const sh=Math.abs(cpy(y1)-cpy(y0));
    drawDots(PITCH_ALL_LOCS,0.18);
    ctx.save();
    ctx.beginPath();
    ctx.rect(PAD,PAD,PW,PH);
    ctx.rect(sx,sy,sw,sh);
    ctx.fillStyle='rgba(0,0,0,.52)';
    ctx.fill('evenodd');
    ctx.restore();
    ctx.save();
    ctx.beginPath();ctx.rect(sx,sy,sw,sh);ctx.clip();
    drawDots(locs,1);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle='rgba(40,220,160,.95)';ctx.lineWidth=2;ctx.setLineDash([]);
    ctx.strokeRect(sx,sy,sw,sh);
    [[sx,sy],[sx+sw,sy],[sx,sy+sh],[sx+sw,sy+sh]].forEach(([hx,hy])=>{
      ctx.beginPath();ctx.arc(hx,hy,cornerR,0,Math.PI*2);
      ctx.fillStyle='rgba(40,220,160,.95)';ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();
    });
    ctx.restore();
  }

  if(locs.length){
    ctx.fillStyle=W2;ctx.font='7px Inter';ctx.textAlign='left';
    ctx.fillText(locs.length+' pts',PAD+3,PAD+10);
  }
  if(!locs.length){
    ctx.fillStyle=W2;ctx.font='9px Inter';ctx.textAlign='center';
    ctx.fillText('No penalty locations',W/2,H/2+3);
  }
}
function pitchPxToCoord(mx,my,canvas){
  const PAD=10;
  const PW=canvas.offsetWidth-PAD*2,PH=canvas.offsetHeight-PAD*2;
  const py=((mx-PAD)/PW)*70;              // pitch width 0-70
  const px=5+(1-((my-PAD)/PH))*90;        // pitch length 5-95 (try line to try line, inverted)
  return{px:Math.max(5,Math.min(95,px)),py:Math.max(0,Math.min(70,py))};
}
function pitchMouseDown(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.offsetWidth/rect.width);
  const my=(e.clientY-rect.top)*(canvas.offsetHeight/rect.height);
  const PAD=10,PW=canvas.offsetWidth-PAD*2,PH=canvas.offsetHeight-PAD*2;
  const cpx=y=>PAD+(y/70)*PW,cpy=x=>PAD+PH-((x-5)/90)*PH;
  if(pitchSelIsFull()){
    // Drag from canvas corners to shrink the selection
    const corners=[
      {id:'tl',cx:PAD,cy:PAD},{id:'tr',cx:PAD+PW,cy:PAD},
      {id:'bl',cx:PAD,cy:PAD+PH},{id:'br',cx:PAD+PW,cy:PAD+PH},
    ];
    const hit=corners.find(c=>Math.hypot(mx-c.cx,my-c.cy)<12);
    if(hit){PITCH_SEL.dragging=true;PITCH_SEL.corner=hit.id;return;}
  }else{
    const {x0,x1,y0,y1}=PITCH_SEL;
    const corners=[
      {id:'tl',cx:cpx(x0),cy:cpy(y1)},{id:'tr',cx:cpx(x1),cy:cpy(y1)},
      {id:'bl',cx:cpx(x0),cy:cpy(y0)},{id:'br',cx:cpx(x1),cy:cpy(y0)},
    ];
    const hit=corners.find(c=>Math.hypot(mx-c.cx,my-c.cy)<12);
    if(hit){PITCH_SEL.dragging=true;PITCH_SEL.corner=hit.id;return;}
  }
  // Click elsewhere: reset to full pitch
  pitchSelReset();
  PITCH_FILTERED_LOCS=[...PITCH_ALL_LOCS];
  drawPitch(canvas,PITCH_FILTERED_LOCS);
  updateRFZoneStats();
  const btn=document.getElementById('pitch-clear-sel');if(btn)btn.style.display='none';
}
function pitchMouseMove(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.offsetWidth/rect.width);
  const my=(e.clientY-rect.top)*(canvas.offsetHeight/rect.height);
  if(PITCH_SEL.dragging){
    const {px,py}=pitchPxToCoord(mx,my,canvas);
    const c=PITCH_SEL.corner;
    if(c==='br'||c==='tr')PITCH_SEL.x1=py;else PITCH_SEL.x0=py;  // x = pitch width
    if(c==='br'||c==='bl')PITCH_SEL.y0=px;else PITCH_SEL.y1=px;  // y = pitch length
    PITCH_SEL.active=true;
    drawPitch(canvas,PITCH_FILTERED_LOCS);
    return;
  }
  pitchHover(e,canvas);
}
function pitchMouseUp(e,canvas){
  if(!PITCH_SEL.dragging)return;
  PITCH_SEL.dragging=false;
  if(PITCH_SEL.active){
    if(PITCH_SEL.x0>PITCH_SEL.x1){const t=PITCH_SEL.x0;PITCH_SEL.x0=PITCH_SEL.x1;PITCH_SEL.x1=t;}
    if(PITCH_SEL.y0>PITCH_SEL.y1){const t=PITCH_SEL.y0;PITCH_SEL.y0=PITCH_SEL.y1;PITCH_SEL.y1=t;}
    const w=PITCH_SEL.x1-PITCH_SEL.x0,h=PITCH_SEL.y1-PITCH_SEL.y0;
    if(w<3&&h<3){
      pitchSelReset();PITCH_FILTERED_LOCS=[...PITCH_ALL_LOCS];
      const btn=document.getElementById('pitch-clear-sel');if(btn)btn.style.display='none';
    }else{
      PITCH_FILTERED_LOCS=PITCH_ALL_LOCS.filter(l=>
        l.y>=PITCH_SEL.x0&&l.y<=PITCH_SEL.x1&&l.x>=PITCH_SEL.y0&&l.x<=PITCH_SEL.y1);
      const btn=document.getElementById('pitch-clear-sel');if(btn)btn.style.display='inline-block';
    }
    drawPitch(canvas,PITCH_FILTERED_LOCS);
    updateRFZoneStats();
  }
}
function pitchHover(e,canvas){
  const tip=document.getElementById('pitch-tip');if(!tip)return;
  const rect=canvas.getBoundingClientRect();
  const {locs,W,H,PAD,PW,PH}=PITCH_HOVER_DATA;
  const cpx=y=>PAD+(y/70)*PW;
  const cpy=x=>PAD+PH-((x-5)/90)*PH;
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  let nearest=null,minD=22;
  locs.forEach(l=>{const d=Math.hypot(mx-cpx(l.y),my-cpy(l.x));if(d<minD){minD=d;nearest=l;}});
  if(nearest){
    const tn=INF_L[String(nearest.type)]||'Penalty';
    const tm=nearest.mins>0?` · ${nearest.mins}'`:'';
    const tt=nearest.team?` · ${nearest.team}`:'';
    tip.innerHTML=`<strong>${tn}</strong>${tm}${tt}`;
    tip.style.display='block';
    tip.style.left=(e.clientX-rect.left+14)+'px';
    tip.style.top=Math.max(0,e.clientY-rect.top-46)+'px';
  }else tip.style.display='none';
}
function drawTimeline(canvas,homePens,awayPens,homeCards,awayCards,tFrom,tTo,homeLabel,awayLabel,homeFKs,awayFKs){
  homeFKs=homeFKs||[];awayFKs=awayFKs||[];
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||400,H=canvas.offsetHeight||160;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.fillStyle='#f7fbf8';ctx.fillRect(0,0,W,H);
  const PL=80,PR=10,PT=8,PB=22;
  const PW=W-PL-PR,PH=H-PT-PB;
  const halfH=PH/2,midY=PT+halfH;
  const span=Math.max(tTo-tFrom,1);
  const xp=m=>PL+((m-tFrom)/span)*PW;
  // Row Y positions: cards outer → FKs middle → penalties inner (near center)
  const homeCardY=PT+halfH*0.15;   // cards: top of upper band
  const homeFKY  =PT+halfH*0.48;   // free kicks: middle of upper band
  const homePenY =PT+halfH*0.82;   // penalties: near center (upper)
  const awayPenY =midY+halfH*0.18; // penalties: near center (lower)
  const awayFKY  =midY+halfH*0.52; // free kicks: middle of lower band
  const awayCardY=midY+halfH*0.85; // cards: bottom of lower band
  // Team + row labels on the left
  ctx.textAlign='right';
  const hLbl=(homeLabel||'Home').slice(0,14);
  const aLbl=(awayLabel||'Away').slice(0,14);
  ctx.fillStyle='#3a6b50';ctx.font='bold 7px Inter';
  ctx.fillText(hLbl,PL-4,PT+halfH*0.48+3);
  ctx.fillText(aLbl,PL-4,midY+halfH*0.52+3);
  // Tiny row labels
  const RL_COL='#9aad9f';
  ctx.fillStyle=RL_COL;ctx.font='6px Inter';
  ctx.fillText('YC',PL-4,homeCardY+2);
  ctx.fillText('FK',PL-4,homeFKY+2);
  ctx.fillText('PEN',PL-4,homePenY+2);
  ctx.fillText('PEN',PL-4,awayPenY+2);
  ctx.fillText('FK',PL-4,awayFKY+2);
  ctx.fillText('YC',PL-4,awayCardY+2);
  // Band backgrounds
  ctx.fillStyle='rgba(26,107,62,.04)';ctx.fillRect(PL,PT,PW,halfH-0.5);
  ctx.fillStyle='rgba(60,91,219,.04)';ctx.fillRect(PL,midY+0.5,PW,halfH-0.5);
  // Mid divider
  ctx.strokeStyle='#dce8dc';ctx.lineWidth=1;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(PL,midY);ctx.lineTo(PL+PW,midY);ctx.stroke();
  // Outer border
  ctx.strokeStyle='#dce8dc';ctx.strokeRect(PL,PT,PW,PH);
  // Minute gridlines + labels
  const step=span<=40?5:10;
  for(let m=Math.ceil(tFrom/step)*step;m<=tTo;m+=step){
    const x=xp(m);
    ctx.strokeStyle='#e8ede9';ctx.lineWidth=1;ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+PH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#9aad9f';ctx.font='7px Inter';ctx.textAlign='center';
    ctx.fillText(m+"'",x,H-PB+10);
  }
  // Half-time line at 40
  if(tFrom<40&&tTo>40){
    const x=xp(40);ctx.strokeStyle='rgba(26,107,62,.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+PH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(26,107,62,.5)';ctx.font='6.5px Inter';ctx.textAlign='center';ctx.fillText('HT',x,PT+7);
  }
  // 80' regular-time marker
  if(tFrom<80&&tTo>80){
    const x=xp(80);ctx.strokeStyle='rgba(180,80,50,.35)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+PH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(180,80,50,.55)';ctx.font='6.5px Inter';ctx.textAlign='center';ctx.fillText('80\'',x,PT+7);
  }
  // Plot dots in a clean row sorted by minute
  const dots=[];
  function plotPens(pens,penY,teamLabel){
    const sorted=[...pens].sort((a,b)=>a.mins-b.mins);
    sorted.forEach(p=>{
      const x=xp(p.mins);if(x<PL-2||x>PL+PW+2)return;
      const col=INF_C[p.type]||'#9aad9f';
      ctx.beginPath();ctx.arc(x,penY,4,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.stroke();
      dots.push({cx:x,cy:penY,mins:p.mins,type:p.type,team:teamLabel});
    });
  }
  function plotCards(cards,cardY,teamLabel){
    const sorted=[...cards].sort((a,b)=>a.mins-b.mins);
    let prevBaseX=null;let sameGroupOffset=0;
    sorted.forEach(c=>{
      const baseX=xp(c.mins);if(baseX<PL-2||baseX>PL+PW+2)return;
      if(prevBaseX!==null&&Math.abs(baseX-prevBaseX)<8){sameGroupOffset+=8;}else{sameGroupOffset=0;}
      const x=baseX+sameGroupOffset;
      prevBaseX=baseX;
      const col=c.cardType==='red'?'#cc2200':'#fcdc01';
      const cw=6,ch=8;
      ctx.fillStyle=col;
      ctx.fillRect(x-cw/2,cardY-ch/2,cw,ch);
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=0.6;
      ctx.strokeRect(x-cw/2,cardY-ch/2,cw,ch);
      dots.push({cx:x,cy:cardY,mins:c.mins,type:c.cardType==='red'?'red':'yellow',isCard:true,team:teamLabel});
    });
  }
  function plotFKs(fks,fkY,teamLabel){
    const sorted=[...fks].sort((a,b)=>a.mins-b.mins);
    sorted.forEach(f=>{
      const x=xp(f.mins);if(x<PL-2||x>PL+PW+2)return;
      const s=4; // half-size of diamond
      ctx.beginPath();ctx.moveTo(x,fkY-s);ctx.lineTo(x+s,fkY);ctx.lineTo(x,fkY+s);ctx.lineTo(x-s,fkY);ctx.closePath();
      ctx.fillStyle='#3a9aa0';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.stroke();
      dots.push({cx:x,cy:fkY,mins:f.mins,type:f.type,isFK:true,team:teamLabel});
    });
  }
  plotCards(homeCards||[],homeCardY,homeLabel||'Home');
  plotFKs(homeFKs,homeFKY,homeLabel||'Home');
  plotPens(homePens,homePenY,homeLabel||'Home');
  plotPens(awayPens,awayPenY,awayLabel||'Away');
  plotFKs(awayFKs,awayFKY,awayLabel||'Away');
  plotCards(awayCards||[],awayCardY,awayLabel||'Away');
  canvas._tlDots=dots;canvas._tlDpr=dpr;
  if(!homePens.length&&!awayPens.length&&!(homeCards||[]).length&&!(awayCards||[]).length&&!homeFKs.length&&!awayFKs.length){
    ctx.fillStyle='#9aad9f';ctx.font='10px Inter';ctx.textAlign='center';
    ctx.fillText('Re-upload XML files to enable timeline data',W/2,H/2);
  }
}

function timelineMouseMove(e,canvas){
  const tip=document.getElementById('tl-tip');if(!tip)return;
  const rect=canvas.getBoundingClientRect();
  const dpr=canvas._tlDpr||window.devicePixelRatio||1;
  const scaleX=canvas.width/(rect.width*dpr);
  const scaleY=canvas.height/(rect.height*dpr);
  const mx=(e.clientX-rect.left)*scaleX*(dpr);
  const my=(e.clientY-rect.top)*scaleY*(dpr);
  const dots=canvas._tlDots||[];
  let nearest=null,minD=16;
  dots.forEach(d=>{
    const dist=Math.sqrt((d.cx-mx/dpr)**2+(d.cy-my/dpr)**2);
    if(dist<minD){minD=dist;nearest=d;}
  });
  if(nearest){
    const label=nearest.isCard?(nearest.type==='red'?'🟥 Red Card':'🟨 Yellow Card'):nearest.isFK?('◆ Free Kick'+(nearest.type?(' — '+(INF_L[nearest.type]||'Code '+nearest.type)):'')):(INF_L[nearest.type]||('Code '+nearest.type)||'Penalty');
    tip.innerHTML=`<strong>${nearest.mins}'</strong> · ${label}<br><span style="color:rgba(255,255,255,.6);font-size:10px">${nearest.team}</span>`;
    tip.style.display='block';
    const tx=e.clientX-rect.left+12;
    const ty=e.clientY-rect.top-48;
    tip.style.left=Math.min(tx,rect.width-180)+'px';
    tip.style.top=Math.max(ty,4)+'px';
  }else{
    tip.style.display='none';
  }
}

// ===== VALIDATION =====
function validateMatch(m){
  const warnings=[];
  const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};
  if(!m.hid||!m.aid)warnings.push('Missing team IDs');
  if(!m.date)warnings.push('Missing match date');
  if(!m.rn||m.rn==='Unknown')warnings.push('Referee not identified');
  const totalActivity=(hs.pen||0)+(as2.pen||0)+(hs.tries||0)+(as2.tries||0)+(hs.fkC||0)+(as2.fkC||0)+(hs.yel||0)+(as2.yel||0);
  if(totalActivity===0)warnings.push('No events extracted — file may be incomplete or use unexpected action codes');
  else if((hs.pen||0)+(as2.pen||0)===0&&(m.rowCount||0)>100)warnings.push('0 penalties from '+m.rowCount+' rows — check qualifier4 codes');
  if((hs.tries||0)+(as2.tries||0)===0&&(m.hs||0)+(m.as||0)>0)warnings.push('Score exists but no tries found');
  return{warnings};
}

      const cfg=cfgSnap.data();
      DBX_REFRESH_TOKEN=cfg.refresh_token||'';
      DBX_APP_KEY=cfg.app_key||'';
      DBX_FOLDER=cfg.folder||'';
      // Legacy plain token fallback
      if(!DBX_REFRESH_TOKEN&&cfg.token)DBX_TOKEN=cfg.token;
    }
    const logSnap=await FIRESTORE.doc('config/dropbox_log').get();
    if(logSnap.exists){const log=logSnap.data();if(log.entries)DBX_IMPORT_LOG=log.entries;}
  }catch(e){}
}

async function dbxGetValidToken(){
  if(DBX_TOKEN&&Date.now()<DBX_TOKEN_EXPIRY-60000)return DBX_TOKEN;
  if(DBX_REFRESH_TOKEN&&DBX_APP_KEY){
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'refresh_token',refresh_token:DBX_REFRESH_TOKEN,client_id:DBX_APP_KEY})
    });
    if(r.ok){
      const d=await r.json();
      DBX_TOKEN=d.access_token;
      DBX_TOKEN_EXPIRY=Date.now()+(d.expires_in||14400)*1000;
      return DBX_TOKEN;
    }
    throw new Error('Token refresh failed — please reconnect Dropbox');
  }
  if(DBX_TOKEN)return DBX_TOKEN;
  throw new Error('Not connected to Dropbox');
}

function dbxB64Url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function dbxStartOAuth(){
  const appKey=(document.getElementById('dbx-app-key')||{}).value?.trim();
  const folder=(document.getElementById('dbx-folder-input')||{}).value||'';
  if(!appKey){toast('Enter your App Key first','err');return;}
  DBX_APP_KEY=appKey;DBX_FOLDER=folder;
  await FIRESTORE.doc('config/dropbox').set({app_key:appKey,folder,refresh_token:DBX_REFRESH_TOKEN||''});
  const verifier=dbxB64Url(crypto.getRandomValues(new Uint8Array(96)));
  const challenge=dbxB64Url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  sessionStorage.setItem('dbx_pkce_verifier',verifier);
  const params=new URLSearchParams({
    response_type:'code',client_id:appKey,redirect_uri:dbxRedirectUri(),
    code_challenge:challenge,code_challenge_method:'S256',token_access_type:'offline'
  });
  window.location.href='https://www.dropbox.com/oauth2/authorize?'+params;
}

async function dbxHandleOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  if(!code)return;
  history.replaceState({},'',window.location.pathname);
  const verifier=sessionStorage.getItem('dbx_pkce_verifier');
  sessionStorage.removeItem('dbx_pkce_verifier');
  if(!verifier){toast('OAuth session expired — please try connecting again','err');return;}
  await loadDropboxConfig();
  if(!DBX_APP_KEY){toast('App Key missing — please re-enter it','err');return;}
  try{
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({code,grant_type:'authorization_code',client_id:DBX_APP_KEY,redirect_uri:dbxRedirectUri(),code_verifier:verifier})
    });
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error_description||'Auth failed');}
    const d=await r.json();
    DBX_REFRESH_TOKEN=d.refresh_token||'';
    DBX_TOKEN=d.access_token||'';
    DBX_TOKEN_EXPIRY=Date.now()+(d.expires_in||14400)*1000;
    await FIRESTORE.doc('config/dropbox').set({app_key:DBX_APP_KEY,folder:DBX_FOLDER,refresh_token:DBX_REFRESH_TOKEN});
    toast('Dropbox connected — you\'ll never need to do this again!','ok');
  }catch(e){toast('Dropbox auth failed: '+e.message,'err');}
}

async function dbxDisconnect(){
  DBX_TOKEN='';DBX_REFRESH_TOKEN='';DBX_TOKEN_EXPIRY=0;

        r=await fetch('https://api.dropboxapi.com/2/files/list_folder',{

        });

          method:'POST',
          headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({cursor})

function dropboxImportAll(){

async function dropboxImportPaths(paths){
  const pd=document.getElementById('dbx-progress'),pf=document.getElementById('dbx-prog-fill'),pl=document.getElementById('dbx-prog-lbl'),rpt=document.getElementById('dbx-report');
  if(pd)pd.style.display='block';
  let token;
  try{token=await dbxGetValidToken();}catch(e){toast(e.message,'err');if(pd)pd.style.display='none';return;}
  const results=[];
  for(let i=0;i<paths.length;i++){
    const path=paths[i];
    const fname=path.split('/').pop();
    if(pl)pl.textContent=`Downloading ${fname} (${i+1}/${paths.length})…`;
    if(pf)pf.style.width=Math.round((i/paths.length)*100)+'%';
    try{
      const r=await fetch('https://content.dropboxapi.com/2/files/download',{
        method:'POST',headers:{'Authorization':'Bearer '+token,'Dropbox-API-Arg':JSON.stringify({path})}
      });
      if(!r.ok){results.push({fname,status:'err',msg:'Download failed (HTTP '+r.status+')',warnings:[]});continue;}
      const text=await r.text();
      const matches=parseXML(text,fname);
      if(!matches.length){results.push({fname,status:'warn',msg:'No matches found in file',warnings:['File parsed but contained no FXID match blocks']});continue;}
      let added=0,updated=0,allWarnings=[];
      for(const m of matches){
        const v=validateMatch(m);
        if(v.warnings.length)allWarnings.push(...v.warnings.map(w=>`${m.hn} v ${m.an}: ${w}`));
        const id=matchDocId(m),existIdx=MATCHES.findIndex(x=>matchDocId(x)===id);
        await saveMatchToDB(m);
        if(existIdx>=0){MATCHES[existIdx]=m;updated++;}else{MATCHES.push(m);added++;}
      }
      const fEntry=_dbxFiles.find(f=>f.path_lower===path);
      if(fEntry){DBX_IMPORT_LOG[path]={modified:fEntry.server_modified,added,updated};await FIRESTORE.doc('config/dropbox_log').set({entries:DBX_IMPORT_LOG});}
      const summary=`${matches.length} match${matches.length!==1?'es':''} · ${added} added, ${updated} updated${allWarnings.length?' · ⚠ '+allWarnings.length+' warning(s)':''}`;
      results.push({fname,status:allWarnings.length?'warn':'ok',msg:summary,warnings:allWarnings});
    }catch(e2){results.push({fname,status:'err',msg:e2.message,warnings:[]});}
  }
  if(pf)pf.style.width='100%';if(pl)pl.textContent='Done!';
  setTimeout(()=>{if(pd)pd.style.display='none';if(pf)pf.style.width='0%';},1200);
  if(rpt)rpt.innerHTML=results.map(r=>{
    const ic=r.status==='ok'?'✓':r.status==='warn'?'⚠':'✗';
    const col=r.status==='ok'?'#1a6b3e':r.status==='warn'?'#d4860e':'#c0392b';
    const wH=(r.warnings||[]).map(w=>`<div style="font-size:10px;color:var(--txt-dim)">— ${w}</div>`).join('');
    return`<div class="val-row ${r.status==='ok'?'val-ok':r.status==='warn'?'val-warn':'val-err'}">
      <div class="val-ic">${ic}</div>
      <div><div><strong>${r.fname}</strong> <span style="color:var(--txt-dim);font-weight:400">${r.msg}</span></div>${wH?`<div class="val-warns">${wH}</div>`:''}</div></div>`;
  }).join('');
  const ok=results.filter(r=>r.status!=='err').length;
  toast(`Imported ${ok}/${results.length} files`,'ok');
  renderData();renderOV();
}

document.getElementById('xml-fi').addEventListener('change',e=>handleXMLFiles(e.target.files));
async function handleXMLFiles(files){
  const arr=Array.from(files).filter(f=>f.name.toLowerCase().endsWith('.xml'));
  if(!arr.length){toast('No XML files found','err');return;}
  const pd=document.getElementById('upload-progress'),pf=document.getElementById('prog-fill'),pl=document.getElementById('prog-lbl');

  if(pd)pd.style.display='block';

  const results=[];
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    if(pl)pl.textContent=`Processing ${f.name} (${i+1}/${arr.length})…`;
    if(pf)pf.style.width=Math.round((i/arr.length)*100)+'%';
    await new Promise(res=>{
      const r=new FileReader();
      r.onload=async e=>{
        try{
          const matches=parseXML(e.target.result,f.name);
          if(!matches.length){results.push({fname:f.name,status:'warn',msg:'No matches found in file',warnings:['File parsed but contained no FXID match blocks']});res();return;}
          let added=0,updated=0,allWarnings=[];
          for(const m of matches){
            const v=validateMatch(m);
            if(v.warnings.length)allWarnings.push(...v.warnings.map(w=>`${m.hn} v ${m.an}: ${w}`));
            const id=matchDocId(m),existIdx=MATCHES.findIndex(x=>matchDocId(x)===id);
            await saveMatchToDB(m);
            if(existIdx>=0){MATCHES[existIdx]=m;updated++;}else{MATCHES.push(m);added++;}
          }
          const summary=`${matches.length} match${matches.length!==1?'es':''} · ${added} added, ${updated} updated${allWarnings.length?' · ⚠ '+allWarnings.length+' warning(s)':''}`;
          results.push({fname:f.name,status:allWarnings.length?'warn':'ok',msg:summary,warnings:allWarnings});
        }catch(e2){results.push({fname:f.name,status:'err',msg:e2.message,warnings:[]});}
        res();
      };
      r.readAsText(f);
    });
  }
  if(pf)pf.style.width='100%';if(pl)pl.textContent='Done!';
  setTimeout(()=>{if(pd)pd.style.display='none';if(pf)pf.style.width='0%';},1200);
  if(rpt)rpt.innerHTML=results.map(r=>{
    const ic=r.status==='ok'?'✓':r.status==='warn'?'⚠':'✗';
    const col=r.status==='ok'?'#1a6b3e':r.status==='warn'?'#d4860e':'#c0392b';
    const wH=(r.warnings||[]).map(w=>`<div style="font-size:10px;color:var(--txt-dim)">— ${w}</div>`).join('');
    return`<div class="val-row ${r.status==='ok'?'val-ok':r.status==='warn'?'val-warn':'val-err'}">
      <div class="val-ic">${ic}</div>
      <div><div><strong>${r.fname}</strong> <span style="color:var(--txt-dim);font-weight:400">${r.msg}</span></div>${wH?`<div class="val-warns">${wH}</div>`:''}</div></div>`;
  }).join('');
  const ok=results.filter(r=>r.status!=='err').length;
  toast(`Done — ${ok}/${results.length} file${results.length!==1?'s':''} processed`,'ok');
  document.getElementById('xml-fi').value='';
  renderData();renderOV();
}

  span.innerHTML=`<span style="font-size:11px;color:var(--txt-dim)">Delete?</span>
    <button class="del-btn" style="background:#c0392b;color:#fff;padding:3px 8px;border-radius:5px;margin-left:4px" onclick="doDeleteMatch('${id}')">Yes</button>
    <button class="del-btn" style="padding:3px 8px;border-radius:5px;margin-left:2px" onclick="renderData()">No</button>`;
}
function doDeleteMatch(id){
  deleteMatchFromDB(id).then(()=>{toast('Match deleted');renderData();renderOV();}).catch(()=>toast('Delete failed','err'));
}

// ===== ADMIN - USERS =====
let ALL_USERS=[];
async function loadUsers(){
  try{
    const snap=await FIRESTORE.collection('users').get();
    const docs=snap&&snap.docs?snap.docs:[];
    ALL_USERS=docs.map(d=>{const data=typeof d.data==='function'?d.data():d;return{...data,_uid:d.id};});
  }catch(e){ALL_USERS=[];}
}
async function renderUsers(){
  await loadUsers();
  const el=document.getElementById('us');
  const rows=ALL_USERS.sort((a,b)=>(a.email||'').localeCompare(b.email||'')).map(u=>{
    const isMe=u._uid===SESSION.uid;
    const role=u.role||'viewer';
    const roleBadge=role==='admin'
      ?'<span style="color:var(--green);font-weight:700;font-size:11px">Admin</span>'
      :role==='editor'
        ?'<span style="color:#3b5bdb;font-weight:700;font-size:11px">Editor</span>'
        :'<span style="color:var(--txt-dim);font-size:11px">Viewer</span>';
    const lastLogin=u.lastLogin?u.lastLogin.slice(0,10):'Never';
    const roleButtons=isMe
      ?'<span style="color:var(--txt-faint);font-size:10px">You</span>'
      :`<div style="display:flex;gap:4px">
          <button class="del-btn" style="${role==='viewer'?'opacity:.4;cursor:default':''}" onclick="setUserRole('${u._uid}','viewer')" ${role==='viewer'?'disabled':''}>Viewer</button>
          <button class="del-btn" style="${role==='editor'?'background:var(--green);color:#fff':''}${role==='editor'?'':''}" onclick="setUserRole('${u._uid}','editor')" ${role==='editor'?'disabled':''}>Editor</button>
          <button class="del-btn" style="${role==='admin'?'background:var(--green);color:#fff':''}" onclick="setUserRole('${u._uid}','admin')" ${role==='admin'?'disabled':''}>Admin</button>
        </div>`;
    return`<tr>
      <td style="font-size:12px">${u.email||u._uid}</td>
      <td>${u.name||'—'}</td>
      <td>${roleBadge}</td>
      <td style="color:var(--txt-dim);font-size:11px">${lastLogin}</td>
      <td>${roleButtons}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`
    <div class="page-hdr"><h2>User Management</h2><p>${ALL_USERS.length} account${ALL_USERS.length!==1?'s':''} · users log in at this app's URL with their email</p></div>
    <div class="add-user-card">
      <h3>Adding Users</h3>
      <p style="font-size:12px;color:var(--txt-dim);line-height:1.6;margin-top:6px">To add someone, create their account in <a href="https://console.firebase.google.com/project/irfu-referee-analysis/authentication/users" target="_blank" style="color:var(--green)">Firebase Console → Authentication → Add user</a>. They'll appear here after their first login. Then set their role below.</p>
      <div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap">
        <div style="font-size:11px;color:var(--txt-dim);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;line-height:1.6">
          <span style="color:var(--green);font-weight:700">Admin</span> — Full access: data upload, user management, own private depth chart
        </div>
        <div style="font-size:11px;color:var(--txt-dim);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;line-height:1.6">
          <span style="color:#3b5bdb;font-weight:700">Editor</span> — Own private depth chart (notes + rankings), view-only on all data tabs
        </div>
        <div style="font-size:11px;color:var(--txt-dim);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;line-height:1.6">
          <span style="font-weight:700">Viewer</span> — Read-only access to all data tabs, no depth chart
        </div>
      </div>
    </div>
    ${ALL_USERS.length?`<div class="table-wrap"><table>
      <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Last Login</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`:'<div class="no-data">No users have logged in yet.</div>'}`;
}
async function setUserRole(uid,newRole){
  try{
    await FIRESTORE.doc(`users/${uid}`).update({role:newRole});
    const label=newRole==='admin'?'Admin':newRole==='editor'?'Editor':'Viewer';
    toast(`Role updated to ${label}`,'ok');
    renderUsers();
  }catch(e){toast('Failed to update role','err');}
}

// ===== INIT =====
async function init(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    FIRESTORE=firebase.firestore();
    AUTH=firebase.auth();
    // Also keep DB as alias for any remaining references
    DB=FIRESTORE;
  }catch(e){
    document.getElementById('loading-overlay').innerHTML='<div style="color:#fff;font-size:14px;text-align:center;padding:40px">Unable to connect to database.<br>Please refresh the page.</div>';
    return;
  }
  AUTH.onAuthStateChanged(async (user)=>{
    if(user){
      try{
        const userSnap=await FIRESTORE.doc(`users/${user.uid}`).get();
        let role='viewer';
        let name=user.displayName||user.email.split('@')[0];
        if(userSnap.exists){
          const data=userSnap.data();
          role=data.role||'viewer';
          name=data.name||name;
          await FIRESTORE.doc(`users/${user.uid}`).update({lastLogin:new Date().toISOString()});
        }else{
          // First login — check if any admin exists; if not, make this user admin
          const adminSnap=await FIRESTORE.collection('users').where('role','==','admin').limit(1).get();
          if(!adminSnap||adminSnap.empty)role='admin';
          await FIRESTORE.doc(`users/${user.uid}`).set({
            email:user.email,name,role,
            createdAt:new Date().toISOString(),
            lastLogin:new Date().toISOString()
          });
        }
        if(role==='blocked'){
          AUTH.signOut();
          document.getElementById('loading-overlay').style.display='none';
          document.getElementById('screen-login').style.display='flex';
          document.getElementById('login-err').textContent='Your account has been suspended.';
          return;
        }
        SESSION={uid:user.uid,email:user.email,name,type:role};
        await loadMatches();
        showApp();
        // Handle Dropbox OAuth callback if redirected back from Dropbox
        if(window.location.search.includes('code='))await dbxHandleOAuthCallback();
      }catch(e){
        document.getElementById('loading-overlay').style.display='none';
        document.getElementById('screen-login').style.display='flex';
        document.getElementById('login-err').textContent='Error loading account — please try again.';
        AUTH.signOut();
      }
    }else{
      SESSION=null;
      document.getElementById('loading-overlay').style.display='none';
      document.getElementById('screen-login').style.display='flex';
    }
  });
}
window.onload=init;
document.addEventListener('click',function(e){
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none');
    GF_MS_OPEN=null;
  }
});
</script>

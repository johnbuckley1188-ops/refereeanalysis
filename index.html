function drawPitch(canvas,locs){
  const dpr=window.devicePixelRatio||1;
  const H=canvas.offsetHeight||320;
  const W=Math.round(H*70/90);
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);

  // Portrait: pitch width (0-70) → canvas x; pitch length (5-95, try line to try line) → canvas y (inverted)
  // 0 and 100 labels displayed at the try lines; dead-ball zones not shown
  const PAD=10,PW=W-PAD*2,PH=H-PAD*2;
  PITCH_HOVER_DATA={locs:locs||[],W,H,PAD,PW,PH};
  const cpx=y=>PAD+(y/70)*PW;
  const cpy=x=>PAD+PH-((x-5)/90)*PH;  // x=5 → canvas bottom, x=95 → canvas top

  // ====== BACKGROUND ======
  ctx.fillStyle='#2b2e38';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#363a47';ctx.fillRect(PAD,PAD,PW,PH);

  // ====== HELPERS ======
  const W1='rgba(255,255,255,.85)';
  const W2='rgba(255,255,255,.48)';
  const W3='rgba(255,255,255,.28)';
  function hl(x,col,lw,dash){
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash||[]);
    ctx.beginPath();ctx.moveTo(PAD,cpy(x));ctx.lineTo(PAD+PW,cpy(x));ctx.stroke();
    ctx.setLineDash([]);
  }
  function vl(y,xa,xb,col,lw){
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(cpx(y),cpy(xa));ctx.lineTo(cpx(y),cpy(xb));ctx.stroke();
  }

  // ====== PITCH LINES ======
  // Canvas border IS the try lines (x=5 and x=95 in Opta coords, displayed as 0 and 100)
  ctx.strokeStyle=W1;ctx.lineWidth=1.2;ctx.setLineDash([]);
  ctx.strokeRect(PAD,PAD,PW,PH);
  hl(22,W1,0.9);hl(78,W1,0.9);
  hl(40,W2,0.75,[4,4]);hl(60,W2,0.75,[4,4]);
  hl(50,W1,0.9);

  // ====== LINEOUT MARKERS ======
  const tk=Math.max(2.5,PW/55);
  function tMark(x,ch,dir){ // T-mark pointing dir(+1=down/-1=up)
    const px=cpx(ch),py=cpy(x);
    ctx.strokeStyle=W2;ctx.lineWidth=0.8;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px-tk,py);ctx.lineTo(px+tk,py);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+dir*tk*1.6);ctx.stroke();
  }
  function plusMark(x,ch){
    const px=cpx(ch),py=cpy(x);
    ctx.strokeStyle=W2;ctx.lineWidth=0.8;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px-tk,py);ctx.lineTo(px+tk,py);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py-tk);ctx.lineTo(px,py+tk);ctx.stroke();
  }
  function dashMark(x,ch){
    const px=cpx(ch),py=cpy(x);
    ctx.strokeStyle=W3;ctx.lineWidth=0.8;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px-tk,py);ctx.lineTo(px+tk,py);ctx.stroke();
  }
  // T marks: 10m inside from each try line (x=15 bottom, x=85 top), pointing into field
  [5,15,55,65].forEach(ch=>{tMark(15,ch,1);tMark(85,ch,-1);});
  dashMark(15,35);dashMark(85,35);
  // At 22m, 40m, 60m, 78m: plus marks at channel positions
  [22,40,60,78].forEach(x=>{
    [5,15,55,65].forEach(ch=>plusMark(x,ch));
    dashMark(x,35);
  });

  // ====== GOAL POSTS ======
  // Parallel angled lines (same direction), cross piece at field end (try line)
  // Posts are centred at y=35 (pitch width), spread ±3 units
  const pHalf=cpx(35+3)-cpx(35);
  const pC=cpx(35);
  const postAngleX=pHalf*0.6;  // horizontal offset for top of post (angled away from centre)
  ctx.strokeStyle=W2;ctx.lineWidth=0.85;ctx.setLineDash([]);
  // Top posts (in-goal at x=100 end): cross at try-line (x=95), uprights angle into in-goal
  const tCross=cpy(95),tTip=cpy(100)+2;
  // Left post: parallel angled — base slightly left of centre, top further left
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,tCross);ctx.lineTo(pC-pHalf*0.5-postAngleX,tTip);ctx.stroke();
  // Right post: same angle
  ctx.beginPath();ctx.moveTo(pC+pHalf*0.5,tCross);ctx.lineTo(pC+pHalf*0.5-postAngleX,tTip);ctx.stroke();
  // Cross bar at field end (try line)
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,tCross);ctx.lineTo(pC+pHalf*0.5,tCross);ctx.stroke();
  // Bottom posts (in-goal at x=0 end): cross at try-line (x=5), uprights angle into in-goal
  const bCross=cpy(5),bTip=cpy(0)-2;
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,bCross);ctx.lineTo(pC-pHalf*0.5+postAngleX,bTip);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pC+pHalf*0.5,bCross);ctx.lineTo(pC+pHalf*0.5+postAngleX,bTip);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pC-pHalf*0.5,bCross);ctx.lineTo(pC+pHalf*0.5,bCross);ctx.stroke();

  // ====== LABELS ======
  // Try lines displayed as 0 and 100; 22m lines as 22/78; halfway as 50
  ctx.fillStyle=W2;ctx.font='7px Inter';ctx.textAlign='right';
  [[5,'0'],[22,'22'],[50,'50'],[78,'78'],[95,'100']].forEach(([x,l])=>{
    ctx.fillText(l,PAD-2,cpy(x)+3);
  });

  // ====== DOTS ======
  const dotR=Math.max(2,Math.min(PW,PH)/60);
  function drawDots(dotLocs,alpha){
    dotLocs.forEach(l=>{
      const cx=cpx(l.y),cy=cpy(l.x);
      const col=INF_C[l.type]||'#e06020';
      ctx.globalAlpha=0.9*alpha;
      ctx.beginPath();ctx.arc(cx,cy,dotR,0,Math.PI*2);
      ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=0.5;ctx.stroke();
      ctx.globalAlpha=1;
    });
  }

  // ====== SELECTION ======
  const cornerR=4.5;
  if(pitchSelIsFull()){
    // Full pitch selected: draw all dots normally, white corner handles as drag affordance
    drawDots(locs,1);
    [[PAD,PAD],[PAD+PW,PAD],[PAD,PAD+PH],[PAD+PW,PAD+PH]].forEach(([hx,hy])=>{
      ctx.beginPath();ctx.arc(hx,hy,cornerR,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
    });
  }else{
    const {x0,x1,y0,y1}=PITCH_SEL;
    const sx=Math.min(cpx(x0),cpx(x1));
    const sw=Math.abs(cpx(x1)-cpx(x0));
    const sy=Math.min(cpy(y0),cpy(y1));
    const sh=Math.abs(cpy(y1)-cpy(y0));
    drawDots(PITCH_ALL_LOCS,0.18);
    ctx.save();
    ctx.beginPath();
    ctx.rect(PAD,PAD,PW,PH);
    ctx.rect(sx,sy,sw,sh);
    ctx.fillStyle='rgba(0,0,0,.52)';
    ctx.fill('evenodd');
    ctx.restore();
    ctx.save();
    ctx.beginPath();ctx.rect(sx,sy,sw,sh);ctx.clip();
    drawDots(locs,1);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle='rgba(40,220,160,.95)';ctx.lineWidth=2;ctx.setLineDash([]);
    ctx.strokeRect(sx,sy,sw,sh);
    [[sx,sy],[sx+sw,sy],[sx,sy+sh],[sx+sw,sy+sh]].forEach(([hx,hy])=>{
      ctx.beginPath();ctx.arc(hx,hy,cornerR,0,Math.PI*2);
      ctx.fillStyle='rgba(40,220,160,.95)';ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();
    });
    ctx.restore();
  }

  if(locs.length){
    ctx.fillStyle=W2;ctx.font='7px Inter';ctx.textAlign='left';
    ctx.fillText(locs.length+' pts',PAD+3,PAD+10);
  }
  if(!locs.length){
    ctx.fillStyle=W2;ctx.font='9px Inter';ctx.textAlign='center';
    ctx.fillText('No penalty locations',W/2,H/2+3);
  }
}
function pitchPxToCoord(mx,my,canvas){
  const PAD=10;
  const PW=canvas.offsetWidth-PAD*2,PH=canvas.offsetHeight-PAD*2;
  const py=((mx-PAD)/PW)*70;              // pitch width 0-70
  const px=5+(1-((my-PAD)/PH))*90;        // pitch length 5-95 (try line to try line, inverted)
  return{px:Math.max(5,Math.min(95,px)),py:Math.max(0,Math.min(70,py))};
}
function pitchMouseDown(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.offsetWidth/rect.width);
  const my=(e.clientY-rect.top)*(canvas.offsetHeight/rect.height);
  const PAD=10,PW=canvas.offsetWidth-PAD*2,PH=canvas.offsetHeight-PAD*2;
  const cpx=y=>PAD+(y/70)*PW,cpy=x=>PAD+PH-((x-5)/90)*PH;
  if(pitchSelIsFull()){
    // Drag from canvas corners to shrink the selection
    const corners=[
      {id:'tl',cx:PAD,cy:PAD},{id:'tr',cx:PAD+PW,cy:PAD},
      {id:'bl',cx:PAD,cy:PAD+PH},{id:'br',cx:PAD+PW,cy:PAD+PH},
    ];
    const hit=corners.find(c=>Math.hypot(mx-c.cx,my-c.cy)<12);
    if(hit){PITCH_SEL.dragging=true;PITCH_SEL.corner=hit.id;return;}
  }else{
    const {x0,x1,y0,y1}=PITCH_SEL;
    const corners=[
      {id:'tl',cx:cpx(x0),cy:cpy(y1)},{id:'tr',cx:cpx(x1),cy:cpy(y1)},
      {id:'bl',cx:cpx(x0),cy:cpy(y0)},{id:'br',cx:cpx(x1),cy:cpy(y0)},
    ];
    const hit=corners.find(c=>Math.hypot(mx-c.cx,my-c.cy)<12);
    if(hit){PITCH_SEL.dragging=true;PITCH_SEL.corner=hit.id;return;}
  }
  // Click elsewhere: reset to full pitch
  pitchSelReset();
  PITCH_FILTERED_LOCS=[...PITCH_ALL_LOCS];
  drawPitch(canvas,PITCH_FILTERED_LOCS);
  updateRFZoneStats();
  const btn=document.getElementById('pitch-clear-sel');if(btn)btn.style.display='none';
}
function pitchMouseMove(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.offsetWidth/rect.width);
  const my=(e.clientY-rect.top)*(canvas.offsetHeight/rect.height);
  if(PITCH_SEL.dragging){
    const {px,py}=pitchPxToCoord(mx,my,canvas);
    const c=PITCH_SEL.corner;
    if(c==='br'||c==='tr')PITCH_SEL.x1=py;else PITCH_SEL.x0=py;  // x = pitch width
    if(c==='br'||c==='bl')PITCH_SEL.y0=px;else PITCH_SEL.y1=px;  // y = pitch length
    PITCH_SEL.active=true;
    drawPitch(canvas,PITCH_FILTERED_LOCS);
    return;
  }
  pitchHover(e,canvas);
}
function pitchMouseUp(e,canvas){
  if(!PITCH_SEL.dragging)return;
  PITCH_SEL.dragging=false;
  if(PITCH_SEL.active){
    if(PITCH_SEL.x0>PITCH_SEL.x1){const t=PITCH_SEL.x0;PITCH_SEL.x0=PITCH_SEL.x1;PITCH_SEL.x1=t;}
    if(PITCH_SEL.y0>PITCH_SEL.y1){const t=PITCH_SEL.y0;PITCH_SEL.y0=PITCH_SEL.y1;PITCH_SEL.y1=t;}
    const w=PITCH_SEL.x1-PITCH_SEL.x0,h=PITCH_SEL.y1-PITCH_SEL.y0;
    if(w<3&&h<3){
      pitchSelReset();PITCH_FILTERED_LOCS=[...PITCH_ALL_LOCS];
      const btn=document.getElementById('pitch-clear-sel');if(btn)btn.style.display='none';
    }else{
      PITCH_FILTERED_LOCS=PITCH_ALL_LOCS.filter(l=>
        l.y>=PITCH_SEL.x0&&l.y<=PITCH_SEL.x1&&l.x>=PITCH_SEL.y0&&l.x<=PITCH_SEL.y1);
      const btn=document.getElementById('pitch-clear-sel');if(btn)btn.style.display='inline-block';
    }
    drawPitch(canvas,PITCH_FILTERED_LOCS);
    updateRFZoneStats();
  }
}
function pitchHover(e,canvas){
  const tip=document.getElementById('pitch-tip');if(!tip)return;
  const rect=canvas.getBoundingClientRect();
  const {locs,W,H,PAD,PW,PH}=PITCH_HOVER_DATA;
  const cpx=y=>PAD+(y/70)*PW;
  const cpy=x=>PAD+PH-((x-5)/90)*PH;
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  let nearest=null,minD=22;
  locs.forEach(l=>{const d=Math.hypot(mx-cpx(l.y),my-cpy(l.x));if(d<minD){minD=d;nearest=l;}});
  if(nearest){
    const tn=INF_L[String(nearest.type)]||'Penalty';
    const tm=nearest.mins>0?` · ${nearest.mins}'`:'';
    const tt=nearest.team?` · ${nearest.team}`:'';
    tip.innerHTML=`<strong>${tn}</strong>${tm}${tt}`;
    tip.style.display='block';
    tip.style.left=(e.clientX-rect.left+14)+'px';
    tip.style.top=Math.max(0,e.clientY-rect.top-46)+'px';
  }else tip.style.display='none';
}
function drawTimeline(canvas,homePens,awayPens,homeCards,awayCards,tFrom,tTo,homeLabel,awayLabel,homeFKs,awayFKs){
  homeFKs=homeFKs||[];awayFKs=awayFKs||[];
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||400,H=canvas.offsetHeight||160;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.fillStyle='#f7fbf8';ctx.fillRect(0,0,W,H);
  const PL=80,PR=10,PT=8,PB=22;
  const PW=W-PL-PR,PH=H-PT-PB;
  const halfH=PH/2,midY=PT+halfH;
  const span=Math.max(tTo-tFrom,1);
  const xp=m=>PL+((m-tFrom)/span)*PW;
  // Row Y positions: cards outer → FKs middle → penalties inner (near center)
  const homeCardY=PT+halfH*0.15;   // cards: top of upper band
  const homeFKY  =PT+halfH*0.48;   // free kicks: middle of upper band
  const homePenY =PT+halfH*0.82;   // penalties: near center (upper)
  const awayPenY =midY+halfH*0.18; // penalties: near center (lower)
  const awayFKY  =midY+halfH*0.52; // free kicks: middle of lower band
  const awayCardY=midY+halfH*0.85; // cards: bottom of lower band
  // Team + row labels on the left
  ctx.textAlign='right';
  const hLbl=(homeLabel||'Home').slice(0,14);
  const aLbl=(awayLabel||'Away').slice(0,14);
  ctx.fillStyle='#3a6b50';ctx.font='bold 7px Inter';
  ctx.fillText(hLbl,PL-4,PT+halfH*0.48+3);
  ctx.fillText(aLbl,PL-4,midY+halfH*0.52+3);
  // Tiny row labels
  const RL_COL='#9aad9f';
  ctx.fillStyle=RL_COL;ctx.font='6px Inter';
  ctx.fillText('YC',PL-4,homeCardY+2);
  ctx.fillText('FK',PL-4,homeFKY+2);
  ctx.fillText('PEN',PL-4,homePenY+2);
  ctx.fillText('PEN',PL-4,awayPenY+2);
  ctx.fillText('FK',PL-4,awayFKY+2);
  ctx.fillText('YC',PL-4,awayCardY+2);
  // Band backgrounds
  ctx.fillStyle='rgba(26,107,62,.04)';ctx.fillRect(PL,PT,PW,halfH-0.5);
  ctx.fillStyle='rgba(60,91,219,.04)';ctx.fillRect(PL,midY+0.5,PW,halfH-0.5);
  // Mid divider
  ctx.strokeStyle='#dce8dc';ctx.lineWidth=1;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(PL,midY);ctx.lineTo(PL+PW,midY);ctx.stroke();
  // Outer border
  ctx.strokeStyle='#dce8dc';ctx.strokeRect(PL,PT,PW,PH);
  // Minute gridlines + labels
  const step=span<=40?5:10;
  for(let m=Math.ceil(tFrom/step)*step;m<=tTo;m+=step){
    const x=xp(m);
    ctx.strokeStyle='#e8ede9';ctx.lineWidth=1;ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+PH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#9aad9f';ctx.font='7px Inter';ctx.textAlign='center';
    ctx.fillText(m+"'",x,H-PB+10);
  }
  // Half-time line at 40
  if(tFrom<40&&tTo>40){
    const x=xp(40);ctx.strokeStyle='rgba(26,107,62,.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+PH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(26,107,62,.5)';ctx.font='6.5px Inter';ctx.textAlign='center';ctx.fillText('HT',x,PT+7);
  }
  // 80' regular-time marker
  if(tFrom<80&&tTo>80){
    const x=xp(80);ctx.strokeStyle='rgba(180,80,50,.35)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+PH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(180,80,50,.55)';ctx.font='6.5px Inter';ctx.textAlign='center';ctx.fillText('80\'',x,PT+7);
  }
  // Plot dots in a clean row sorted by minute
  const dots=[];
  function plotPens(pens,penY,teamLabel){
    const sorted=[...pens].sort((a,b)=>a.mins-b.mins);
    sorted.forEach(p=>{
      const x=xp(p.mins);if(x<PL-2||x>PL+PW+2)return;
      const col=INF_C[p.type]||'#9aad9f';
      ctx.beginPath();ctx.arc(x,penY,4,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.stroke();
      dots.push({cx:x,cy:penY,mins:p.mins,type:p.type,team:teamLabel});
    });
  }
  function plotCards(cards,cardY,teamLabel){
    const sorted=[...cards].sort((a,b)=>a.mins-b.mins);
    let prevBaseX=null;let sameGroupOffset=0;
    sorted.forEach(c=>{
      const baseX=xp(c.mins);if(baseX<PL-2||baseX>PL+PW+2)return;
      if(prevBaseX!==null&&Math.abs(baseX-prevBaseX)<8){sameGroupOffset+=8;}else{sameGroupOffset=0;}
      const x=baseX+sameGroupOffset;
      prevBaseX=baseX;
      const col=c.cardType==='red'?'#cc2200':'#fcdc01';
      const cw=6,ch=8;
      ctx.fillStyle=col;
      ctx.fillRect(x-cw/2,cardY-ch/2,cw,ch);
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=0.6;
      ctx.strokeRect(x-cw/2,cardY-ch/2,cw,ch);
      dots.push({cx:x,cy:cardY,mins:c.mins,type:c.cardType==='red'?'red':'yellow',isCard:true,team:teamLabel});
    });
  }
  function plotFKs(fks,fkY,teamLabel){
    const sorted=[...fks].sort((a,b)=>a.mins-b.mins);
    sorted.forEach(f=>{
      const x=xp(f.mins);if(x<PL-2||x>PL+PW+2)return;
      const s=4; // half-size of diamond
      ctx.beginPath();ctx.moveTo(x,fkY-s);ctx.lineTo(x+s,fkY);ctx.lineTo(x,fkY+s);ctx.lineTo(x-s,fkY);ctx.closePath();
      ctx.fillStyle='#3a9aa0';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.stroke();
      dots.push({cx:x,cy:fkY,mins:f.mins,type:f.type,isFK:true,team:teamLabel});
    });
  }
  plotCards(homeCards||[],homeCardY,homeLabel||'Home');
  plotFKs(homeFKs,homeFKY,homeLabel||'Home');
  plotPens(homePens,homePenY,homeLabel||'Home');
  plotPens(awayPens,awayPenY,awayLabel||'Away');
  plotFKs(awayFKs,awayFKY,awayLabel||'Away');
  plotCards(awayCards||[],awayCardY,awayLabel||'Away');
  canvas._tlDots=dots;canvas._tlDpr=dpr;
  if(!homePens.length&&!awayPens.length&&!(homeCards||[]).length&&!(awayCards||[]).length&&!homeFKs.length&&!awayFKs.length){
    ctx.fillStyle='#9aad9f';ctx.font='10px Inter';ctx.textAlign='center';
    ctx.fillText('Re-upload XML files to enable timeline data',W/2,H/2);
  }
}

function timelineMouseMove(e,canvas){
  const tip=document.getElementById('tl-tip');if(!tip)return;
  const rect=canvas.getBoundingClientRect();
  const dpr=canvas._tlDpr||window.devicePixelRatio||1;
  const scaleX=canvas.width/(rect.width*dpr);
  const scaleY=canvas.height/(rect.height*dpr);
  const mx=(e.clientX-rect.left)*scaleX*(dpr);
  const my=(e.clientY-rect.top)*scaleY*(dpr);
  const dots=canvas._tlDots||[];
  let nearest=null,minD=16;
  dots.forEach(d=>{
    const dist=Math.sqrt((d.cx-mx/dpr)**2+(d.cy-my/dpr)**2);
    if(dist<minD){minD=dist;nearest=d;}
  });
  if(nearest){
    const label=nearest.isCard?(nearest.type==='red'?'🟥 Red Card':'🟨 Yellow Card'):nearest.isFK?('◆ Free Kick'+(nearest.type?(' — '+(INF_L[nearest.type]||'Code '+nearest.type)):'')):(INF_L[nearest.type]||('Code '+nearest.type)||'Penalty');
    tip.innerHTML=`<strong>${nearest.mins}'</strong> · ${label}<br><span style="color:rgba(255,255,255,.6);font-size:10px">${nearest.team}</span>`;
    tip.style.display='block';
    const tx=e.clientX-rect.left+12;
    const ty=e.clientY-rect.top-48;
    tip.style.left=Math.min(tx,rect.width-180)+'px';
    tip.style.top=Math.max(ty,4)+'px';
  }else{
    tip.style.display='none';
  }
}

// ===== VALIDATION =====
function validateMatch(m){
  const warnings=[];
  const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};
  if(!m.hid||!m.aid)warnings.push('Missing team IDs');
  if(!m.date)warnings.push('Missing match date');
  if(!m.rn||m.rn==='Unknown')warnings.push('Referee not identified');
  const totalActivity=(hs.pen||0)+(as2.pen||0)+(hs.tries||0)+(as2.tries||0)+(hs.fkC||0)+(as2.fkC||0)+(hs.yel||0)+(as2.yel||0);
  if(totalActivity===0)warnings.push('No events extracted — file may be incomplete or use unexpected action codes');
  else if((hs.pen||0)+(as2.pen||0)===0&&(m.rowCount||0)>100)warnings.push('0 penalties from '+m.rowCount+' rows — check qualifier4 codes');
  if((hs.tries||0)+(as2.tries||0)===0&&(m.hs||0)+(m.as||0)>0)warnings.push('Score exists but no tries found');
  return{warnings};
}

// ===== DROPBOX OAUTH + SYNC =====
let DBX_TOKEN='',DBX_TOKEN_EXPIRY=0,DBX_REFRESH_TOKEN='',DBX_APP_KEY='',DBX_FOLDER='',DBX_IMPORT_LOG={};
let _dbxFiles=[];

function dbxRedirectUri(){return window.location.origin+window.location.pathname;}

async function loadDropboxConfig(){
  try{
    const cfgSnap=await FIRESTORE.doc('config/dropbox').get();
    if(cfgSnap.exists){
      const cfg=cfgSnap.data();
      DBX_REFRESH_TOKEN=cfg.refresh_token||'';
      DBX_APP_KEY=cfg.app_key||'';
      DBX_FOLDER=cfg.folder||'';
      // Legacy plain token fallback
      if(!DBX_REFRESH_TOKEN&&cfg.token)DBX_TOKEN=cfg.token;
    }
    const logSnap=await FIRESTORE.doc('config/dropbox_log').get();
    if(logSnap.exists){const log=logSnap.data();if(log.entries)DBX_IMPORT_LOG=log.entries;}
  }catch(e){}
}

async function dbxGetValidToken(){
  if(DBX_TOKEN&&Date.now()<DBX_TOKEN_EXPIRY-60000)return DBX_TOKEN;
  if(DBX_REFRESH_TOKEN&&DBX_APP_KEY){
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'refresh_token',refresh_token:DBX_REFRESH_TOKEN,client_id:DBX_APP_KEY})
    });
    if(r.ok){
      const d=await r.json();
      DBX_TOKEN=d.access_token;
      DBX_TOKEN_EXPIRY=Date.now()+(d.expires_in||14400)*1000;
      return DBX_TOKEN;
    }
    throw new Error('Token refresh failed — please reconnect Dropbox');
  }
  if(DBX_TOKEN)return DBX_TOKEN;
  throw new Error('Not connected to Dropbox');
}

function dbxB64Url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function dbxStartOAuth(){
  const appKey=(document.getElementById('dbx-app-key')||{}).value?.trim();
  const folder=(document.getElementById('dbx-folder-input')||{}).value||'';
  if(!appKey){toast('Enter your App Key first','err');return;}
  DBX_APP_KEY=appKey;DBX_FOLDER=folder;
  await FIRESTORE.doc('config/dropbox').set({app_key:appKey,folder,refresh_token:DBX_REFRESH_TOKEN||''});
  const verifier=dbxB64Url(crypto.getRandomValues(new Uint8Array(96)));
  const challenge=dbxB64Url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  sessionStorage.setItem('dbx_pkce_verifier',verifier);
  const params=new URLSearchParams({
    response_type:'code',client_id:appKey,redirect_uri:dbxRedirectUri(),
    code_challenge:challenge,code_challenge_method:'S256',token_access_type:'offline'
  });
  window.location.href='https://www.dropbox.com/oauth2/authorize?'+params;
}

async function dbxHandleOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  if(!code)return;
  history.replaceState({},'',window.location.pathname);
  const verifier=sessionStorage.getItem('dbx_pkce_verifier');
  sessionStorage.removeItem('dbx_pkce_verifier');
  if(!verifier){toast('OAuth session expired — please try connecting again','err');return;}
  await loadDropboxConfig();
  if(!DBX_APP_KEY){toast('App Key missing — please re-enter it','err');return;}
  try{
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({code,grant_type:'authorization_code',client_id:DBX_APP_KEY,redirect_uri:dbxRedirectUri(),code_verifier:verifier})
    });
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error_description||'Auth failed');}
    const d=await r.json();
    DBX_REFRESH_TOKEN=d.refresh_token||'';
    DBX_TOKEN=d.access_token||'';
    DBX_TOKEN_EXPIRY=Date.now()+(d.expires_in||14400)*1000;
    await FIRESTORE.doc('config/dropbox').set({app_key:DBX_APP_KEY,folder:DBX_FOLDER,refresh_token:DBX_REFRESH_TOKEN});
    toast('Dropbox connected — you\'ll never need to do this again!','ok');
  }catch(e){toast('Dropbox auth failed: '+e.message,'err');}
}

async function dropboxScan(){
  let token;
  try{token=await dbxGetValidToken();}catch(e){toast(e.message,'err');return;}
  const res=document.getElementById('dbx-results');
  if(!res)return;
  res.innerHTML='<div style="padding:10px 0;font-size:11px;color:var(--txt-dim)">Scanning folder (recursive)…</div>';
  try{
    // Recursive scan with pagination support
    let allEntries=[];
    let cursor=null;
    let hasMore=true;
    while(hasMore){
      let r;
      if(!cursor){
        r=await fetch('https://api.dropboxapi.com/2/files/list_folder',{
          method:'POST',
          headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({path:DBX_FOLDER||'',recursive:true,limit:2000})
        });
      }else{
        r=await fetch('https://api.dropboxapi.com/2/files/list_folder/continue',{
          method:'POST',
          headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({cursor})
        });
      }
      if(!r.ok){const e=await r.json().catch(()=>({}));res.innerHTML=`<div style="color:var(--red);font-size:11px;padding:8px 0">Error: ${e.error_summary||('HTTP '+r.status)}</div>`;return;}
      const data=await r.json();
      allEntries=allEntries.concat(data.entries||[]);
      hasMore=data.has_more;
      cursor=data.cursor;
      if(hasMore)res.innerHTML=`<div style="padding:10px 0;font-size:11px;color:var(--txt-dim)">Scanning… ${allEntries.length} entries found so far</div>`;
    }
    const rootLower=(DBX_FOLDER||'').toLowerCase();
    const xmlFiles=allEntries.filter(e=>e['.tag']==='file'&&e.name.toLowerCase().endsWith('.xml'));
    xmlFiles.sort((a,b)=>b.server_modified.localeCompare(a.server_modified));
    _dbxFiles=xmlFiles;
    if(!xmlFiles.length){res.innerHTML='<div style="padding:10px 0;font-size:11px;color:var(--txt-dim)">No XML files found in this folder or its subfolders.</div>';return;}
    const newCount=xmlFiles.filter(f=>!DBX_IMPORT_LOG[f.path_lower]||DBX_IMPORT_LOG[f.path_lower].modified!==f.server_modified).length;
    const rows=xmlFiles.map(f=>{
      const log=DBX_IMPORT_LOG[f.path_lower];
      const isNew=!log,isUpdated=log&&log.modified!==f.server_modified,isDone=log&&log.modified===f.server_modified;
      const status=isNew?'<span style="color:#1a6b3e;font-weight:700;font-size:10px">New</span>':isUpdated?'<span style="color:#d4860e;font-weight:700;font-size:10px">Updated</span>':'<span style="color:var(--txt-faint);font-size:10px">✓ Done</span>';
      const sz=f.size>1048576?(f.size/1048576).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB';
      const pathParts=f.path_lower.replace(rootLower,'').split('/').filter(Boolean);
      const subfolder=pathParts.length>1?pathParts.slice(0,-1).join('/'):'';
      return`<tr><td style="width:28px"><input type="checkbox" class="dbx-cb" data-path="${f.path_lower}" ${!isDone?'checked':''}></td>
        <td style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.path_display||f.name}">${f.name}</td>
        ${subfolder?`<td style="font-size:10px;color:var(--txt-dim);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${subfolder}">${subfolder}</td>`:'<td></td>'}
        <td style="font-size:10px;color:var(--txt-dim);white-space:nowrap">${sz}</td>
        <td style="font-size:10px;color:var(--txt-dim);white-space:nowrap">${f.server_modified.slice(0,10)}</td>
        <td>${status}</td></tr>`;
    }).join('');
    res.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px">
        <div style="font-size:11px;color:var(--txt-dim)">${xmlFiles.length} XML files · <strong style="color:var(--green)">${newCount} new/updated</strong></div>
        <div style="display:flex;gap:6px">
          <button class="dbx-btn" onclick="dropboxImportSelected()">Import Selected</button>
          <button class="dbx-btn primary" onclick="dropboxImportAll()">↓ Import All New</button>
          <button class="dbx-btn" onclick="dropboxReimportAll()" title="Re-process every XML in the folder (use after an app update adds new stats)">↻ Re-import all</button>
        </div>
      </div>
      <div class="table-wrap" style="max-height:200px;margin-bottom:10px">
        <table style="font-size:11px">
          <thead><tr><th style="width:28px"><input type="checkbox" title="Select all" onchange="document.querySelectorAll('.dbx-cb').forEach(c=>c.checked=this.checked)"></th><th>File</th><th>Subfolder</th><th>Size</th><th>Modified</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
      <div id="dbx-progress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="dbx-prog-fill" style="width:0%"></div></div>
        <div class="progress-lbl" id="dbx-prog-lbl">Importing…</div>
      </div>
      <div id="dbx-report"></div>`;
  }catch(e){res.innerHTML=`<div style="color:var(--red);font-size:11px;padding:8px 0">Network error: ${e.message}</div>`;}
}
function dropboxImportAll(){
  const paths=_dbxFiles.filter(f=>!DBX_IMPORT_LOG[f.path_lower]||DBX_IMPORT_LOG[f.path_lower].modified!==f.server_modified).map(f=>f.path_lower);
  if(!paths.length){toast('All files already imported','ok');return;}
  dropboxImportPaths(paths);
}
function dropboxReimportAll(){
  const paths=(_dbxFiles||[]).map(f=>f.path_lower);
  if(!paths.length){toast('Scan the folder first','err');return;}
  if(!confirm(`Re-import all ${paths.length} XML files? Existing matches are overwritten with freshly processed data (no duplicates). This can take a few minutes.`))return;
  dropboxImportPaths(paths);
}
function dropboxImportSelected(){
  const paths=Array.from(document.querySelectorAll('.dbx-cb:checked')).map(c=>c.dataset.path);
  if(!paths.length){toast('Select at least one file','err');return;}
  dropboxImportPaths(paths);
}
async function dropboxImportPaths(paths){
  const pd=document.getElementById('dbx-progress'),pf=document.getElementById('dbx-prog-fill'),pl=document.getElementById('dbx-prog-lbl'),rpt=document.getElementById('dbx-report');
  if(pd)pd.style.display='block';
  let token;
  try{token=await dbxGetValidToken();}catch(e){toast(e.message,'err');if(pd)pd.style.display='none';return;}
  const results=[];
  for(let i=0;i<paths.length;i++){
    const path=paths[i];
    const fname=path.split('/').pop();
    if(pl)pl.textContent=`Downloading ${fname} (${i+1}/${paths.length})…`;
    if(pf)pf.style.width=Math.round((i/paths.length)*100)+'%';
    try{
      const r=await fetch('https://content.dropboxapi.com/2/files/download',{
        method:'POST',headers:{'Authorization':'Bearer '+token,'Dropbox-API-Arg':JSON.stringify({path})}
      });
      if(!r.ok){results.push({fname,status:'err',msg:'Download failed (HTTP '+r.status+')',warnings:[]});continue;}
      const text=await r.text();
      const matches=parseXML(text,fname);
      if(!matches.length){results.push({fname,status:'warn',msg:'No matches found in file',warnings:['File parsed but contained no FXID match blocks']});continue;}
      let added=0,updated=0,allWarnings=[];
      for(const m of matches){
        const v=validateMatch(m);
        if(v.warnings.length)allWarnings.push(...v.warnings.map(w=>`${m.hn} v ${m.an}: ${w}`));
        const id=matchDocId(m),existIdx=MATCHES.findIndex(x=>matchDocId(x)===id);
        await saveMatchToDB(m);
        if(existIdx>=0){MATCHES[existIdx]=m;updated++;}else{MATCHES.push(m);added++;}
      }
      const fEntry=_dbxFiles.find(f=>f.path_lower===path);
      if(fEntry){DBX_IMPORT_LOG[path]={modified:fEntry.server_modified,added,updated};await FIRESTORE.doc('config/dropbox_log').set({entries:DBX_IMPORT_LOG});}
      const summary=`${matches.length} match${matches.length!==1?'es':''} · ${added} added, ${updated} updated${allWarnings.length?' · ⚠ '+allWarnings.length+' warning(s)':''}`;
      results.push({fname,status:allWarnings.length?'warn':'ok',msg:summary,warnings:allWarnings});
    }catch(e2){results.push({fname,status:'err',msg:e2.message,warnings:[]});}
  }
  if(pf)pf.style.width='100%';if(pl)pl.textContent='Done!';
  setTimeout(()=>{if(pd)pd.style.display='none';if(pf)pf.style.width='0%';},1200);
  if(rpt)rpt.innerHTML=results.map(r=>{
    const ic=r.status==='ok'?'✓':r.status==='warn'?'⚠':'✗';
    const col=r.status==='ok'?'#1a6b3e':r.status==='warn'?'#d4860e':'#c0392b';
    const wH=(r.warnings||[]).map(w=>`<div style="font-size:10px;color:var(--txt-dim)">— ${w}</div>`).join('');
    return`<div class="val-row ${r.status==='ok'?'val-ok':r.status==='warn'?'val-warn':'val-err'}">
      <div class="val-ic">${ic}</div>
      <div><div><strong>${r.fname}</strong> <span style="color:var(--txt-dim);font-weight:400">${r.msg}</span></div>${wH?`<div class="val-warns">${wH}</div>`:''}</div></div>`;
  }).join('');
  const ok=results.filter(r=>r.status!=='err').length;
  toast(`Imported ${ok}/${results.length} files`,'ok');
  renderData();renderOV();
}

document.getElementById('xml-fi').addEventListener('change',e=>handleXMLFiles(e.target.files));
async function handleXMLFiles(files){
  const arr=Array.from(files).filter(f=>f.name.toLowerCase().endsWith('.xml'));
  if(!arr.length){toast('No XML files found','err');return;}
  const pd=document.getElementById('upload-progress'),pf=document.getElementById('prog-fill'),pl=document.getElementById('prog-lbl');
  const rpt=document.getElementById('upload-report');
  if(pd)pd.style.display='block';
  if(rpt)rpt.innerHTML='';
  const results=[];
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    if(pl)pl.textContent=`Processing ${f.name} (${i+1}/${arr.length})…`;
    if(pf)pf.style.width=Math.round((i/arr.length)*100)+'%';
    await new Promise(res=>{
      const r=new FileReader();
      r.onload=async e=>{
        try{
          const matches=parseXML(e.target.result,f.name);
          if(!matches.length){results.push({fname:f.name,status:'warn',msg:'No matches found in file',warnings:['File parsed but contained no FXID match blocks']});res();return;}
          let added=0,updated=0,allWarnings=[];
          for(const m of matches){
            const v=validateMatch(m);
            if(v.warnings.length)allWarnings.push(...v.warnings.map(w=>`${m.hn} v ${m.an}: ${w}`));
            const id=matchDocId(m),existIdx=MATCHES.findIndex(x=>matchDocId(x)===id);
            await saveMatchToDB(m);
            if(existIdx>=0){MATCHES[existIdx]=m;updated++;}else{MATCHES.push(m);added++;}
          }
          const summary=`${matches.length} match${matches.length!==1?'es':''} · ${added} added, ${updated} updated${allWarnings.length?' · ⚠ '+allWarnings.length+' warning(s)':''}`;
          results.push({fname:f.name,status:allWarnings.length?'warn':'ok',msg:summary,warnings:allWarnings});
        }catch(e2){results.push({fname:f.name,status:'err',msg:e2.message,warnings:[]});}
        res();
      };
      r.readAsText(f);
    });
  }
  if(pf)pf.style.width='100%';if(pl)pl.textContent='Done!';
  setTimeout(()=>{if(pd)pd.style.display='none';if(pf)pf.style.width='0%';},1200);
  if(rpt)rpt.innerHTML=results.map(r=>{
    const ic=r.status==='ok'?'✓':r.status==='warn'?'⚠':'✗';
    const col=r.status==='ok'?'#1a6b3e':r.status==='warn'?'#d4860e':'#c0392b';
    const wH=(r.warnings||[]).map(w=>`<div style="font-size:10px;color:var(--txt-dim)">— ${w}</div>`).join('');
    return`<div class="val-row ${r.status==='ok'?'val-ok':r.status==='warn'?'val-warn':'val-err'}">
      <div class="val-ic">${ic}</div>
      <div><div><strong>${r.fname}</strong> <span style="color:var(--txt-dim);font-weight:400">${r.msg}</span></div>${wH?`<div class="val-warns">${wH}</div>`:''}</div></div>`;
  }).join('');
  const ok=results.filter(r=>r.status!=='err').length;
  toast(`Done — ${ok}/${results.length} file${results.length!==1?'s':''} processed`,'ok');
  document.getElementById('xml-fi').value='';
  renderData();renderOV();
}

  }).join('');
  el.innerHTML=`
    <div class="page-hdr"><h2>User Management</h2><p>${ALL_USERS.length} account${ALL_USERS.length!==1?'s':''} · users log in at this app's URL with their email</p></div>
    <div class="add-user-card">
      <h3>Adding Users</h3>
      <p style="font-size:12px;color:var(--txt-dim);line-height:1.6;margin-top:6px">To add someone, create their account in <a href="https://console.firebase.google.com/project/irfu-referee-analysis/authentication/users" target="_blank" style="color:var(--green)">Firebase Console → Authentication → Add user</a>. They'll appear here after their first login. Then set their role below.</p>
      <div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap">
        <div style="font-size:11px;color:var(--txt-dim);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;line-height:1.6">
          <span style="color:var(--green);font-weight:700">Admin</span> — Full access: data upload, user management, own private depth chart
        </div>
        <div style="font-size:11px;color:var(--txt-dim);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;line-height:1.6">
          <span style="color:#3b5bdb;font-weight:700">Editor</span> — Own private depth chart (notes + rankings), view-only on all data tabs
        </div>
        <div style="font-size:11px;color:var(--txt-dim);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;line-height:1.6">
          <span style="font-weight:700">Viewer</span> — Read-only access to all data tabs, no depth chart
        </div>
      </div>
    </div>
    ${ALL_USERS.length?`<div class="table-wrap"><table>
      <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Last Login</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`:'<div class="no-data">No users have logged in yet.</div>'}`;
}
async function setUserRole(uid,newRole){
  try{
    await FIRESTORE.doc(`users/${uid}`).update({role:newRole});
    const label=newRole==='admin'?'Admin':newRole==='editor'?'Editor':'Viewer';
    toast(`Role updated to ${label}`,'ok');
    renderUsers();
  }catch(e){toast('Failed to update role','err');}
}

// ===== INIT =====
async function init(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    FIRESTORE=firebase.firestore();
    AUTH=firebase.auth();
    // Also keep DB as alias for any remaining references
    DB=FIRESTORE;
  }catch(e){
    document.getElementById('loading-overlay').innerHTML='<div style="color:#fff;font-size:14px;text-align:center;padding:40px">Unable to connect to database.<br>Please refresh the page.</div>';
    return;
  }
  AUTH.onAuthStateChanged(async (user)=>{
    if(user){
      try{
        const userSnap=await FIRESTORE.doc(`users/${user.uid}`).get();
        let role='viewer';
        let name=user.displayName||user.email.split('@')[0];
        if(userSnap.exists){
          const data=userSnap.data();
          role=data.role||'viewer';
          name=data.name||name;
          await FIRESTORE.doc(`users/${user.uid}`).update({lastLogin:new Date().toISOString()});
        }else{
          // First login — check if any admin exists; if not, make this user admin
          const adminSnap=await FIRESTORE.collection('users').where('role','==','admin').limit(1).get();
          if(!adminSnap||adminSnap.empty)role='admin';
          await FIRESTORE.doc(`users/${user.uid}`).set({
            email:user.email,name,role,
            createdAt:new Date().toISOString(),
            lastLogin:new Date().toISOString()
          });
        }
        if(role==='blocked'){
          AUTH.signOut();
          document.getElementById('loading-overlay').style.display='none';
          document.getElementById('screen-login').style.display='flex';
          document.getElementById('login-err').textContent='Your account has been suspended.';
          return;
        }
        SESSION={uid:user.uid,email:user.email,name,type:role};
        await loadMatches();
        showApp();
        // Handle Dropbox OAuth callback if redirected back from Dropbox
        if(window.location.search.includes('code='))await dbxHandleOAuthCallback();
      }catch(e){
        document.getElementById('loading-overlay').style.display='none';
        document.getElementById('screen-login').style.display='flex';
        document.getElementById('login-err').textContent='Error loading account — please try again.';
        AUTH.signOut();
      }
    }else{
      SESSION=null;
      document.getElementById('loading-overlay').style.display='none';
      document.getElementById('screen-login').style.display='flex';
    }
  });
}
window.onload=init;
document.addEventListener('click',function(e){
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none');
    GF_MS_OPEN=null;
  }
});
</script>
</body>

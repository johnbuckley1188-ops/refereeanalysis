<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rugby Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f2f4f2;--sb-bg:#fff;--green:#1a6b3e;--green-mid:#2a8a52;--green-dim:#e6f4ec;
  --red:#c0392b;--red-dim:#fdecea;--card:#fff;--border:#e2e8e2;--border-light:#edf1ed;
  --txt:#111f15;--txt-dim:#5a6e60;--txt-faint:#9aad9f;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;font-size:13px}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input,select{font-family:inherit;font-size:13px}

/* ==== LOADING ==== */
#loading-overlay{position:fixed;inset:0;background:#0d3d22;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:1000}
.lo-ball{width:48px;height:48px;background:#fff;border-radius:50% 30% 50% 30%;animation:spin 1.2s ease-in-out infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.lo-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:rgba(255,255,255,.6);letter-spacing:2px;text-transform:uppercase}

/* ==== LOGIN SCREEN ==== */
#screen-login{position:fixed;inset:0;background:#0d3d22;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.login-wrap{width:100%;max-width:740px}
.login-logo{text-align:center;margin-bottom:36px}
.login-ball{width:56px;height:56px;background:#fff;border-radius:50% 30% 50% 30%;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px}
.login-logo h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;color:#fff;letter-spacing:.5px}
.login-logo p{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:4px}
.login-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.login-panels{grid-template-columns:1fr}}
.lp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:28px 24px}
.lp-hdr{margin-bottom:22px}
.lp-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-bottom:10px}
.lp-badge.admin{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.lp-badge.user{background:#1a6b3e;color:#fff}
.lp-hdr h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:.3px}
.lp-hdr p{font-size:11px;color:rgba(255,255,255,.4);margin-top:4px}
.lp label{display:block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:6px;margin-top:14px}
.lp input{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;padding:10px 13px;outline:none;transition:border .12s}
.lp input::placeholder{color:rgba(255,255,255,.25)}
.lp input:focus{border-color:rgba(255,255,255,.4)}
.lp-btn{width:100%;margin-top:18px;padding:11px;border-radius:9px;font-weight:700;font-size:13px;letter-spacing:.5px;transition:all .15s;cursor:pointer;border:none}
.lp-btn.admin{background:rgba(255,255,255,.15);color:#fff}
.lp-btn.admin:hover{background:rgba(255,255,255,.25)}
.lp-btn.user{background:#1a6b3e;color:#fff}
.lp-btn.user:hover{background:#22855c}
.lp-err{margin-top:10px;font-size:11.5px;color:#ff8a8a;text-align:center;min-height:16px}

/* ==== SETUP SCREEN ==== */
#screen-setup{position:fixed;inset:0;background:#0d3d22;display:flex;align-items:center;justify-content:center;padding:20px}
.setup-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:36px;max-width:400px;width:100%;text-align:center}
.setup-card h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:#fff;margin-bottom:8px}
.setup-card p{font-size:12px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:24px}
.setup-card label{display:block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:6px;text-align:left;margin-top:14px}
.setup-card input{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;padding:10px 13px;outline:none;margin-bottom:4px}
.setup-card input:focus{border-color:rgba(255,255,255,.4)}
.setup-btn{width:100%;margin-top:20px;padding:12px;border-radius:9px;font-weight:700;font-size:14px;background:#1a6b3e;color:#fff;cursor:pointer;border:none;transition:background .15s}
.setup-btn:hover{background:#22855c}
.setup-err{font-size:11.5px;color:#ff8a8a;margin-top:10px;min-height:16px}

/* ==== APP SHELL ==== */
#screen-app{position:fixed;inset:0;display:flex}
.sidebar{width:216px;flex-shrink:0;background:var(--sb-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-ball{width:34px;height:34px;background:var(--green);border-radius:50% 30% 50% 30%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-wordmark h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.3px;color:var(--green);line-height:1.1}
.sb-wordmark p{font-size:10px;letter-spacing:1.5px;color:var(--txt-faint);text-transform:uppercase;margin-top:1px;font-weight:500}
.sb-user{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sb-avatar{width:26px;height:26px;border-radius:50%;background:var(--green-dim);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--green);flex-shrink:0}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-size:11.5px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:9.5px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.sb-user-role.admin-role{color:var(--green)}
.sb-user-role.editor-role{color:#3b5bdb}
.sb-nav{padding:10px 8px 6px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.sb-sep{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-faint);padding:10px 12px 4px;margin-top:4px}
.nav-btn{width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--txt-dim);display:flex;align-items:center;gap:9px;transition:all .12s}
.nav-btn svg{flex-shrink:0;opacity:.5;transition:opacity .12s}
.nav-btn:hover{background:var(--green-dim);color:var(--green)}
.nav-btn.active{background:var(--green-dim);color:var(--green);font-weight:600}
.nav-btn.active svg{opacity:1}
.sb-logout{padding:10px 14px;border-top:1px solid var(--border)}
.logout-btn{width:100%;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--txt-faint);display:flex;align-items:center;gap:8px;transition:all .12s}
.logout-btn:hover{background:var(--red-dim);color:var(--red)}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.panel{display:none;flex:1;overflow-y:auto;padding:24px 26px}
.panel.active{display:block}
.empty-state{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.empty-state .es-icon{font-size:40px;opacity:.3}
.empty-state h2{font-weight:600;font-size:16px;color:var(--txt-dim)}
.empty-state p{font-size:12px;color:var(--txt-faint);text-align:center;max-width:260px;line-height:1.6}
.page-hdr{margin-bottom:18px}
.page-hdr h2{font-weight:700;font-size:20px;letter-spacing:-.2px}
.page-hdr p{font-size:12px;color:var(--txt-dim);margin-top:3px}

/* ==== STAT PILLS ==== */
.stat-pills{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;box-shadow:var(--shadow)}
.sp-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;color:var(--green);line-height:1}
.sp-lbl{font-size:10px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:1.2px;margin-top:2px;font-weight:600}

/* ==== TABLES ==== */
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
table th{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt-faint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:#fafbfa}
table td{padding:9px 14px;border-bottom:1px solid var(--border-light);font-size:12.5px;color:var(--txt-dim)}
table tr:last-child td{border-bottom:none}
table tr:hover td{background:#f7fbf8}
.score-cell{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--txt);letter-spacing:.5px}
.tw{font-weight:600;color:var(--txt)}.tl{color:var(--txt-dim)}
.ref-pill{font-size:10px;color:var(--txt-dim);background:#f0f4f1;padding:3px 9px;border-radius:20px;border:1px solid var(--border);font-weight:500}
.week-pill{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--green);background:var(--green-dim);padding:2px 8px;border-radius:5px}
.ha-h{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--green-dim);color:var(--green)}
.ha-a{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#edf0fd;color:#3b5bdb}

/* ==== OV FILTERS ==== */
.ov-filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px;box-shadow:var(--shadow)}
.ov-filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ctrl-group{display:flex;flex-direction:column;gap:5px}
.ctrl-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-faint)}
select{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:7px 11px;outline:none;cursor:pointer;box-shadow:var(--shadow);font-weight:500}
select:focus{border-color:var(--green)}
.flt-sel{min-width:140px}
.flt-date{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:7px 11px;outline:none;box-shadow:var(--shadow);font-weight:500;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}
.flt-date:focus{border-color:var(--green)}
.flt-disabled{opacity:.38;pointer-events:none}
.clear-flt{padding:7px 13px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--txt-dim);border:1px solid var(--border);background:var(--bg);cursor:pointer;white-space:nowrap;align-self:flex-end;transition:all .12s}
.clear-flt:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.flt-active-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:4px;vertical-align:middle}
.flt-toggle{padding:7px 13px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--txt-dim);border:1px solid var(--border);background:var(--bg);cursor:pointer;white-space:nowrap;transition:all .12s}
.flt-toggle:hover{border-color:var(--green);color:var(--green)}
.flt-toggle.flt-on{background:var(--green-dim);color:var(--green);border-color:var(--green)}
.ov-card-yc{color:#c4940a;font-size:9px;font-weight:700;margin-left:4px}
.ov-card-rc{color:#c62020;font-size:9px;font-weight:700;margin-left:3px}
.cr-y{display:inline-block;width:8px;height:11px;background:#f0c000;border:1px solid rgba(0,0,0,.25);border-radius:1px;vertical-align:middle;flex-shrink:0}
.cr-r{display:inline-block;width:8px;height:11px;background:#cc2200;border:1px solid rgba(0,0,0,.18);border-radius:1px;vertical-align:middle;flex-shrink:0}
.card-cell{display:inline-flex;align-items:center;gap:2px}
.gfbar{background:var(--sb-bg);border-bottom:2px solid var(--green-dim);padding:7px 14px;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;flex-shrink:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.gfbar .ctrl-group{flex:0 0 auto}
.gfbar .ctrl-lbl{font-size:9px}
.gfbar select,.gfbar .flt-date{padding:4px 8px;font-size:11px;height:27px}
.gfbar .gf-clear{padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;color:var(--txt-dim);border:1px solid var(--border);background:var(--bg);cursor:pointer;white-space:nowrap;transition:all .12s;height:27px}
.gfbar .gf-clear:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
/* ==== MULTI-SELECT FILTER ==== */
.ms-wrap{position:relative;display:inline-block}
.ms-btn{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:11px;color:var(--txt);cursor:pointer;min-width:110px;justify-content:space-between;white-space:nowrap;height:27px;box-shadow:var(--shadow);font-family:'Inter',sans-serif}
.ms-btn:hover{border-color:var(--green)}
.ms-btn.has-sel{border-color:var(--green);background:var(--green-dim);color:var(--green);font-weight:600}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;min-width:200px;max-width:300px;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:300;overflow:hidden}
.ms-search-inp{width:100%;padding:7px 10px;border:none;border-bottom:1px solid var(--border-light);font-size:12px;color:var(--txt);outline:none;background:var(--card);font-family:'Inter',sans-serif}
.ms-search-inp::placeholder{color:var(--txt-faint)}
.ms-opts{max-height:220px;overflow-y:auto}
.ms-opt{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:12px;color:var(--txt);cursor:pointer;border:none;background:none;width:100%;text-align:left;white-space:nowrap}
.ms-opt:hover{background:var(--green-dim);color:var(--green)}
.ms-opt input[type=checkbox]{flex-shrink:0;accent-color:var(--green);width:13px;height:13px;pointer-events:none}
.ms-opt.ms-hid{display:none}
.ms-no-match{padding:8px 10px;font-size:11px;color:var(--txt-faint);text-align:center}
.ms-foot{padding:5px 8px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end}
.ms-clear-btn{font-size:10px;color:var(--txt-faint);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px}
.ms-clear-btn:hover{color:var(--red);background:var(--red-dim)}
.rs-wide .rk-mini-card{min-width:0}
.ov-section{margin-bottom:24px}
.ov-section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 2px}
.ov-section-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:.3px;color:var(--txt)}
.ov-section-ct{font-size:10px;font-weight:600;color:var(--txt-faint);background:#f0f4f1;padding:3px 9px;border-radius:10px;letter-spacing:.5px;text-transform:uppercase}
.ov-section-toggle{margin-left:auto;font-size:11px;font-weight:600;color:var(--green);cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;padding:3px 0}
.ov-section-toggle:hover{text-decoration:underline}
.no-data{color:var(--txt-faint);font-size:12px;padding:20px 0;text-align:center}

/* ==== RANKINGS ==== */
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;background:#f0f4f1;color:var(--txt-dim);flex-shrink:0}
.rank-badge.rank-1{background:var(--green);color:#fff}
.rank-badge.rank-2{background:#2a8a52;color:#fff}
.rank-badge.rank-3{background:#4aab72;color:#fff}
.rank-badge.rank-last{background:var(--red-dim);color:var(--red)}
.rank-bar-wrap{display:flex;align-items:center;gap:5px}
.rank-bar-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:30px}
.rank-bar-fill{height:100%;border-radius:3px}
.rk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.rk-mini-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.rk-mini-hdr{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:7px 10px;border-bottom:1px solid var(--border);background:#fafbfa;display:flex;justify-content:space-between;align-items:center;color:var(--txt)}
.rk-mini-dir{font-size:8.5px;color:var(--txt-faint);font-weight:500;letter-spacing:0;text-transform:none}
.rk-mini-card table{width:100%;border-collapse:collapse}
.rk-mini-card table tr:hover td{background:#f7fbf8}
.rk-mini-card table td{padding:4px 5px;border-bottom:1px solid var(--border-light);font-size:11.5px}
.rk-mini-card table tr:last-child td{border-bottom:none}
.trend-table th{text-align:center}
.trend-table th:nth-child(1),.trend-table th:nth-child(2),.trend-table th:nth-child(3),.trend-table td:nth-child(1),.trend-table td:nth-child(2),.trend-table td:nth-child(3){text-align:left}
.trend-table td{text-align:center;font-variant-numeric:tabular-nums}
.td-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px}
.res-w{color:var(--green);font-weight:700}.res-l{color:var(--red);font-weight:700}.res-d{color:var(--txt-dim);font-weight:600}

/* ==== DEFENSIVE RUCKS ==== */
.bd-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:auto}
.bd-table{width:100%;border-collapse:collapse;font-size:12px}
.bd-table thead th{position:sticky;background:#fafbfa;z-index:1;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt-dim);padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--border)}
.bd-table thead tr.bd-grp th{top:0;padding:5px 8px 0;border-bottom:none;height:20px}
.bd-table thead tr:not(.bd-grp) th{top:20px}
.bd-table th.bd-num{cursor:pointer;text-align:right}
.bd-table th.bd-num:hover{color:var(--green)}
.bd-table th.bd-on{color:var(--green)}
.bd-bep-h{text-align:center!important;color:#7a3fb0!important;border-bottom:2px solid #d9c6ec!important}
.bd-table td{padding:6px 8px;border-bottom:1px solid var(--border-light);white-space:nowrap}
.bd-table td.bd-num{text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bd-table td.bd-on{background:rgba(26,107,62,.05)}
.bd-table td.bd-bep,.bd-table th.bd-bep{background-color:rgba(122,63,176,.04)}
.bd-table tr:hover td{background:#f7fbf8}
.bd-table tr.bd-hl td{background:rgba(26,107,62,.12);font-weight:700}
.bd-rk{width:30px}
.bd-name{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.bd-team{color:var(--txt-faint);font-size:11px}
.bd-rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:70px}
.bd-rate i{display:block;height:4px;border-radius:2px;background:var(--green);align-self:stretch;max-width:100%}
.bd-tbtn{font-size:11px;font-weight:600;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--txt-dim)}
.bd-tbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
.bd-note{background:#fff4e0;color:#9a5a00;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}

/* ==== TRENDS ==== */
.ctrl-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:flex-end}
.t-section{margin-bottom:22px}
.t-sec-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:9px;padding-left:1px}
.t-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.t-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.t-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 9px 6px;box-shadow:var(--shadow)}
.t-title{font-size:11px;font-weight:600;color:var(--txt);margin-bottom:4px}
canvas.tc{width:100%;height:130px;display:block}

/* ==== REFEREE ==== */
.ref-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.ref-list{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.rl-hdr{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);padding:11px 14px;border-bottom:1px solid var(--border);background:#fafbfa}
.ri{padding:11px 14px;border-bottom:1px solid var(--border-light);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.ri:last-child{border-bottom:none}
.ri:hover{background:#f7fbf8}
.ri.active{background:var(--green-dim);border-left:3px solid var(--green)}
.ri-name{font-size:12.5px;font-weight:500;color:var(--txt)}
.ri.active .ri-name{color:var(--green);font-weight:700}
.ri-cnt{font-size:10px;color:var(--txt-faint);background:#f0f4f1;padding:2px 7px;border-radius:10px;font-weight:500}
.ref-detail{display:flex;flex-direction:column;gap:14px}
.rd-name{font-weight:700;font-size:22px;color:var(--txt);letter-spacing:-.2px}
.rd-sub{font-size:12px;color:var(--txt-dim);margin-top:3px}
.rs-row{display:flex;gap:10px;flex-wrap:wrap}
.rs{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:110px;box-shadow:var(--shadow)}
.rs-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;color:var(--green);line-height:1}
.rs-lbl{font-size:9px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px;font-weight:700}
.ref-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.rbox-hdr{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:12px}
.inf-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.inf-lbl{font-size:10px;color:var(--txt-dim);width:60px;flex-shrink:0;font-weight:500;line-height:1.3}
.inf-track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.inf-fill{height:100%;border-radius:4px}
.inf-num{font-size:11px;color:var(--txt-dim);width:26px;text-align:right;flex-shrink:0;font-weight:600}
canvas.pitch{width:100%;border-radius:8px;display:block;height:160px}
.pitch-wrap{position:relative;width:100%}
.pitch-tip{position:absolute;display:none;background:#111f15;color:#fff;padding:7px 11px;border-radius:8px;font-size:11px;pointer-events:none;z-index:100;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.35);line-height:1.6}
canvas.pitch-p{border-radius:8px;display:block;height:100%;aspect-ratio:70/90;width:auto;max-width:100%}
.rf-body{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:stretch;height:calc(100vh - 260px);min-height:480px;max-height:720px;min-height:0}
.rf-body-left{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
.rf-body-right{display:flex;flex-direction:row;gap:12px;align-items:stretch;min-height:0;height:100%}
.rf-controls{display:flex;flex-direction:column;gap:8px}
.rf-matches-top{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.rf-matches-top .table-wrap{border:none;box-shadow:none;max-height:160px;overflow-y:auto}
.rf-top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.rf-ref-info{display:flex;flex-direction:column;gap:8px}
.rf-ref-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.5px;color:var(--txt);line-height:1}
.rf-ref-sub{font-size:12px;color:var(--txt-dim)}
.rf-recent{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:220px;max-width:280px;box-shadow:var(--shadow)}
.rf-recent-hdr{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:10px}
.rf-recent-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.rf-rg{font-size:11px;cursor:pointer;padding:5px 8px;border-radius:6px;transition:background .12s}
.rf-rg:hover{background:var(--green-dim)}
.rf-rg.sel{background:var(--green-dim);color:var(--green);font-weight:600}
.rf-rg-date{font-size:10px;color:var(--txt-faint);margin-bottom:1px}
.rf-rg-match{color:var(--txt-dim)}
.rf-stats{display:flex;gap:8px;flex-wrap:wrap}
.rf-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:90px;flex:1;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px}
.rf-stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;color:var(--green);line-height:1}
.rf-stat-lbl{font-size:11px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
tr.sel-row td{background:var(--green-dim)!important;color:var(--green)!important;font-weight:600}

/* ==== IRFU DEPTH CHART ==== */
/* ==== IRFU BOARD ==== */
.irfu-board{display:flex;flex-direction:column;gap:6px}
.irfu-col{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:background .12s,border .12s}
.irfu-col.drag-over{border-color:var(--green);background:var(--green-dim)}
.irfu-col-hdr{padding:7px 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green)}
.irfu-col-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff}
.irfu-col-count{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(0,0,0,.18);padding:1px 7px;border-radius:10px}
.irfu-chips{padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px;min-height:36px;justify-content:center}
.irfu-chip{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:500;color:var(--txt);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .12s;user-select:none}
.irfu-chip:hover{border-color:var(--green);background:var(--green-dim);color:var(--green)}
.irfu-chip.irfu-dragging{opacity:.35;transform:scale(.96)}
.irfu-grip{font-size:12px;color:var(--txt-faint);flex-shrink:0;cursor:grab;opacity:.5}
.irfu-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irfu-x{font-size:15px;line-height:1;color:var(--txt-faint);padding:0 2px;border-radius:4px;opacity:0;transition:opacity .12s;flex-shrink:0;border:none;background:none;cursor:pointer}
.irfu-chip:hover .irfu-x{opacity:.7}
.irfu-x:hover{color:var(--red)!important;opacity:1!important}
.irfu-pool-section{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.irfu-pool-hdr{padding:10px 14px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.irfu-pool-title{font-size:12px;font-weight:700;color:var(--txt)}
.irfu-add-btn{font-size:11px;font-weight:700;padding:5px 12px;border-radius:7px;background:var(--green-dim);color:var(--green);border:1px solid rgba(26,107,62,.25);cursor:pointer;transition:all .12s}
.irfu-add-btn:hover{background:var(--green);color:#fff}
.irfu-pool-chips{padding:10px;display:flex;flex-wrap:wrap;gap:5px;min-height:52px}
.irfu-pool-chips.drag-over{background:var(--green-dim)}
.irfu-pool-empty{color:var(--txt-faint);font-size:12px;padding:4px 2px;font-style:italic}
.irfu-cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;margin-top:5px}
/* ==== IRFU PROFILE PANEL ==== */
.irfu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:flex;justify-content:flex-end}
.irfu-panel{width:460px;max-width:100vw;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;animation:irfuSlide .2s ease}
@keyframes irfuSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
.irfu-panel-hdr{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;gap:10px}
.irfu-panel-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1.1}
.irfu-panel-close{font-size:18px;color:var(--txt-faint);padding:2px 7px;border-radius:6px;flex-shrink:0;transition:all .12s;border:none;background:none;cursor:pointer}
.irfu-panel-close:hover{background:var(--bg);color:var(--txt)}
.irfu-panel-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.irfu-ptab-body{display:flex;flex-direction:column;flex:1;overflow:hidden}
.irfu-ptab-body[data-tab="mine"] .irfu-panel-body{flex:1;overflow-y:auto}
/* Sections */
.irfu-section{display:flex;flex-direction:column;gap:6px}
.irfu-sec-hdr{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-faint);display:flex;align-items:center;gap:7px}
.irfu-opta-src{font-size:9px;font-weight:600;background:var(--green-dim);color:var(--green);padding:1px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.8px}
/* Opta match rows */
.irfu-opta-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border-radius:7px;font-size:12px;border:1px solid var(--border-light)}
.irfu-opta-date{color:var(--txt-faint);font-size:10px;min-width:68px;flex-shrink:0}
.irfu-opta-teams{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irfu-opta-score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--green);flex-shrink:0}
/* Note items */
.irfu-fld-wrap{display:flex;flex-direction:column;gap:4px}
.irfu-note-item{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--bg);border-radius:7px;border:1px solid var(--border-light);transition:opacity .2s,background .15s}
.irfu-note-item:hover{border-color:var(--border)}
.irfu-note-item.is-done{opacity:.45}
.irfu-note-item.is-done .irfu-note-text{text-decoration:line-through;color:var(--txt-faint)}
.irfu-note-check{flex-shrink:0;cursor:pointer}
.irfu-note-check input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--green);margin:0}
.irfu-note-text{flex:1;border:none;background:transparent;color:var(--txt);font-size:12px;font-family:'Inter',sans-serif;outline:none;min-width:0;padding:1px 3px}
.irfu-note-text::placeholder{color:var(--txt-faint)}
.irfu-note-prio{width:26px;height:22px;border-radius:5px;border:1px solid;font-size:10px;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;padding:0;line-height:1}
.irfu-note-date{border:none;background:transparent;color:var(--txt-dim);font-size:10px;font-family:'Inter',sans-serif;outline:none;cursor:pointer;padding:1px 0;flex-shrink:0;width:90px}
.irfu-note-del{font-size:15px;line-height:1;color:var(--txt-faint);padding:0 3px;border-radius:4px;flex-shrink:0;opacity:0;transition:opacity .12s;border:none;background:none;cursor:pointer}
.irfu-note-item:hover .irfu-note-del{opacity:.7}
.irfu-note-del:hover{color:var(--red)!important;opacity:1!important}
.irfu-note-add{margin-top:3px;font-size:11px;font-weight:600;color:var(--green);padding:4px 8px;border-radius:6px;border:1px dashed rgba(26,107,62,.3);background:transparent;cursor:pointer;transition:all .12s;width:100%;text-align:left}
.irfu-note-add:hover{background:var(--green-dim);border-style:solid}
.irfu-empty-note{color:var(--txt-faint);font-size:12px;padding:4px 2px;font-style:italic}
/* Notes dot & filter */
.irfu-notes-dot{width:7px;height:7px;border-radius:50%;background:#1a6b3e;flex-shrink:0;box-shadow:0 0 0 1px rgba(26,107,62,.25)}
.irfu-chip.has-notes{border-color:rgba(26,107,62,.35);background:rgba(26,107,62,.06)}
.irfu-chip.irfu-dimmed{opacity:.28;pointer-events:none}
/* Profile tabs */
.irfu-ptabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.irfu-ptab{padding:7px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;color:var(--txt-faint);border:1px solid transparent;border-bottom:none;cursor:pointer;transition:all .12s;background:none}
.irfu-ptab:hover{color:var(--txt);background:var(--bg)}
.irfu-ptab.irfu-ptab-on{background:var(--card);color:var(--green);border-color:var(--border);border-bottom:1px solid var(--card);margin-bottom:-1px;position:relative;z-index:1}
.irfu-share-bar{padding:10px 18px;background:var(--green-dim);border-bottom:1px solid rgba(26,107,62,.15);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.irfu-share-status{font-size:11px;color:var(--green);font-weight:600}
.irfu-share-btn{font-size:11px;font-weight:700;padding:5px 12px;border-radius:7px;cursor:pointer;border:none;transition:all .12s}
.irfu-share-btn.share{background:var(--green);color:#fff}
.irfu-share-btn.share:hover{background:#156132}
.irfu-share-btn.unshare{background:transparent;border:1px solid rgba(26,107,62,.35);color:var(--green)}
.irfu-share-btn.unshare:hover{background:rgba(26,107,62,.12)}
/* ==== DEPTH CHART: freshness line, risk flag, filter ==== */
.irfu-chip{position:relative;overflow:hidden;padding-bottom:8px}
.irfu-fresh{position:absolute;left:0;right:0;bottom:0;height:3px}
.irfu-fresh-fresh{background:#2a8a52}
.irfu-fresh-due{background:#e0a100}
.irfu-fresh-stale{background:#c0392b}
.irfu-fresh-never{background:repeating-linear-gradient(90deg,#c9d3cb 0 4px,transparent 4px 7px)}
.irfu-risk{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);flex-shrink:0}
.irfu-risk-amber{background:#e08a00}
.irfu-risk-red{background:#c0392b}
.irfu-filter-sel{font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--txt);cursor:pointer}
.irfu-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--txt-dim);margin:-4px 0 12px}
.irfu-legend span{display:inline-flex;align-items:center;gap:5px}
.irfu-legend i{display:inline-block;width:18px;height:3px;border-radius:2px}

/* ==== REFEREE PAGE ==== */
.irp-overlay{position:fixed;inset:0;background:rgba(10,30,18,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.irp{width:min(1240px,100%);height:min(94vh,100%);background:var(--bg);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:irpIn .18s ease}
@keyframes irpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.irp-hdr{background:#0f4a2a;color:#fff;padding:12px 52px 0 18px;flex-shrink:0;position:relative}
.irp-hdr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.irp-hdr-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;letter-spacing:.3px;line-height:1}
.irp-hdr-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1}
.irp-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.irp-pill.amber{background:#e08a00}.irp-pill.red{background:#c0392b}.irp-pill.green{background:rgba(255,255,255,.14)}
.irp-close{position:absolute;top:9px;right:10px;font-size:18px;color:rgba(255,255,255,.8);padding:4px 9px;border-radius:7px}
.irp-close:hover{background:rgba(255,255,255,.12);color:#fff}
.irp-share{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.75)}
.irp-share button{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;background:#fff;color:#0f4a2a}
.irp-share button.unshare{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.irp-tabs{display:flex;gap:2px;margin-top:10px}
.irp-tab{padding:8px 16px;font-size:12px;font-weight:700;color:rgba(255,255,255,.65);border-radius:8px 8px 0 0}
.irp-tab:hover{color:#fff}
.irp-tab.on{background:var(--bg);color:#0f4a2a}
.irp-body{flex:1;overflow-y:auto;padding:16px 18px 24px}
.irp-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
.irp-side,.irp-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.irp-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.irp-card-hdr{font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-faint);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.irp-card-hdr .sp{flex:1}
.irp-count{font-size:10px;font-weight:700;background:var(--bg);color:var(--txt-dim);padding:1px 7px;border-radius:8px;letter-spacing:0}
/* Bio */
.irp-bio-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.irp-photo{width:92px;height:110px;border-radius:10px;background:var(--green-dim) center/cover no-repeat;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;color:var(--green);border:1px solid var(--border)}
.irp-photo-btn{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md)}
.irp-photo-rm{position:absolute;left:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--red);font-size:13px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.irp-bio-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;line-height:1.05}
.irp-age{font-size:12px;color:var(--txt-dim);margin-top:4px}
.irp-facts{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:12px}
.irp-facts label{color:var(--txt-faint);font-size:11px;font-weight:600}
.irp-in{width:100%;border:1px solid transparent;background:var(--bg);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--txt);outline:none;min-width:0}
.irp-in:hover{border-color:var(--border)}
.irp-in:focus{border-color:var(--green);background:#fff}
.irp-unit{display:flex;align-items:center;gap:5px}
.irp-unit span{color:var(--txt-faint);font-size:11px}
.irp-bronco{margin-top:12px;padding:10px;border-radius:9px;background:var(--green-dim);border:1px solid rgba(26,107,62,.18)}
.irp-bronco-row{display:flex;gap:8px;align-items:center}
.irp-bronco-score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--green);background:transparent;border:none;width:84px;outline:none;padding:0}
.irp-bronco-age{font-size:11px;font-weight:600}
.irp-upd{margin-top:10px;font-size:11px;color:var(--txt-faint);display:flex;align-items:center;gap:6px}
.irp-upd i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* Load */
.irp-load-big{display:flex;align-items:baseline;gap:8px}
.irp-load-num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;line-height:1}
.irp-load-lbl{font-size:12px;color:var(--txt-dim)}
.irp-load-num.green{color:var(--green)}.irp-load-num.amber{color:#d07a00}.irp-load-num.red{color:var(--red)}
.irp-load-banner{margin:8px 0;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600}
.irp-load-banner.amber{background:#fff4e0;color:#9a5a00}.irp-load-banner.red{background:var(--red-dim);color:var(--red)}.irp-load-banner.green{background:var(--green-dim);color:var(--green)}
.irp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.irp-stat{background:var(--bg);border-radius:8px;padding:7px;text-align:center}
.irp-stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800}
.irp-stat span{font-size:10px;color:var(--txt-faint)}
.irp-strip{display:flex;gap:3px;margin:6px 0 2px}
.irp-strip div{flex:1;height:22px;border-radius:4px;background:var(--bg);border:1px solid var(--border-light);position:relative}
.irp-strip div.on{background:var(--green);border-color:var(--green)}
.irp-strip div.on.amber{background:#e08a00;border-color:#e08a00}
.irp-strip div.on.red{background:var(--red);border-color:var(--red)}
.irp-strip div.na{background:repeating-linear-gradient(45deg,#e7ebe8 0 3px,#fff 3px 6px)}
.irp-strip div.now{outline:2px solid #0f4a2a;outline-offset:1px}
.irp-strip div.fut{opacity:.55}
.irp-strip-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--txt-faint)}
.irp-thr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--txt-dim);margin-top:8px}
.irp-thr input{width:42px;padding:3px 5px;border:1px solid var(--border);border-radius:5px;font-size:11px;text-align:center}
.irp-sub{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt-faint);margin:12px 0 6px}
/* Generic rows */
.irp-row{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--bg);border:1px solid var(--border-light);border-radius:8px;margin-bottom:4px}
.irp-row:hover{border-color:var(--border)}
.irp-row.done{opacity:.5}
.irp-row.done .irp-txt{text-decoration:line-through}
.irp-txt{flex:1;min-width:0;border:none;background:transparent;font-size:12px;color:var(--txt);outline:none;padding:2px}
.irp-date{border:none;background:transparent;font-size:11px;color:var(--txt-dim);outline:none;width:112px;flex-shrink:0}
.irp-del{font-size:16px;color:var(--txt-faint);padding:0 4px;opacity:.5;flex-shrink:0}
.irp-del:hover{opacity:1;color:var(--red)}
.irp-add{font-size:11px;font-weight:700;color:var(--green);padding:6px 9px;border-radius:7px;border:1px dashed rgba(26,107,62,.35);width:100%;text-align:left;margin-top:2px}
.irp-add:hover{background:var(--green-dim);border-style:solid}
.irp-empty{color:var(--txt-faint);font-size:12px;font-style:italic;padding:4px 2px 6px}
/* Games */
.irp-games{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.irg-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 7px;background:var(--bg);border:1px solid var(--border-light);border-radius:8px;margin-bottom:4px}
.irg-row.today{border-color:var(--green);background:var(--green-dim)}
.irg-row.opta-only .irg-txt-ro{color:var(--txt-dim)}
.irg-row .irp-date,.irg-dlabel{width:108px;flex-shrink:0}
.irg-row .irg-role{width:66px;flex-shrink:0}
.irg-row .irp-txt,.irg-row .irg-txt-ro{flex:1 1 100%;order:5;font-weight:500;padding:3px 2px 1px}
.irg-row .irg-score{margin-left:auto}
.irg-row .irp-del{margin-left:auto}
.irg-row .irg-score+.irp-del{margin-left:0}
.irg-dlabel{font-size:11px;color:var(--txt-dim);padding-left:2px}
.irg-role{font-size:10px;font-weight:800;border-radius:6px;padding:3px 4px;border:none;color:#fff;text-align:center;cursor:pointer;appearance:none;-webkit-appearance:none}
.irg-role.r-Referee{background:#1a6b3e}.irg-role.r-AR1,.irg-role.r-AR2{background:#2f5fb3}.irg-role.r-TMO{background:#7a3fb0}.irg-role.r-FPRO{background:#b0457a}.irg-role.r-No4,.irg-role.r-No5{background:#6b7a70}
.irg-txt-ro{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irg-score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;color:var(--green);white-space:nowrap}
.irg-opta{font-size:8px;font-weight:800;letter-spacing:.6px;background:var(--green-dim);color:var(--green);padding:1px 5px;border-radius:6px;margin-left:4px;vertical-align:middle}
.irg-more{font-size:11px;font-weight:600;color:var(--txt-dim);padding:4px 2px}
.irg-list{overflow-y:auto;margin:0 -4px 4px;padding:0 4px;overscroll-behavior:contain}
.irg-list.scrolls{border-bottom:1px solid var(--border-light);box-shadow:inset 0 -10px 8px -10px rgba(0,0,0,.15)}
.irg-tally{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 10px}
.irg-tally span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-dim);background:var(--bg);border-radius:8px;padding:2px 8px}
.irg-tally b{color:var(--txt);font-weight:800}
.irg-tally i{width:8px;height:8px;border-radius:2px;display:inline-block}
.irg-tally .zero{opacity:.45}
.irg-more:hover{color:var(--green)}
/* Development board */
.irp-dev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.irp-devcol{background:var(--bg);border-radius:10px;padding:8px;min-height:120px;border:2px dashed transparent;transition:border-color .12s,background .12s}
.irp-devcol.drag-over{border-color:var(--green);background:var(--green-dim)}
.irp-devcol-hdr{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:2px 4px 8px}
.irp-devcol-hdr i{width:8px;height:8px;border-radius:50%;display:inline-block}
.irp-devcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 6px 6px 4px;margin-bottom:6px;display:flex;gap:4px;align-items:flex-start;box-shadow:var(--shadow)}
.irp-devcard.dragging{opacity:.35}
.irp-devgrip{cursor:grab;color:var(--txt-faint);font-size:13px;padding:3px 2px;user-select:none}
.irp-devtxt{flex:1;min-width:0;border:none;background:transparent;font-size:12px;line-height:1.45;color:var(--txt);resize:none;outline:none;overflow:hidden;font-family:inherit;padding:2px}
.irp-devbtns{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.irp-devbtns button{font-size:11px;color:var(--txt-faint);width:20px;height:18px;border-radius:4px;line-height:1}
.irp-devbtns button:hover{background:var(--green-dim);color:var(--green)}
.irp-devbtns button.x:hover{background:var(--red-dim);color:var(--red)}
.irp-devmeta{font-size:9px;color:var(--txt-faint);padding:0 2px}
/* Notes */
.irp-note{background:var(--bg);border:1px solid var(--border-light);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.irp-note-top{display:flex;align-items:center;gap:6px}
.irp-note textarea{width:100%;border:none;background:transparent;font-size:12px;line-height:1.5;resize:none;outline:none;overflow:hidden;font-family:inherit;color:var(--txt);padding:2px 0}
/* Calendar */
.irc-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.irc-bar h3{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;min-width:150px}
.irc-btn{font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;background:var(--card);border:1px solid var(--border)}
.irc-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.irc-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.irc-sum div{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 12px;font-size:11px;color:var(--txt-dim)}
.irc-sum b{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--txt);margin-right:4px}
.irc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.irc-dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--txt-faint);text-align:center;padding:4px 0}
.irc-day{background:var(--card);border:1px solid var(--border-light);border-radius:8px;min-height:86px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.irc-day.wkend{background:#f7faf7}
.irc-day.out{opacity:.35}
.irc-day.today{border:2px solid var(--green)}
.irc-day.unav{background:repeating-linear-gradient(45deg,#fdecea 0 6px,#fff 6px 12px)}
.irc-day.free-wkend{background:#f0f7ff}
.irc-dnum{font-size:11px;font-weight:700;color:var(--txt-dim);display:flex;justify-content:space-between}
.irc-game{font-size:10px;line-height:1.25;border-radius:5px;padding:3px 5px;color:#fff;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.irc-game.r-Referee{background:#1a6b3e}.irc-game.r-AR1,.irc-game.r-AR2{background:#2f5fb3}.irc-game.r-TMO{background:#7a3fb0}.irc-game.r-FPRO{background:#b0457a}.irc-game.r-No4,.irc-game.r-No5{background:#6b7a70}
.irc-unav-lbl{font-size:9px;font-weight:700;color:var(--red)}
.irc-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--txt-dim);margin-top:10px}
.irc-legend span{display:inline-flex;align-items:center;gap:5px}
.irc-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.irc-season{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.irc-month{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.irc-month h4{font-size:12px;font-weight:800;margin-bottom:6px}
.irc-wk{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--border-light);font-size:11px}
.irc-wk:first-of-type{border-top:none}
.irc-wk-d{width:52px;color:var(--txt-faint);flex-shrink:0}
.irc-wk-s{width:10px;height:10px;border-radius:3px;flex-shrink:0;background:#dfe7e1}
.irc-wk-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irc-hint{font-size:11px;color:var(--txt-faint);margin-top:6px}
.irg-mx{font-size:8px;font-weight:800;letter-spacing:.6px;background:#e8eefb;color:#2f5fb3;padding:2px 6px;border-radius:6px}
.irg-row.mx-row{background:#fbfcff}
.irc-unav-lbl.inj{color:#fff;background:var(--red);padding:0 4px;border-radius:4px}
.irfu-mx-status{font-size:11px;color:var(--txt-dim)}
.mx-modal{width:min(980px,100%)}
.mx-un{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--border-light)}
.mx-un:first-of-type{border-top:none}
.mx-un-l{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;font-size:12px}
.mx-un-l span{font-size:11px;color:var(--txt-faint)}
.mx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.mx-ref{background:var(--bg);border:1px solid var(--border-light);border-radius:8px;padding:6px 9px;font-size:12px}
.mx-ref summary{cursor:pointer;display:flex;flex-direction:column;gap:1px}
.mx-ref summary span{font-size:11px;color:var(--txt-faint)}
.mx-a{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:11px;border-top:1px solid var(--border-light)}
.mx-a span{width:44px;color:var(--txt-faint);flex-shrink:0}
.mx-a i{font-style:normal;font-size:9px;padding:1px 5px;border-radius:5px;flex-shrink:0}
.mx-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.mx-foot span{flex:1 1 260px;font-size:11px;color:var(--txt-faint)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ph-cell{display:flex;flex-direction:column;gap:2px;font-size:11px;min-width:0}
.ph-cell span{color:var(--txt-faint);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-img{aspect-ratio:240/288;border-radius:8px;background:var(--green-dim) center/cover no-repeat;border:1px solid var(--border)}
@media(max-width:900px){
  .irp-grid{grid-template-columns:1fr}
  .irp-games{grid-template-columns:1fr}
}
@media(max-width:700px){
  .irp-overlay{padding:0}
  .irp{height:100%;border-radius:0}
  .irp-dev{grid-template-columns:1fr}
  .irp-body{padding:12px}
  .irc-day{min-height:62px;padding:3px}
  .irc-game{font-size:9px;padding:2px 3px;-webkit-line-clamp:2}
}
.irfu-filter-btn{font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--txt-dim);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:5px}
.irfu-filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.irfu-filter-btn.active:hover{background:#156132}
.irfu-filter-btn:not(.active):hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}

/* ==== ADMIN - DATA ==== */
.adm-section{margin-bottom:24px}
.adm-sec-hdr{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:10px}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--green);background:var(--green-dim)}
.dz-icon{font-size:28px;opacity:.4;margin-bottom:8px}
.dz-text{font-size:12px;color:var(--txt-faint);line-height:1.7}
.dz-browse{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.5px;margin-top:6px}
.progress-bar{background:var(--border);border-radius:6px;height:6px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .3s}
.dbx-wrap{background:var(--green-dim);border:1px solid rgba(26,107,62,.18);border-radius:10px;padding:16px}
.dbx-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.dbx-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.dbx-field label{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.dbx-input{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--txt);outline:none;font-size:12px;width:100%}
.dbx-input:focus{border-color:var(--green)}
.dbx-btn{padding:7px 14px;border-radius:7px;font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--txt);cursor:pointer;transition:all .12s;white-space:nowrap}
.dbx-btn:hover{background:var(--green);color:#fff;border-color:var(--green)}
.dbx-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.dbx-btn.primary:hover{background:#22855c}
.dbx-hint{font-size:10px;color:var(--green);opacity:.7;margin-top:3px;line-height:1.5}
.val-row{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1px solid var(--border-light);font-size:11px}
.val-ic{font-weight:700;flex-shrink:0;width:14px}
.val-ok .val-ic{color:#1a6b3e}.val-warn .val-ic{color:#d4860e}.val-err .val-ic{color:#c0392b}
.val-warns{margin-top:3px;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.progress-lbl{font-size:11px;color:var(--txt-dim);text-align:center}
.adm-match-meta{font-size:10px;color:var(--txt-faint);margin-top:2px}
.del-btn{font-size:11px;color:var(--red);font-weight:600;padding:3px 8px;border-radius:5px;background:var(--red-dim);cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .12s}
tr.sel-row td{background:var(--green-dim)!important;color:var(--green)!important;font-weight:600}
.del-btn:hover{background:#f9c6c6}
.rf-range{width:110px;accent-color:var(--green);cursor:pointer;display:block;margin-top:5px}

/* ==== ADMIN - USERS ==== */
.add-user-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.add-user-card h3{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:14px}
.user-form-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
.uf-group{display:flex;flex-direction:column;gap:5px}
.uf-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-faint)}
.uf-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:9px 12px;outline:none;font-family:'Inter',sans-serif;font-size:12.5px;width:100%}
.uf-input:focus{border-color:var(--green)}
.add-user-btn{padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:700;background:var(--green);color:#fff;cursor:pointer;border:none;white-space:nowrap;font-family:'Inter',sans-serif;transition:background .12s}
.add-user-btn:hover{background:#22855c}
.usr-role{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.usr-role.admin{background:#f0f4f1;color:var(--green)}
.usr-role.user{background:#edf0fd;color:#3b5bdb}
.chg-pwd-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-top:20px}
.chg-pwd-card h3{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:14px}
.chg-pwd-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}

/* ==== TOAST ==== */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#111f15;color:#fff;padding:11px 20px;border-radius:10px;font-size:12.5px;font-weight:500;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#toast.ok{background:var(--green)}
</style>
</head>

  <div class="lo-ball"></div>
  <div class="lo-text">Loading</div>
</div>

<div id="screen-setup" style="display:none"></div>

<div id="screen-login" style="display:none">
  <div class="login-wrap" style="max-width:420px">
    <div class="login-logo">
      <div class="login-ball">🏉</div>
      <h1>Rugby Analytics</h1>
      <p>Powered by Opta Superscout</p>
    </div>

        <h2>Sign In</h2>

      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
      <label>Password</label>
      <input type="password" id="login-pw" placeholder="Your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="lp-btn user" onclick="doLogin()">Sign In</button>
      <div class="lp-err" id="login-err"></div>

</div>

<div id="screen-app" style="display:none">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-ball">🏉</div>
      <div class="sb-wordmark"><h1>Rugby</h1><p>Analytics</p></div>
    </div>
    <div class="sb-user">
      <div class="sb-avatar" id="sb-avatar">?</div>
      <div class="sb-user-info">
        <div class="sb-user-name" id="sb-uname">—</div>
        <div class="sb-user-role" id="sb-urole">User</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav">
      <button class="nav-btn active" id="nav-overview" onclick="setTab('overview')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>

function updateRFZoneStats(){

  const avg=gc?(totalPenF/gc).toFixed(1):'—';
  const avgH=gc?(hPenF/gc).toFixed(1):'—';
  const avgA=gc?(aPenF/gc).toFixed(1):'—';

  if($('rf-stat-avga'))$('rf-stat-avga').textContent=avgA;
  const infTF={};
  locs.forEach(l=>{if(l.type)infTF[l.type]=(infTF[l.type]||0)+1;});
  const iKeys=[...INF_K,...Object.keys(infTF).filter(k=>!INF_K.includes(k))].filter(k=>infTF[k]).sort((a,b)=>(infTF[b]||0)-(infTF[a]||0));
  const iMax=Math.max(...iKeys.map(k=>infTF[k]||0),1);
  const infEl=$('rf-inf');
  if(infEl)infEl.innerHTML=iKeys.map(k=>`<div class="inf-row"><div class="inf-lbl">${INF_L[k]||'Code '+k}</div><div class="inf-track"><div class="inf-fill" style="width:${Math.round((infTF[k]/iMax)*100)}%;background:${INF_C[k]||'#aaa'}"></div></div><div class="inf-num">${infTF[k]}</div></div>`).join('')||'<div class="no-data">No data</div>';
  const badge=$('rf-zone-badge');
  if(badge)badge.style.display=pitchSelIsFull()?'none':'inline-block';
}

// ===== UTILITIES =====
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function dsort(d){if(!d)return 0;const p=d.split('/');return p.length===3?+p[2]*10000+ +p[1]*100+ +p[0]:0;}
function fdate(d){if(!d)return'—';const p=d.split('/');return p.length===3?`${p[0]}/${p[1]}/${p[2].slice(-2)}`:d;}
function ddmmToISO(d){if(!d)return'';const p=d.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:''}
function isoToDDMM(d){if(!d)return'';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'' }
function pts(s){return(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;}
function tours(){const m={};MATCHES.forEach(x=>{m[x.tour]=(m[x.tour]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([id,c])=>({id,c}));}
function teamsFor(tid){const m={};MATCHES.filter(x=>!tid||x.tour===tid).forEach(x=>{if(x.hid)m[x.hid]=x.hn||x.hid;if(x.aid)m[x.aid]=x.an||x.aid;});return Object.entries(m).filter(([id,n])=>id).sort((a,b)=>(a[1]||'').localeCompare(b[1]||'')).map(([id,n])=>({id,n}));}
function matchesFor(tid,tour){return MATCHES.filter(m=>(!tour||m.tour===tour)&&(m.hid===tid||m.aid===tid)).sort((a,b)=>dsort(a.date)-dsort(b.date)||+a.week- +b.week);}
function refs(){const m={};MATCHES.forEach(x=>{if(!m[x.rid])m[x.rid]={id:x.rid,n:x.rn,ms:[]};m[x.rid].ms.push(x);});return Object.values(m).sort((a,b)=>b.ms.length-a.ms.length);}
function matchDocId(m){return`${m.tour}_${m.hid}_${m.aid}_${(m.date||'').replace(/\//g,'')}`;}

function getFilteredMatches(){
  const f=GLOBAL_FILTERS;let ms=[...MATCHES];
  if(f.tours&&f.tours.length)ms=ms.filter(m=>f.tours.some(t=>String(t)===String(m.tour)));
  if(f.teams&&f.teams.length)ms=ms.filter(m=>f.teams.includes(m.hid)||f.teams.includes(m.aid));
  if(f.homeTeam)ms=ms.filter(m=>m.hid===f.homeTeam);
  if(f.awayTeam)ms=ms.filter(m=>m.aid===f.awayTeam);
  if(f.ref)ms=ms.filter(m=>m.rid===f.ref);
  if(f.dateFrom){const d=ddmmToISO(f.dateFrom);ms=ms.filter(m=>ddmmToISO(m.date)>=d);}
  if(f.dateTo){const d=ddmmToISO(f.dateTo);ms=ms.filter(m=>ddmmToISO(m.date)<=d);}
  return ms;
}
function msToggle(id){
  const panel=document.getElementById('ms-panel-'+id);
  if(!panel)return;
  const isOpen=panel.style.display!=='none';
  document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none');
  GF_MS_OPEN=null;
  if(!isOpen){panel.style.display='block';GF_MS_OPEN=id;const inp=panel.querySelector('.ms-search-inp');if(inp)inp.focus();}
}
function msFilter(id,q){
  const lcq=q.toLowerCase();
  let any=false;
  document.querySelectorAll('#ms-opts-'+id+' .ms-opt').forEach(opt=>{
    const hidden=!opt.textContent.trim().toLowerCase().includes(lcq);
    opt.classList.toggle('ms-hid',hidden);
    if(!hidden)any=true;
  });
  const nm=document.getElementById('ms-none-'+id);
  if(nm)nm.style.display=any?'none':'block';
}
function gfToggleTour(id,checked){
  const arr=GLOBAL_FILTERS.tours;
  const idx=arr.indexOf(String(id));
  if(checked&&idx===-1)arr.push(String(id));
  else if(!checked&&idx>-1)arr.splice(idx,1);
  const lbl=document.getElementById('ms-lbl-tours');
  if(lbl)lbl.textContent=arr.length?arr.length+' selected':'All Tournaments';
  const btn=document.getElementById('ms-btn-tours');
  if(btn)btn.className='ms-btn'+(arr.length?' has-sel':'');
  const foot=document.getElementById('ms-foot-tours');
  if(foot)foot.style.display=arr.length?'':'none';
  renderCurrentTabOnly();
}

function gfSetRefInput(val){
  // datalist options are "Name|id" — find matching ref
  const allR=refs();
  const match=allR.find(r=>r.n===val)||allR.find(r=>(r.n+'|'+r.id)===val);
  if(match){GLOBAL_FILTERS.ref=match.id;}else if(!val){GLOBAL_FILTERS.ref='';}
  else{return;} // partial input — wait for full match
  renderCurrentTabOnly();
}
function renderCurrentTabOnly(){

function renderGlobalFilters(){
  const el=document.getElementById('gfbar');if(!el)return;
  if(!MATCHES.length){el.style.display='none';return;}
  el.style.display='flex';
  const f=GLOBAL_FILTERS;
  const _TOUR_PIN={'AIL 1A':0,'AIL 1B':1,'AIL 2A':2,'URC':3};
  const allTours=tours().map(t=>({id:t.id,c:t.c,n:TID_NAMES[+t.id]||t.tourN||String(t.id)})).sort((a,b)=>{
    const pa=_TOUR_PIN[a.n]??99,pb=_TOUR_PIN[b.n]??99;
    return pa!==pb?pa-pb:a.n.localeCompare(b.n);
  });
  const allTeams=Object.values(MATCHES.reduce((m,x)=>{if(x.hid)m[x.hid]={id:x.hid,n:x.hn||x.hid};if(x.aid)m[x.aid]={id:x.aid,n:x.an||x.aid};return m;},{})).filter(t=>t.id).sort((a,b)=>(a.n||'').localeCompare(b.n||''));
  const allRefs=refs().sort((a,b)=>a.n.localeCompare(b.n));
  const hasFilter=(f.tours&&f.tours.length)||(f.teams&&f.teams.length)||f.homeTeam||f.awayTeam||f.ref||f.dateFrom||f.dateTo;
  function mkMS(msId,items,selected,toggleFn,clearFn,placeholder){
    const btnTxt=selected.length?`${selected.length} selected`:placeholder;
    const opts=items.map(item=>{
      const idStr=String(item.id);
      const chk=selected.includes(idStr)||selected.includes(item.id)?'checked':'';
      return `<label class="ms-opt"><input type="checkbox" value="${idStr}" ${chk} onclick="event.stopPropagation();${toggleFn}('${idStr.replace(/'/g,"\\'")}',this.checked)">&nbsp;${item.n}</label>`;
    }).join('');
    return `<div class="ms-wrap" id="ms-${msId}"><button type="button" class="ms-btn${selected.length?' has-sel':''}" id="ms-btn-${msId}" onclick="event.stopPropagation();msToggle('${msId}')"><span id="ms-lbl-${msId}">${btnTxt}</span><span style="font-size:9px;opacity:.5;margin-left:4px">▾</span></button><div class="ms-panel" id="ms-panel-${msId}" style="display:none"><input class="ms-search-inp" placeholder="Search…" oninput="msFilter('${msId}',this.value)" onclick="event.stopPropagation()"><div class="ms-opts" id="ms-opts-${msId}">${opts||'<div class="ms-no-match">No options</div>'}</div><div id="ms-none-${msId}" class="ms-no-match" style="display:none">No matches</div><div class="ms-foot" id="ms-foot-${msId}" style="${selected.length?'':'display:none'}"><button class="ms-clear-btn" onclick="event.stopPropagation();${clearFn}()">✕ Clear all</button></div></div></div>`;
  }
  const refName=f.ref?(allRefs.find(r=>r.id===f.ref)?.n||''):'';
  const refDlOpts=allRefs.map(r=>`<option value="${r.n}">`).join('');
  el.innerHTML=`
    <div class="ctrl-group"><div class="ctrl-lbl" style="font-size:9px">Tournaments</div>${mkMS('tours',allTours,f.tours||[],'gfToggleTour','gfClearTours','All Tournaments')}</div>
    <div class="ctrl-group"><div class="ctrl-lbl" style="font-size:9px">Teams</div>${mkMS('teams',allTeams,f.teams||[],'gfToggleTeam','gfClearTeams','Any Team')}</div>
    <div class="ctrl-group"><div class="ctrl-lbl" style="font-size:9px">Referee</div>
      <div style="position:relative">
        <input class="flt-date" id="gf-ref-inp" list="gf-ref-dl" placeholder="Any referee…" value="${refName}" autocomplete="off" style="min-width:130px"

async function doLogin(){

  err.textContent='';
  if(!email||!pw){err.textContent='Enter your email and password';return;}

  }catch(e){
    if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){

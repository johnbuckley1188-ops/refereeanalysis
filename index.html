// ===== DATA LOADING =====
function fixTurnovers(m){
  const st=m&&m.stats;if(!st||!m.hid||!m.aid)return m;
  const h=st[m.hid],a=st[m.aid];if(!h||!a||h.toV===2)return m;
  const hl=h.to||0,al=a.to||0;
  h.toL=hl;a.toL=al;h.to=al;a.to=hl;h.toV=2;a.toV=2;
  return m;
}
async function loadMatches(){
  try{
    const snap=await FIRESTORE.collection('matches').get();
    const docs=snap&&snap.docs?snap.docs:(Array.isArray(snap)?snap:[]);
    MATCHES=docs.map(d=>typeof d.data==='function'?d.data():d).filter(Boolean).map(fixTurnovers);
  }catch(e){MATCHES=[];}
}
async function saveMatchToDB(m){
  const id=matchDocId(m);
  const doc={id,fname:m.fname||'',date:m.date||'',week:m.week||'',tour:m.tour||'',tourN:m.tourN||'',
    hid:m.hid||'',hn:m.hn||'',aid:m.aid||'',an:m.an||'',hs:m.hs||0,as:m.as||0,
    rid:m.rid||'',rn:m.rn||'',stats:m.stats||{},players:m.players||{}};
  await FIRESTORE.doc(`matches/${id}`).set(doc);
  return id;
}
async function deleteMatchFromDB(id){
  await FIRESTORE.doc(`matches/${id}`).delete();
  MATCHES=MATCHES.filter(m=>matchDocId(m)!==id);
}

// ===== XML PARSING =====
function parseXML(text,fname){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const out=[];
  doc.querySelectorAll('FXID').forEach(fxid=>{
    const fd=fxid.querySelector('FixData Data');
    if(!fd)return;
    const m={fname,date:fd.getAttribute('FxDate')||'',week:fd.getAttribute('FxWeek')||'',
      tour:fd.getAttribute('FxTID')||'',tourN:TID_NAMES[+(fd.getAttribute('FxTID')||0)]||fd.getAttribute('FxTID')||'Unknown',
      hid:fd.getAttribute('FxHTID')||'',aid:fd.getAttribute('FxATID')||'',
      hn:fd.getAttribute('hometeam')||'Home',an:fd.getAttribute('awayteam')||'Away',
      hs:+fd.getAttribute('HTFTSC')||0,as:+fd.getAttribute('ATFTSC')||0,
      rid:fd.getAttribute('REFID')||'',rn:fd.getAttribute('REFNAME')||'Unknown',rows:[]};
    fxid.querySelectorAll('ActionRow').forEach(r=>{
      m.rows.push({pl:r.getAttribute('PLID')||'',q5:r.getAttribute('qualifier5')||'',tid:r.getAttribute('team_id')||'',x:+r.getAttribute('x_coord')||0,y:+r.getAttribute('y_coord')||0,
        a:r.getAttribute('action')||'',at:r.getAttribute('ActionType')||'',ar:r.getAttribute('Actionresult')||'',
        q3:r.getAttribute('qualifier3')||'',q4:r.getAttribute('qualifier4')||'',sid:r.getAttribute('sequence_id')||'',
        mt:+r.getAttribute('MatchTime')||0,period:+r.getAttribute('period')||1});
    });
    m.rowCount=m.rows.length;
    const roster={};
    fxid.querySelectorAll('TeamData Player').forEach(p=>{roster[p.getAttribute('PLID')]={n:`${p.getAttribute('PLFORN')||''} ${p.getAttribute('PLSURN')||''}`.trim(),tid:p.getAttribute('Club')||''};});
    m.stats=calcStats(m);
    m.players=calcPlayers(m,roster);
    delete m.rows;
    out.push(m);
  });
  return out;
}
// Correct Opta action codes (from ChangesFile.xlsx lookup):
// 7=Penalty Conceded, 8=Turnover, 9=Try, 11=Goal Kick, 21=Card
// 6=Lineout Throw, 27=Lineout Take, 28=Offensive Scrum, 29=Defensive Scrum
// 40=Defensive Actions; qualifier4: 233=Full Penalty, 235=Free Kick
// Actionresult: 353=Won Outright, 357=Won Penalty, 376=Won Clean, 378=Won Penalty
// ActionType: 246=Yellow, 247=Red, 295=Conversion, 296=Drop Goal, 297=Penalty Goal, 299=Goal Kicked
function calcStats(m){
  const s={};
  [m.hid,m.aid].forEach(tid=>{s[tid]={pen:0,penW:0,fkC:0,fkW:0,inf:{},fkInf:{},locs:[],timeline:[],fkTimeline:[],cards:[],tries:0,conv:0,penG:0,dg:0,yel:0,red:0,loW:0,loT:0,scrum:0,scrumW:0,scrumT:0,to:0,toL:0,toV:2,jackal:0,jackalFail:0,jackalAtt:0,counterRuck:0,noInt:0,defRucks:0,defArr:0,_sq:{}};});
  m.rows.forEach(r=>{
    const t=s[r.tid];if(!t)return;
    // Dedup events that repeat per-player within the same incident.
    // Key includes qualifier4 so a blank-qualifier row doesn't block the real penalty row.
    // Falls back to MatchTime+location when sequence_id is absent.
    if(['7','8','28','29','40'].includes(r.a)){
      // Action 7 (penalty/FK) keeps q4 in key so blank-qualifier rows don't block the real penalty.
      // Other actions (turnovers, scrums, counter rucks, jackals) omit q4 to avoid over-counting
      // when multiple player rows share the same sequence_id but have different qualifier4 values.
      const key=r.a==='7'
        ?(r.sid?(r.a+'_'+r.q4+'_'+r.sid):(r.a+'_'+r.q4+'_'+r.mt+'_'+Math.round(r.x)+'_'+Math.round(r.y)))
        :(r.sid?(r.a+'_'+r.sid):(r.a+'_'+r.mt+'_'+Math.round(r.x)+'_'+Math.round(r.y)));
      if(t._sq[key])return;t._sq[key]=1;
    }
    // Penalty Conceded: action=7, qualifier4=233 (Full Penalty)
    if(r.a==='7'&&r.q4==='233'){
      const _mt=r.mt||0;const absMins=Math.round(Math.floor(_mt/100)+(_mt%100)/60);
      t.pen++;
      t.timeline.push({mins:absMins,type:r.at,period:r.period||1});
      const k=r.at;t.inf[k]=(t.inf[k]||0)+1;
      if(r.x>0&&r.x<=100&&r.y>=0&&r.y<=68)t.locs.push({x:r.x,y:r.y,type:r.at,mins:absMins,period:r.period||1});
      // Credit penW to the opposing team
      const oppId=r.tid===m.hid?m.aid:m.hid;
      if(s[oppId])s[oppId].penW++;
    }
    // Free Kick Conceded: action=7, qualifier4=235
    if(r.a==='7'&&r.q4==='235'){
      t.fkC++;
      const _mt=r.mt||0;const absMins=Math.round(Math.floor(_mt/100)+(_mt%100)/60);
      if(r.at)t.fkInf[r.at]=(t.fkInf[r.at]||0)+1;
      t.fkTimeline.push({mins:absMins,type:r.at,period:r.period||1});
      const oppId=r.tid===m.hid?m.aid:m.hid;if(s[oppId])s[oppId].fkW++;
    }
    // Try: action=9 (one row per try, no dedup needed)
    if(r.a==='9'){t.tries++;}
    // Goal Kick: action=11 — ActionType 295=Conv, 296=DropGoal, 297=PenGoal; Actionresult 299=Kicked
    if(r.a==='11'){
      if(r.at==='295'&&r.ar==='299')t.conv++;
      if(r.at==='297'&&r.ar==='299')t.penG++;
      if(r.at==='296'&&r.ar==='299')t.dg++;
    }
    // Cards: action=21, ActionType 246=Yellow, 247=Red
    if(r.a==='21'){
      const _mt=r.mt||0;const absMins=Math.round(Math.floor(_mt/100)+(_mt%100)/60);
      if(r.at==='246'){t.yel++;t.cards.push({mins:absMins,cardType:'yellow',period:r.period||1});}
      else if(r.at==='247'){t.red++;t.cards.push({mins:absMins,cardType:'red',period:r.period||1});}
    }
    // Lineout Throw: action=6 (one row per lineout); ar 376=Won Clean, 378=Won Penalty
    if(r.a==='6'){t.loT++;if(r.ar==='376'||r.ar==='378')t.loW++;}
    // Offensive Scrum: action=28 (deduped); ar 353=Won Outright, 357=Won Penalty
    if(r.a==='28'){t.scrumT++;t.scrum++;if(r.ar==='353'||r.ar==='357')t.scrumW++;}
    // Turnovers: action=8 (deduped). Opta codes it to the team that LOST the ball
    // → toL = turnovers lost for this team, to = turnovers won for the opposition
    if(r.a==='8'){t.toL++;const oppId=r.tid===m.hid?m.aid:m.hid;if(s[oppId])s[oppId].to++;}
    // Ruck: action=23, team_id = team in possession → a defensive ruck for the other team
    if(r.a==='23'){const oppId=r.tid===m.hid?m.aid:m.hid;if(s[oppId])s[oppId].defRucks++;}
    // Defensive ruck arrival: action=43 (Ruck OOA), qualifier4=633 (Defensive OOA)
    // back-end pressure in qualifier5: 801 Jackal Attempt, 802 Counter Ruck Attempt, 803 Other/No Intention
    if(r.a==='43'&&r.q4==='633'){t.defArr++;if(r.q5==='801')t.jackalAtt++;else if(r.q5==='802')t.counterRuck++;else if(r.q5==='803')t.noInt++;}
    // Jackal: action=18 (Collection), ActionType=276; Actionresult 277=Success, 278=Fail
    if(r.a==='18'&&r.at==='276'){if(r.ar==='277')t.jackal++;else if(r.ar==='278')t.jackalFail++;}
  });
  [m.hid,m.aid].forEach(tid=>{if(s[tid])delete s[tid]._sq;});
  return s;
}


// ===================== DEFENSIVE RUCKS / BREAKDOWN =====================
// Opta codes (ChangesFile): action 23 = Ruck (team_id = attacking team)
// action 43 = Ruck OOA; qualifier4 633 = Defensive OOA (a defender arriving at the ruck)
//   qualifier5 = back-end pressure: 801 Jackal Attempt, 802 Counter Ruck Attempt, 803 Other/No Intention
// action 18 ActionType 276 = Jackal; Actionresult 277 = Success (jackal won), 278 = Fail
function calcPlayers(m,roster){
  const P={};
  const get=(plid,tid)=>{
    if(!P[plid]){const ro=roster[plid]||{};P[plid]={n:ro.n||('Player '+plid),tid:ro.tid||tid,arr:0,b1:0,b2:0,b3:0,j:0,jf:0};}
    return P[plid];
  };
  m.rows.forEach(r=>{
    if(!r.pl||r.pl==='0')return;
    if(r.a==='43'&&r.q4==='633'){
      const p=get(r.pl,r.tid);p.arr++;
      if(r.q5==='801')p.b1++;else if(r.q5==='802')p.b2++;else if(r.q5==='803')p.b3++;
    }
    if(r.a==='18'&&r.at==='276'){const p=get(r.pl,r.tid);if(r.ar==='277')p.j++;else if(r.ar==='278')p.jf++;}
  });
  return P;
}
let BD_VIEW='team',BD_SORT={team:'-jPer',player:'-jPer'},BD_MIN_RUCKS=5,BD_SEARCH='';
const BD_TEAM_COLS=[
  {k:'games',l:'Games',fmt:'n'},
  {k:'defRucks',l:'Def Rucks',fmt:'n',tip:'Rucks the opposition had (rucks this team defended)'},
  {k:'jackal',l:'Jackals',fmt:'n',tip:'Jackals won (Opta Jackal – Success)'},
  {k:'jackalAtt',l:'Jackal Att',fmt:'n',grp:'bep',tip:'Back-end pressure: Jackal Attempt'},
  {k:'counterRuck',l:'Counter Ruck Att',fmt:'n',grp:'bep',tip:'Back-end pressure: Counter Ruck Attempt'},
  {k:'noInt',l:'No Intention',fmt:'n',grp:'bep',tip:'Back-end pressure: Other / No Intention'},
  {k:'jaPer',l:'Jackal Att every',fmt:'every',tip:'One jackal attempt every X defensive rucks (lower = more often)'},
  {k:'jPer',l:'Jackal every',fmt:'every',tip:'One jackal won every X defensive rucks (lower = more often)'},
];
const BD_PLAYER_COLS=[
  {k:'games',l:'Games',fmt:'n'},
  {k:'arr',l:'Rucks Attended',fmt:'n',tip:'Defensive rucks the player arrived at (Opta Defensive OOA)'},
  {k:'j',l:'Jackals',fmt:'n',tip:'Jackals won'},
  {k:'b1',l:'Jackal Att',fmt:'n',grp:'bep',tip:'Back-end pressure: Jackal Attempt'},
  {k:'b2',l:'Counter Ruck Att',fmt:'n',grp:'bep',tip:'Back-end pressure: Counter Ruck Attempt'},
  {k:'b3',l:'No Intention',fmt:'n',grp:'bep',tip:'Back-end pressure: Other / No Intention'},
  {k:'jaPer',l:'Jackal Att every',fmt:'every',tip:'One jackal attempt every X rucks attended (lower = more often)'},
  {k:'jPer',l:'Jackal every',fmt:'every',tip:'One jackal won every X rucks attended (lower = more often)'},
];
function bdBaseMatches(){
  // like Rankings: competition / referee / date filters apply; team filter highlights instead of hiding
  const f=GLOBAL_FILTERS;let ms=[...MATCHES];
  if(f.tours&&f.tours.length)ms=ms.filter(m=>f.tours.some(t=>String(t)===String(m.tour)));
  if(f.homeTeam)ms=ms.filter(m=>m.hid===f.homeTeam);
  if(f.awayTeam)ms=ms.filter(m=>m.aid===f.awayTeam);
  if(f.ref)ms=ms.filter(m=>m.rid===f.ref);
  if(f.dateFrom){const d=ddmmToISO(f.dateFrom);ms=ms.filter(m=>ddmmToISO(m.date)>=d);}
  if(f.dateTo){const d=ddmmToISO(f.dateTo);ms=ms.filter(m=>ddmmToISO(m.date)<=d);}
  return ms;
}
function bdSort(view,k){
  // "every X rucks" columns: lower is better, so first click sorts ascending
  const every=k==='jPer'||k==='jaPer',first=every?'-'+k:k,second=every?k:'-'+k;
  BD_SORT[view]=BD_SORT[view]===first?second:first;
  renderBreakdown();
}
function bdTable(rows,cols,view,nameCol,focusIds){
  const sk=BD_SORT[view],asc=sk.startsWith('-'),key=sk.replace(/^-/,'');
  // rates with no events (Infinity) always sit at the bottom
  const v=x=>x===Infinity?(asc?1e12:-1e12):x;
  rows.sort((a,b)=>(asc?(v(a[key])-v(b[key])):(v(b[key])-v(a[key])))||(b.defRucks||b.arr||0)-(a.defRucks||a.arr||0));
  const max={},min={};cols.forEach(c=>{const vals=rows.map(r=>r[c.k]).filter(x=>isFinite(x)&&x>0);max[c.k]=Math.max(...vals,0)||1;min[c.k]=vals.length?Math.min(...vals):1;});
  const val=(r,c)=>c.fmt==='every'?(isFinite(r[c.k])?`1 in ${r[c.k].toFixed(1)}`:'—'):(r[c.k]||0);
  const hdr=`<tr><th class="bd-rk">#</th>${nameCol.map(n=>`<th class="bd-name">${n}</th>`).join('')}${cols.map(c=>`<th class="bd-num${c.grp?' bd-bep':''}${key===c.k?' bd-on':''}" title="${c.tip||''}" onclick="bdSort('${view}','${c.k}')">${c.l}${key===c.k?(asc?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
  const grp=`<tr class="bd-grp"><th></th>${nameCol.map(()=>'<th></th>').join('')}${cols.map((c,i)=>c.grp?(i===0||!cols[i-1].grp?`<th colspan="${cols.filter(x=>x.grp).length}" class="bd-bep-h">Back-end pressure</th>`:''):'<th></th>').join('')}</tr>`;
  const body=rows.map((r,i)=>{
    const hl=focusIds&&focusIds.includes(r.tid||r.id);
    const rk=i+1,rc=rk===1?'rank-1':rk===2?'rank-2':rk===3?'rank-3':'';
    return`<tr class="${hl?'bd-hl':''}${rk===10?' bd-10':''}"><td class="bd-rk"><span class="rank-badge ${rc}">${rk}</span></td>
      ${r.cells.map(c=>`<td class="bd-name">${c}</td>`).join('')}
      ${cols.map(c=>{const pct=c.fmt==='every'?(isFinite(r[c.k])?Math.round(min[c.k]/r[c.k]*100):0):Math.round(((r[c.k]||0)/max[c.k])*100);
        return`<td class="bd-num${c.grp?' bd-bep':''}${key===c.k?' bd-on':''}">${c.fmt==='every'?`<div class="bd-rate"><span>${val(r,c)}</span><i style="width:${pct}%"></i></div>`:val(r,c)}</td>`;}).join('')}</tr>`;
  }).join('');
  return`<div class="bd-wrap" data-view="${view}"><table class="bd-table"><thead>${grp}${hdr}</thead><tbody>${body||`<tr><td colspan="${cols.length+1+nameCol.length}" class="no-data">No data</td></tr>`}</tbody></table></div>`;
}
function renderBreakdown(){
  const el=document.getElementById('bd');if(!el)return;
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">🏉</div><h2>No data yet</h2><p>Upload XML files to see breakdown data.</p></div>`;return;}
  const ms=bdBaseMatches();
  const withBd=ms.filter(m=>Object.values(m.stats||{}).some(s=>s&&s.defRucks!==undefined));
  const focus=(GLOBAL_FILTERS.teams||[]);
  let content='';
  if(BD_VIEW==='team'){
    const T={};
    withBd.forEach(m=>[m.hid,m.aid].forEach(tid=>{
      const s=(m.stats||{})[tid]||{};
      const t=T[tid]=T[tid]||{id:tid,n:tid===m.hid?m.hn:m.an,games:0,defRucks:0,jackal:0,jackalAtt:0,counterRuck:0,noInt:0};
      t.games++;t.defRucks+=s.defRucks||0;t.jackal+=s.jackal||0;t.jackalAtt+=s.jackalAtt||0;t.counterRuck+=s.counterRuck||0;t.noInt+=s.noInt||0;
    }));
    const rows=Object.values(T).map(t=>({...t,jaPer:t.jackalAtt?t.defRucks/t.jackalAtt:Infinity,jPer:t.jackal?t.defRucks/t.jackal:Infinity,cells:[irfuEsc(t.n)]}));
    content=bdTable(rows,BD_TEAM_COLS,'team',['Team'],focus);
  }else{
    const P={};
    withBd.forEach(m=>Object.entries(m.players||{}).forEach(([id,p])=>{
      const x=P[id]=P[id]||{id,n:p.n,tid:p.tid,tn:'',games:0,arr:0,b1:0,b2:0,b3:0,j:0,jf:0};
      x.games++;['arr','b1','b2','b3','j','jf'].forEach(k=>x[k]+=p[k]||0);
      x.tid=p.tid;x.tn=p.tid===m.hid?m.hn:p.tid===m.aid?m.an:x.tn;
    }));
    const q=BD_SEARCH.toLowerCase().trim();
    let rows=Object.values(P).filter(p=>p.arr>=BD_MIN_RUCKS||(q&&p.n.toLowerCase().includes(q)));
    if(focus.length)rows=rows.filter(p=>focus.includes(p.tid));
    if(q)rows=rows.filter(p=>p.n.toLowerCase().includes(q)||(p.tn||'').toLowerCase().includes(q));
    rows=rows.map(p=>({...p,jaPer:p.b1?p.arr/p.b1:Infinity,jPer:p.j?p.arr/p.j:Infinity,cells:[irfuEsc(p.n),`<span class="bd-team">${irfuEsc(p.tn||'')}</span>`]}));
    content=bdTable(rows,BD_PLAYER_COLS,'player',['Player','Team'],null);
  }
  const missing=ms.length-withBd.length;
  const btn=(v,l)=>`<button onclick="BD_VIEW='${v}';renderBreakdown()" class="bd-tbtn${BD_VIEW===v?' on':''}">${l}</button>`;

function setTab(t){
  TAB=t;

    const p=document.getElementById('panel-'+x);

  if(gf){if(showGF.includes(t)&&MATCHES.length){gf.style.display='flex';renderGlobalFilters();}else{gf.style.display='none';}}

function renderOV(){
  const el=document.getElementById('ov');
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">🏉</div><h2>No data yet</h2><p>${SESSION?.type==='admin'?'Go to the Data tab to upload Opta XML files.':'No match data has been loaded yet.'}</p></div>`;return;}
  const base=getFilteredMatches();
  const tourMap=new Map(),refMap=new Map(),teamMap=new Map();
  base.forEach(m=>{tourMap.set(m.tour,m.tourN||m.tour);refMap.set(m.rid,m.rn);if(m.hid)teamMap.set(m.hid,m.hn||m.hid);if(m.aid)teamMap.set(m.aid,m.an||m.aid);});
  const tourOpts=[...tourMap.entries()].sort((a,b)=>(a[1]||'').localeCompare(b[1]||''));
  const refOpts=[...refMap.entries()].sort((a,b)=>(a[1]||'').localeCompare(b[1]||''));
  const teamOpts=[...teamMap.entries()].filter(([id])=>id).sort((a,b)=>(a[1]||'').localeCompare(b[1]||''));
  const f=OV_FILTERS;
  let filtered=base.slice();
  if(f.cardsOnly)filtered=filtered.filter(m=>{const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};return(hs.yel||0)+(hs.red||0)+(as2.yel||0)+(as2.red||0)>0;});
  if(f.redCardsOnly)filtered=filtered.filter(m=>{const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};return(hs.red||0)+(as2.red||0)>0;});
  const groups=new Map();
  filtered.forEach(m=>{if(!groups.has(m.tour))groups.set(m.tour,{id:m.tour,name:TID_NAMES[+m.tour]||m.tourN||m.tour,ms:[]});groups.get(m.tour).ms.push(m);});
  [...groups.values()].forEach(g=>g.ms.sort((a,b)=>dsort(a.date)-dsort(b.date)||+a.week- +b.week));
  const _OV_PIN={'AIL 1A':0,'AIL 1B':1,'AIL 2A':2,'URC':3};
  const sortedGroups=[...groups.values()].sort((a,b)=>{const pa=_OV_PIN[a.name]??99,pb=_OV_PIN[b.name]??99;return pa!==pb?pa-pb:a.name.localeCompare(b.name);});
  const filteredTeams=new Set();filtered.forEach(m=>{filteredTeams.add(m.hid);filteredTeams.add(m.aid);});
  el.innerHTML=`
    <div class="page-hdr" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><h2>Match Overview</h2><p>${filtered.length} match${filtered.length!==1?'es':''} · ${groups.size} division${groups.size!==1?'s':''}</p></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <select class="flt-sel" style="font-size:12px" onchange="OV_FILTERS.sort=this.value;renderOV()">
          <option value="date"${f.sort==='date'?' selected':''}>Date (newest first)</option>
          <option value="pens"${f.sort==='pens'?' selected':''}>Most Pens (combined)</option>
          <option value="hpens"${f.sort==='hpens'?' selected':''}>Most H Pens</option>
          <option value="apens"${f.sort==='apens'?' selected':''}>Most A Pens</option>
        </select>
        <button class="flt-toggle${f.cardsOnly?' flt-on':''}" onclick="OV_FILTERS.cardsOnly=!OV_FILTERS.cardsOnly;if(OV_FILTERS.cardsOnly)OV_FILTERS.redCardsOnly=false;renderOV()">🟨 Cards Only</button>
        <button class="flt-toggle${f.redCardsOnly?' flt-on':''}" onclick="OV_FILTERS.redCardsOnly=!OV_FILTERS.redCardsOnly;if(OV_FILTERS.redCardsOnly)OV_FILTERS.cardsOnly=false;renderOV()">🟥 Red Cards Only</button>
      </div>
    </div>
    <div class="stat-pills">
      <div class="stat-pill"><div class="sp-val">${filtered.length}</div><div class="sp-lbl">Matches</div></div>
      <div class="stat-pill"><div class="sp-val">${filteredTeams.size}</div><div class="sp-lbl">Teams</div></div>
      <div class="stat-pill"><div class="sp-val">${groups.size}</div><div class="sp-lbl">Divisions</div></div>
      <div class="stat-pill"><div class="sp-val">${new Set(filtered.map(m=>m.rid)).size}</div><div class="sp-lbl">Referees</div></div>
    </div>
    ${filtered.length===0?'<div class="no-data" style="padding:48px 0">No matches match the current filters.</div>':sortedGroups.map((g,i)=>ovSection(g,f.team,i)).join('')}`;
}
function ovSection(g,focusTeam,idx){
  const secId='ov-sec-'+idx;
  const sortMode=OV_FILTERS.sort||'date';
  let sorted=[...g.ms];
  if(sortMode==='pens')sorted.sort((a,b)=>{
    const aT=(a.stats[a.hid]?.pen||0)+(a.stats[a.aid]?.pen||0);
    const bT=(b.stats[b.hid]?.pen||0)+(b.stats[b.aid]?.pen||0);
    return bT-aT;
  });
  else if(sortMode==='hpens')sorted.sort((a,b)=>(b.stats[b.hid]?.pen||0)-(a.stats[a.hid]?.pen||0));
  else if(sortMode==='apens')sorted.sort((a,b)=>(b.stats[b.aid]?.pen||0)-(a.stats[a.aid]?.pen||0));
  else sorted.sort((a,b)=>dsort(b.date)-dsort(a.date));
  const rows=sorted.map(m=>{
    const hw=m.hs>m.as,aw=m.as>m.hs;
    const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};
    const dimH=focusTeam&&m.hid!==focusTeam,dimA=focusTeam&&m.aid!==focusTeam;
    const hYC=hs.yel||0,hRC=hs.red||0,aYC=as2.yel||0,aRC=as2.red||0;
    const hCardR=[...Array(hYC)].map(()=>'<span class="cr-y"></span>').join('')+[...Array(hRC)].map(()=>'<span class="cr-r"></span>').join('');
    const aCardR=[...Array(aYC)].map(()=>'<span class="cr-y"></span>').join('')+[...Array(aRC)].map(()=>'<span class="cr-r"></span>').join('');
    return `<tr>
      <td style="color:var(--txt-dim);white-space:nowrap;width:82px">${fdate(m.date)}</td>
      <td style="width:72px"><span class="week-pill">Wk ${m.week}</span></td>
      <td class="${hw?'tw':'tl'}" style="${dimH?'opacity:.45':''}">
        ${m.hid===focusTeam?'<span class="ha-h">H</span> ':''}<span>${m.hn}</span>
      </td>
      <td class="score-cell" style="white-space:nowrap;width:72px">${m.hs} – ${m.as}</td>
      <td class="${aw?'tw':'tl'}" style="${dimA?'opacity:.45':''}">
        ${m.aid===focusTeam?'<span class="ha-a">A</span> ':''}<span>${m.an}</span>
      </td>
      <td style="width:94px"><div class="card-cell"><span class="ha-h" style="min-width:22px;text-align:center;display:inline-block">${hs.pen||0}</span>${hCardR}</div></td>
      <td style="width:94px"><div class="card-cell"><span class="ha-a" style="min-width:22px;text-align:center;display:inline-block">${as2.pen||0}</span>${aCardR}</div></td>
      <td style="width:160px"><span class="ref-pill">${m.rn}</span></td>
    </tr>`;
  }).join('');
  return `<div class="ov-section">
    <div class="ov-section-hdr">
      <span class="ov-section-name">${g.name}</span>
      <span class="ov-section-ct">${g.ms.length} match${g.ms.length!==1?'es':''}</span>
      <button class="ov-section-toggle" onclick="ovToggle('${secId}',this)">Hide</button>
    </div>
    <div id="${secId}"><div class="table-wrap" style="max-height:360px;overflow-y:auto">
      <table style="table-layout:fixed;width:100%"><thead><tr>
        <th style="width:82px">Date</th><th style="width:72px">Wk</th><th>Home</th>
        <th style="width:72px;text-align:center">Score</th><th>Away</th>
        <th style="width:94px">H Pen / Cards</th><th style="width:94px">A Pen / Cards</th>
        <th style="width:160px">Referee</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div></div>`;
}

  const b=document.getElementById(id);if(!b)return;
  const h=b.style.display==='none';b.style.display=h?'':'none';btn.textContent=h?'Hide':'Show';
}

let IRFU_STATE=null,IRFU_PROFILES=null,IRFU_DRAG=null,IRFU_DID_DRAG=false,IRFU_PROFILE_NAME=null;
let IRFU_SHARED_NOTES=null,IRFU_FILTER_HAS_NOTES=false,IRFU_PROFILE_TAB='mine',IRFU_FILTER='all',IRFU_SAVE_T=null;
async function irfuLoad(){
  if(IRFU_STATE)return;
  // Load shared board (one board for all editors/admins)
  try{
    const boardSnap=await FIRESTORE.doc('irfu_data/shared_board').get();
    if(boardSnap.exists) IRFU_STATE=boardSnap.data().state||null;
  }catch(e){}
  // Load per-user private profiles (and migrate old combined format)
  try{
    const userSnap=await FIRESTORE.doc(`irfu_data/${SESSION.uid}`).get();
    if(userSnap.exists){
      const d=userSnap.data();
      IRFU_PROFILES=d.profiles||{};
      // Migrate: if shared board not yet created, seed it from this user's old state
      if(!IRFU_STATE&&d.state) IRFU_STATE=d.state;
    }
  }catch(e){}
  // Fallback to localStorage
  if(!IRFU_STATE){
    try{const s=localStorage.getItem('irfu_v2');if(s)IRFU_STATE=JSON.parse(s);}catch(e){}
  }
  if(!IRFU_STATE)IRFU_STATE=JSON.parse(JSON.stringify(IRFU_DEFAULT));
  // Migration: if state uses old category IDs (elite/dev) reset to 2026-27 defaults
  if(IRFU_STATE&&(IRFU_STATE.elite!==undefined||IRFU_STATE.dev!==undefined||!IRFU_STATE.hp)){
    IRFU_STATE=JSON.parse(JSON.stringify(IRFU_DEFAULT));
  }
  if(!Array.isArray(IRFU_STATE.tmo)){
    // Added Oct 2026: TMO row at the bottom of the board
    const lc=n=>n.toLowerCase().trim(),tm=IRFU_DEFAULT.tmo.map(lc);
    IRFU_STATE.tmo=[...IRFU_DEFAULT.tmo];
    if(Array.isArray(IRFU_STATE.pool))IRFU_STATE.pool=IRFU_STATE.pool.filter(n=>!tm.includes(lc(n)));
    // a name typed in at a matrix import (e.g. "Sean Colgan") is swapped for the real TMO
    if(IRFU_STATE.matrixAliases)Object.keys(IRFU_STATE.matrixAliases).forEach(k=>{const v=IRFU_STATE.matrixAliases[k];
      if(v==='__skip'||!tm.includes(lc(v)))delete IRFU_STATE.matrixAliases[k];});
  }
  if(!Array.isArray(IRFU_STATE.pool)){
    const inCats=new Set(IRFU_CATS.flatMap(c=>IRFU_STATE[c.id]||[]));
    IRFU_STATE.pool=IRFU_ALL_NAMES.filter(n=>!inCats.has(n));
  }
  if(!IRFU_PROFILES){
    try{const s=localStorage.getItem('irfu_profiles');if(s)IRFU_PROFILES=JSON.parse(s);}catch(e){}
  }
  if(!IRFU_PROFILES)IRFU_PROFILES={};
  await Promise.all([irfuLoadBios(),irfuLoadMatrix()]);
}
function irfuSave(touch=true){
  // Stamp "last updated" on the referee whose page is open
  if(touch&&IRFU_PROFILE_NAME&&IRFU_PROFILES&&IRFU_PROFILES[IRFU_PROFILE_NAME])
    IRFU_PROFILES[IRFU_PROFILE_NAME].updatedAt=new Date().toISOString();
  clearTimeout(IRFU_SAVE_T);IRFU_SAVE_T=setTimeout(irfuFlush,600);
  try{localStorage.setItem('irfu_v2',JSON.stringify(IRFU_STATE));localStorage.setItem('irfu_profiles',JSON.stringify(IRFU_PROFILES));}catch(e){}
}
function irfuFlush(){
  clearTimeout(IRFU_SAVE_T);IRFU_SAVE_T=null;
  if(FIRESTORE&&SESSION&&IRFU_STATE){
    // Board is shared across all editors/admins
    FIRESTORE.doc('irfu_data/shared_board').set({state:IRFU_STATE,updatedAt:new Date().toISOString()}).catch(()=>{});
    // Profiles are private per user
    FIRESTORE.doc(`irfu_data/${SESSION.uid}`).set({profiles:IRFU_PROFILES,updatedAt:new Date().toISOString()}).catch(()=>toast('Could not save notes','err'));
  }
}
window.addEventListener('beforeunload',()=>{if(IRFU_SAVE_T)irfuFlush();});
function irfuCleanPool(){
  // Remove from pool anyone already assigned to a category
  const inCat=new Set(IRFU_CATS.flatMap(c=>(IRFU_STATE[c.id]||[]).map(n=>n.toLowerCase().trim())));
  const before=(IRFU_STATE.pool||[]).length;
  IRFU_STATE.pool=(IRFU_STATE.pool||[]).filter(n=>!inCat.has(n.toLowerCase().trim()));
  if(IRFU_STATE.pool.length<before)irfuSave();
}
async function irfuLoadSharedNotes(){
  if(IRFU_SHARED_NOTES)return;
  IRFU_SHARED_NOTES={};
  try{
    const snaps=await FIRESTORE.collection('irfu_shared').get();
    snaps.forEach(doc=>{
      if(doc.id!==SESSION.uid) // exclude own — shown in My Notes
        IRFU_SHARED_NOTES[doc.id]={displayName:doc.data().displayName||'Unknown',profiles:doc.data().profiles||{}};
    });
  }catch(e){}
}
async function irfuShareProfile(refName){
  const prof=IRFU_PROFILES[refName]||{};
  const hasContent=IRFU_PROF_FIELDS.some(f=>(prof[f.key]||[]).some(i=>i.text));
  if(!hasContent){alert('Add some notes first before sharing.');return;}
  try{
    await FIRESTORE.doc(`irfu_shared/${SESSION.uid}`).set({
      displayName:SESSION.name||SESSION.email,
      profiles:{...((await FIRESTORE.doc(`irfu_shared/${SESSION.uid}`).get()).data()?.profiles||{}),[refName]:prof}
    },{merge:false});
    if(!IRFU_SHARED_NOTES)IRFU_SHARED_NOTES={};
    IRFU_SHARED_NOTES=null; // force reload next time
    await irfuOpenProfile(refName);
  }catch(e){alert('Failed to share notes.');}
}
async function irfuUnshareProfile(refName){
  try{
    const doc=await FIRESTORE.doc(`irfu_shared/${SESSION.uid}`).get();
    if(doc.exists){
      const profiles=doc.data().profiles||{};
      delete profiles[refName];
      await FIRESTORE.doc(`irfu_shared/${SESSION.uid}`).set({displayName:SESSION.name||SESSION.email,profiles},{merge:false});
    }
    IRFU_SHARED_NOTES=null; // force reload next time
    await irfuOpenProfile(refName);
  }catch(e){alert('Failed to unshare.');}
}

// ---- Board chip rendering ----
function irfuHasNotes(name){
  const b=typeof irfuBio==='function'?irfuBio(name):{};
  if(['dob','province','height','weight','bronco','photo'].some(k=>b[k]))return true; // club alone (auto-filled from the matrix) doesn't count
  const prof=IRFU_PROFILES&&IRFU_PROFILES[name];
  if(!prof)return false;
  return IRFU_PROF_FIELDS.some(f=>(prof[f.key]||[]).some(i=>i.text&&i.text.trim()));
}
function irfuChipPasses(name){
  switch(IRFU_FILTER){
    case'data':return irfuHasNotes(name);
    case'nodata':return!irfuHasNotes(name);
    case'fresh':return irfuFresh(name).cls==='fresh';
    case'due':return irfuFresh(name).cls==='due';
    case'stale':return['stale','never'].includes(irfuFresh(name).cls);
    case'risk':return irfuLoadInfo(name).flag!=='green';
    default:return true;
  }
}
function irfuChipHTML(name,catId){
  const esc=name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const hasNotes=irfuHasNotes(name);
  const dimmed=!irfuChipPasses(name)?' irfu-dimmed':'';
  const notesCls=hasNotes?' has-notes':'';
  const dotHTML=hasNotes?'<span class="irfu-notes-dot" title="Has data"></span>':'';
  const F=irfuFresh(name),L=irfuLoadInfo(name);
  const riskHTML=L.flag!=='green'?`<span class="irfu-risk irfu-risk-${L.flag}" title="${L.injured?'Injury recorded':L.peak+' consecutive weeks'}"></span>`:'';
  return `<div class="irfu-chip${notesCls}${dimmed}" draggable="true" data-name="${esc}" data-cat="${catId}"
    ondragstart="irfuDragStart(event)" ondragend="irfuDragEnd(event)"
    onclick="irfuChipClick(event,this)" title="${F.label}">
    <span class="irfu-grip">⠿</span><span class="irfu-name">${name}</span>${riskHTML}${dotHTML}
    <button class="irfu-x" onclick="event.stopPropagation();irfuRemoveName(this)" title="Remove">×</button>
    <span class="irfu-fresh irfu-fresh-${F.cls}"></span>
  </div>`;
}

function irfuDownloadCSVTemplate(){
  const rows=[
    ['Referee','Date','Competition','Home','Away','Venue','Time','Role'],
    ['John Murphy','2026-10-05','URC','Leinster','Munster','Aviva Stadium','14:00','Referee'],
    ['Jane Smith','2026-10-12','AIL 1A','Lansdowne','Clontarf','Aviva Stadium','14:30','Referee'],

function irfuHandleCSVUpload(input){
  const file=input.files[0];if(!file)return;
  // Reset input so same file can be re-uploaded
  input.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    const text=e.target.result;
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){alert('CSV appears empty — check the file.');return;}
    // Parse header row (case-insensitive)
    const header=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim().toLowerCase());
    const col=n=>header.indexOf(n);
    const iRef=col('referee'),iDate=col('date'),iComp=col('competition'),
          iHome=col('home'),iAway=col('away'),iVenue=col('venue'),
          iTime=col('time'),iRole=col('role');
    if(iRef<0||iDate<0||iComp<0||iHome<0||iAway<0){
      alert('CSV is missing required columns.\nExpected: Referee, Date, Competition, Home, Away\nOptional: Venue, Time, Role\n\nUse the "CSV Template" button to download the correct format.');
      return;
    }
    function parseCSVRow(line){
      const vals=[];let cur='',inQ=false;
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(c==='"'){inQ=!inQ;}
        else if(c===','&&!inQ){vals.push(cur.trim());cur='';}
        else cur+=c;
      }
      vals.push(cur.trim());
      return vals;
    }
    const appointments=[];
    for(let i=1;i<lines.length;i++){
      const vals=parseCSVRow(lines[i]);
      const ref=(vals[iRef]||'').replace(/^"|"$/g,'').trim();
      const date=(vals[iDate]||'').replace(/^"|"$/g,'').trim();
      if(!ref||!date)continue;
      appointments.push({
        ref,date,
        comp:(vals[iComp]||'').replace(/^"|"$/g,'').trim(),
        home:(vals[iHome]||'').replace(/^"|"$/g,'').trim(),
        away:(vals[iAway]||'').replace(/^"|"$/g,'').trim(),
        venue:iVenue>=0?(vals[iVenue]||'').replace(/^"|"$/g,'').trim():'',
        time:iTime>=0?(vals[iTime]||'').replace(/^"|"$/g,'').trim():'',
        role:iRole>=0?(vals[iRole]||'').replace(/^"|"$/g,'').trim():'Referee',
      });
    }
    if(!appointments.length){alert('No valid rows found in CSV. Check the file format.');return;}
    await irfuImportAppointments(appointments);
  };
  reader.readAsText(file);
}
async function irfuImportAppointments(appointments){
  if(!appointments||!appointments.length){alert('No appointments data found.');return;}
  const user=firebase.auth().currentUser;
  if(!user){alert('Please sign in first.');return;}
  const today=new Date().toISOString().split('T')[0];
  // First, clear any previously imported entries from all profiles so we start fresh
  Object.keys(IRFU_PROFILES||{}).forEach(name=>{
    const prof=IRFU_PROFILES[name];
    if(!prof)return;
    ['upcoming','previous'].forEach(f=>{
      if(prof[f])prof[f]=prof[f].filter(it=>!irfuIsImportedEntry(it));
    });
  });
  // Build normalized name map: lowercase → canonical, for everyone already on the board
  const boardNames=new Map();
  IRFU_CATS.forEach(c=>(IRFU_STATE[c.id]||[]).forEach(n=>boardNames.set(n.toLowerCase().trim(),n)));
  (IRFU_STATE.pool||[]).forEach(n=>boardNames.set(n.toLowerCase().trim(),n));
  let added=0,skipped=0;
  for(const appt of appointments){
    const name=appt.ref;
    if(!name||name==='Unknown')continue;
    const nameNorm=name.toLowerCase().trim();
    // Only add to pool if genuinely not on the board at all
    if(!boardNames.has(nameNorm)){
      IRFU_STATE.pool=IRFU_STATE.pool||[];
      if(!IRFU_STATE.pool.some(n=>n.toLowerCase().trim()===nameNorm)){
        IRFU_STATE.pool.push(name);
        boardNames.set(nameNorm,name);
      }
    }
    // Use canonical name from board
    const canonName=boardNames.get(nameNorm)||name;
    // Past games → previous, future games → upcoming
    const field=appt.date<=today?'previous':'upcoming';
    // Build note text
    let roleTag=appt.role&&appt.role!=='Referee'?` (${appt.role})`:'';
    const noteText=`${irfuShortComp(appt.comp)}: ${appt.home} vs ${appt.away} — ${appt.venue}${appt.time?', '+appt.time:''}${roleTag}`;
    // Priority — not auto-assigned; set manually per game if needed
    const priority='';
    // Load existing profile
    if(!IRFU_PROFILES[canonName])IRFU_PROFILES[canonName]={};
    const prof=IRFU_PROFILES[canonName];
    const items=prof[field]||[];
    // Dedup: check BOTH upcoming AND previous so we never double-add across fields
    const allExisting=[...(prof.upcoming||[]),...(prof.previous||[])];
    const dup=allExisting.some(it=>{
      if(!it.text)return false;
      const sameDate=it.date&&it.date===appt.date;
      const hasHome=it.text.toLowerCase().includes(appt.home.toLowerCase());
      const hasAway=it.text.toLowerCase().includes(appt.away.toLowerCase());
      return sameDate&&hasHome&&hasAway;
    });
    if(dup){skipped++;continue;}
    // Add note
    const newItem={id:irfuItemId(),text:noteText,done:false,priority,date:appt.date};
    items.push(newItem);
    prof[field]=items;
    added++;
  }
  // Save all profiles to Firestore
  if(added>0){
    irfuSave();
    const db=firebase.firestore();
    const docRef=db.collection('irfu_data').doc(user.uid);
    await docRef.set({profiles:IRFU_PROFILES},{merge:true});
    renderIRFU();
    alert(`✅ Imported ${added} appointment${added!==1?'s':''} into referee profiles.\nPast games → Previous Games \xb7 Future games → Upcoming Games${skipped?`\n(${skipped} already existed — skipped)`:''}`);
  }else{
    alert(`All ${skipped} appointment${skipped!==1?'s':''} already in profiles — nothing new to import.`);
  }
}
function irfuMatchesRef(name,rn){
  if(!rn||rn==='Unknown')return false;
  const n=name.toLowerCase().trim(),m=rn.toLowerCase().trim();
  if(n===m)return true;
  const nParts=n.split(/\s+/),mParts=m.split(/\s+/);
  const nLast=nParts[nParts.length-1],mLast=mParts[mParts.length-1];
  // Last name match
  if(nLast.length>3&&(mLast===nLast||m.includes(nLast)||n.includes(mLast)))return true;
  // First initial + last name: "A. Brace" matches "Andrew Brace"
  if(nParts.length>=2&&mParts.length>=2){
    if(mParts[0].replace('.','')===nParts[0][0]&&mLast===nLast)return true;
    if(nParts[0].replace('.','')===mParts[0][0]&&nLast===mLast)return true;
  }
  return false;
}

const IRFU_ROLES=['Referee','AR1','AR2','TMO','FPRO','No.4','No.5'];

let IRFU_BIOS=null,IRFU_BIO_T={},IRFU_PAGE_TAB='overview',IRFU_SHOW_ALL_PREV=false;
let IRFU_CAL_MONTH=null,IRFU_CAL_VIEW='month',IRFU_DEV_DRAG=null;

// ---- small helpers ----
function irfuEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function irfuJsArg(s){return irfuEsc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
function irfuISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function irfuToday(){return irfuISO(new Date());}
function irfuParseISO(s){const p=(s||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null;}
function irfuAddDays(iso,n){const d=irfuParseISO(iso);d.setDate(d.getDate()+n);return irfuISO(d);}
function irfuWeekKey(iso){const d=irfuParseISO(iso);if(!d)return'';d.setDate(d.getDate()-((d.getDay()+6)%7));return irfuISO(d);}
function irfuDaysAgo(ts){if(!ts)return null;return Math.floor((Date.now()-new Date(ts).getTime())/864e5);}
function irfuFmtDate(iso,opts){const d=irfuParseISO(iso);return d?d.toLocaleDateString('en-IE',opts||{weekday:'short',day:'numeric',month:'short'}):'No date';}
function irfuAgoText(days){if(days===null)return'never';if(days<=0)return'today';if(days===1)return'yesterday';if(days<14)return`${days} days ago`;if(days<60)return`${Math.floor(days/7)} weeks ago`;return`${Math.floor(days/30)} months ago`;}
function irfuRoleCls(r){return'r-'+(r||'Referee').replace(/[^A-Za-z0-9]/g,'');}
function irfuNormRole(r){
  const s=(r||'').toLowerCase().replace(/\s+/g,'');
  if(!s||s==='referee'||s==='ref')return'Referee';
  if(s==='ar1')return'AR1';if(s==='ar2'||s==='ar')return s==='ar'?'AR1':'AR2';
  if(s==='tmo')return'TMO';if(s==='fpro')return'FPRO';
  if(s.includes('4'))return'No.4';if(s.includes('5'))return'No.5';
  return'Referee';
}
function irfuCanEdit(){return SESSION&&(SESSION.type==='admin'||SESSION.type==='editor');}
function irfuProf(name){
  if(!IRFU_PROFILES[name])IRFU_PROFILES[name]={};
  const p=IRFU_PROFILES[name];
  IRFU_PROF_FIELDS.forEach(f=>{if(!Array.isArray(p[f.key]))p[f.key]=[];});

}

function irfuBioKey(name){return name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
async function irfuLoadBios(force){
  if(IRFU_BIOS&&!force)return;
  IRFU_BIOS={};
  try{const s=await FIRESTORE.collection('irfu_bio').get();s.forEach(d=>{IRFU_BIOS[d.id]=d.data();});}catch(e){}
}
function irfuBio(name){return(IRFU_BIOS||{})[irfuBioKey(name)]||{};}
function irfuSetBio(name,field,value){
  const k=irfuBioKey(name);

  IRFU_BIOS[k]={...(IRFU_BIOS[k]||{}),name,[field]:value,updatedAt:new Date().toISOString(),updatedBy:SESSION?.name||''};
  clearTimeout(IRFU_BIO_T[k]);

function irfuAge(dob){
  const d=irfuParseISO(dob);if(!d)return null;
  const n=new Date();let a=n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;
  return a;
}

// ---- Freshness (when this referee was last updated) ----
function irfuLastUpdated(name){
  const p=(IRFU_PROFILES||{})[name]||{},b=irfuBio(name);

function irfuFresh(name){

  if(days===null)return{cls:'never',days,label:'Never updated'};

function irfuSplitRole(it){
  let text=it.text||'',role=it.role||'';
  const m=text.match(/\s*\((Referee|AR\s?1|AR\s?2|AR|TMO|No\.?\s?4|No\.?\s?5)\)\s*$/i);
  if(m){text=text.slice(0,m.index);if(!role)role=irfuNormRole(m[1]);}
  return{role:role||'Referee',text};
}
function irfuOptaFor(name){
  const all=(typeof MATCHES!=='undefined'&&MATCHES)||[];
  let ms=all.filter(m=>m.rn&&irfuMatchesRef(name,m.rn));
  if(!ms.length&&typeof refs==='function'){
    const r=refs().find(r=>irfuMatchesRef(name,r.n));
    if(r)ms=all.filter(m=>m.rid===r.id);
  }
  return ms.map(m=>({iso:ddmmToISO(m.date),home:m.hn||m.hid||'',away:m.an||m.aid||'',hs:m.hs,as:m.as}))
    .filter(x=>x.iso).sort((a,b)=>b.iso.localeCompare(a.iso));
}
function irfuTeamsFromText(text){
  const mid=(text||'').toLowerCase().replace(/^[^:]+:\s*/,'').replace(/\s*[—–].*$/,'').trim();
  const parts=mid.split(/\s+vs?\.?\s+/);
  return parts.length>=2?{h:parts[0].trim(),a:parts[1].trim()}:null;
}
function irfuShortComp(t){return String(t||'').replace(/\bUnited Rugby Championship\b/gi,'URC');}
function irfuOverlap(a,b){a=(a||'').toLowerCase().replace(/[^a-z0-9]/g,'');b=(b||'').toLowerCase().replace(/[^a-z0-9]/g,'');return!!a&&!!b&&(a.includes(b)||b.includes(a));}
function irfuSameFixture(t,u,textA,textB){
  return t&&u?(irfuOverlap(t.h,u.h)||irfuOverlap(t.a,u.a)||irfuOverlap(t.h,u.a)||irfuOverlap(t.a,u.h)):irfuOverlap(textA,textB);
}
function irfuGames(name){
  const prof=(IRFU_PROFILES||{})[name]||{};
  const opta=irfuOptaFor(name),used=new Set(),rows=[];
  const optaFor=(t,date,exact)=>{
    let o=null;
    opta.forEach((x,i)=>{
      if(o||used.has(i))return;
      const teams=t&&irfuOverlap(t.h,x.home)&&irfuOverlap(t.a,x.away);
      const near=date&&Math.abs((irfuParseISO(date)-irfuParseISO(x.iso))/864e5)<=3;
      if((exact&&date===x.iso&&!t)||(teams&&near)){o=x;used.add(i);}
    });
    return o;
  };
  // 1) AIL matrix (shared) is the main source
  const mx=((irfuMatrixFor(name)||{}).appts||[]).map(a=>{
    const text=irfuShortComp(a.text),t=irfuTeamsFromText(text),o=optaFor(t,a.date,false);
    return{kind:'matrix',role:a.role||'Referee',text,t,date:o?o.iso:a.date,opta:o};
  });
  // 2) Games typed in / CSV-imported — hidden when the matrix already has that game
  ['upcoming','previous'].forEach(src=>(prof[src]||[]).forEach(it=>{
    // one-off tidy: pull "(AR1)" etc. out of the text into a proper role field
    if(!it.role){const sr=irfuSplitRole(it);if(sr.text!==(it.text||'')){it.role=sr.role;it.text=sr.text;}}
    if(it.text&&/United Rugby Championship/i.test(it.text))it.text=irfuShortComp(it.text);
    const{role,text}=irfuSplitRole(it);
    const t=irfuTeamsFromText(text);
    if(it.date&&text&&mx.some(m=>irfuWeekKey(m.date)===irfuWeekKey(it.date)&&irfuSameFixture(t,m.t,text,m.text)))return;
    rows.push({kind:'item',src,it,role,text,date:it.date||'',opta:optaFor(t,it.date,true)});
  }));
  rows.push(...mx);
  // 3) Opta games not in either list
  opta.forEach((x,i)=>{if(!used.has(i))rows.push({kind:'opta',role:'Referee',text:`${x.home} vs ${x.away}`,date:x.iso,opta:x});});
  const today=irfuToday();
  const upcoming=rows.filter(r=>r.date?r.date>=today:r.src==='upcoming').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const previous=rows.filter(r=>r.date?r.date<today:r.src==='previous').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return{upcoming,previous,all:rows};
}

// ---- Load / injury risk ----
function irfuLoadCfg(){return Object.assign({amber:5,red:6},(IRFU_STATE&&IRFU_STATE.loadCfg)||{});}
function irfuLoadInfo(name){
  const cfg=irfuLoadCfg(),g=irfuGames(name),today=irfuToday(),thisWk=irfuWeekKey(today);
  const prof=(IRFU_PROFILES||{})[name]||{};
  const weeks=new Map();
  g.all.forEach(r=>{if(r.date){const k=irfuWeekKey(r.date);if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(r);}});
  // Consecutive weeks with a game, up to and including this week
  let cur=0,k=weeks.has(thisWk)?thisWk:irfuAddDays(thisWk,-7);
  while(weeks.has(k)){cur++;k=irfuAddDays(k,-7);}
  // Projected run including games already scheduled ahead
  let proj=cur;
  if(weeks.has(thisWk)){k=irfuAddDays(thisWk,7);while(weeks.has(k)){proj++;k=irfuAddDays(k,7);}}
  else{let f=0;k=irfuAddDays(thisWk,7);while(weeks.has(k)){f++;k=irfuAddDays(k,7);}proj=Math.max(cur,f);}
  const peak=Math.max(cur,proj);
  const lvl=n=>n>=cfg.red?'red':n>=cfg.amber?'amber':'green';
  const level=lvl(peak);
  const from28=irfuAddDays(today,-27),to28=irfuAddDays(today,28);
  const last28=g.all.filter(r=>r.date&&r.date>=from28&&r.date<=today).length;
  const next28=g.all.filter(r=>r.date&&r.date>today&&r.date<=to28).length;
  let nextFree=null;
  for(let i=0;i<20;i++){const wk=irfuAddDays(thisWk,i*7);if(!weeks.has(wk)){nextFree=wk;break;}}
  const unav=irfuUnavailMap(name);
  const mxInj=[...Array(7)].some((_,i)=>unav.get(irfuAddDays(thisWk,i))==='INJ');
  const injured=mxInj||(prof.injuries||[]).some(i=>!i.done&&(i.text||'').trim());
  const flag=injured?'red':level;
  // Week strip: 8 weeks back, 5 ahead; colour each run by its length so far
  const strip=[];
  for(let i=-8;i<=5;i++){
    const wk=irfuAddDays(thisWk,i*7);
    let run=0,j=wk;while(weeks.has(j)){run++;j=irfuAddDays(j,-7);}
    const un=[...unav.keys()].some(d=>irfuWeekKey(d)===wk);
    strip.push({wk,on:weeks.has(wk),lvl:lvl(run),now:i===0,fut:i>0,un,games:weeks.get(wk)||[]});
  }
  return{cfg,cur,proj,peak,level,flag,injured,mxInj,unav,last28,next28,nextFree,strip,weeks,games:g};
}

function irfuUploadPhoto(input){
  const file=input.files&&input.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const W=240,H=288,c=document.createElement('canvas');c.width=W;c.height=H;
    const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
    c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2.6,w,h);
    URL.revokeObjectURL(url);
    irfuSetBio(IRFU_PROFILE_NAME,'photo',c.toDataURL('image/jpeg',0.82));
    irfuRenderBio();
  };
  img.onerror=()=>toast('Could not read that image','err');
  img.src=url;
}

function irfuSetLoadCfg(k,v){
  const n=Math.max(1,Math.min(20,parseInt(v)||0));
  IRFU_STATE.loadCfg={...irfuLoadCfg(),[k]:n};
  if(IRFU_STATE.loadCfg.red<IRFU_STATE.loadCfg.amber)IRFU_STATE.loadCfg.red=IRFU_STATE.loadCfg.amber;
  irfuSave(false);irfuRenderLoad();irfuRenderHeader();
  if(document.querySelector('.irfu-board'))renderIRFU();
}

    <input class="irp-txt" value="${irfuEsc(r.text)}" placeholder="e.g. URC: Leinster vs Munster — Aviva" oninput="irfuUpdateItem('${src}','${id}','text',this.value)">

function irfuRoleTally(rows){
  const c={Referee:0,AR:0,No4:0,No5:0,TMO:0,FPRO:0};
  rows.forEach(r=>{const k=/^AR/.test(r.role)?'AR':r.role==='No.4'?'No4':r.role==='No.5'?'No5':r.role;if(k in c)c[k]++;});
  const items=[['Referee','Referee','#1a6b3e'],['AR','AR','#2f5fb3'],['No4','No.4','#6b7a70'],['No5','No.5','#6b7a70'],['TMO','TMO','#7a3fb0']];
  if(c.FPRO)items.push(['FPRO','FPRO','#b0457a']);

function irfuMoveDev(from,to,id,beforeId){

function irfuRenderCalendar(){
  const name=IRFU_PROFILE_NAME,el=document.getElementById('irfu-cal');if(!el)return;

    <span><i style="background:repeating-linear-gradient(45deg,#fdecea 0 3px,#fff 3px 6px);border:1px solid #f3c5c0"></i>Unavailable</span></div>`;
  const viewBtns=`<button class="irc-btn${IRFU_CAL_VIEW==='month'?' on':''}" onclick="IRFU_CAL_VIEW='month';irfuRenderCalendar()">Month</button>
    <button class="irc-btn${IRFU_CAL_VIEW==='season'?' on':''}" onclick="IRFU_CAL_VIEW='season';irfuRenderCalendar()">Season weekends</button>`;
  if(IRFU_CAL_VIEW==='season'){
    const t=irfuParseISO(today),sy=t.getMonth()>=6?t.getFullYear():t.getFullYear()-1;
    let html='',worked=0,free=0;
    for(let mi=0;mi<11;mi++){
      const md=new Date(sy,7+mi,1),y=md.getFullYear(),m=md.getMonth();
      let wk=irfuWeekKey(irfuISO(md)),rows='';
      while(true){
        const sat=irfuAddDays(wk,5);const satD=irfuParseISO(sat);

        const gs=L.weeks.get(wk)||[];

        const past=irfuAddDays(wk,6)<today;
        if(past){gs.length?worked++:free++;}
        const col=gs.length?({'Referee':'#1a6b3e','TMO':'#7a3fb0','FPRO':'#b0457a','AR1':'#2f5fb3','AR2':'#2f5fb3'}[gs[0].role]||'#6b7a70'):un?'#e8a39c':'#dfe7e1';
        rows+=`<div class="irc-wk"${wk===irfuWeekKey(today)?' style="font-weight:700"':''}><span class="irc-wk-d">Sat ${satD.getDate()}</span><span class="irc-wk-s" style="background:${col}"></span>
          <span class="irc-wk-t" title="${irfuEsc(gs.map(g=>g.role+': '+g.text).join(' | '))}">${gs.length?irfuEsc(gs.map(g=>(g.role!=='Referee'?g.role+' · ':'')+g.text.replace(/\s*[—–].*$/,'')).join(' | ')):un?`<span style="color:var(--red)">${[...Array(7)].some((_,i)=>unavMap.get(irfuAddDays(wk,i))==='INJ')?'Injured':'Unavailable'}</span>`:'<span style="color:var(--txt-faint)">Free</span>'}</span></div>`;
        wk=irfuAddDays(wk,7);

    }
    el.innerHTML=`<div class="irc-bar"><h3>${sy}–${String(sy+1).slice(-2)} season</h3>${viewBtns}</div>
      <div class="irc-sum"><div><b>${worked}</b>weeks with a game so far</div><div><b>${free}</b>weeks off so far</div><div><b>${L.peak}</b>consecutive weeks now</div></div>
      <div class="irc-season">${html}</div>${legend}`;
    return;
  }
  const[y,m]=IRFU_CAL_MONTH.split('-').map(Number);
  const first=new Date(y,m-1,1),last=new Date(y,m,0);
  let d=irfuWeekKey(irfuISO(first));const end=irfuAddDays(irfuWeekKey(irfuISO(last)),6);
  let cells='',mGames=0,wkWorked=0,wkFree=0;

        <div class="irc-dnum"><span>${dd.getDate()}</span>${unav.has(iso)?(unavMap.get(iso)==='INJ'?'<span class="irc-unav-lbl inj">INJ</span>':'<span class="irc-unav-lbl">N/A</span>'):''}</div>${gs.map(chip).join('')}</div>`;
    }

    if(sat.getMonth()===m-1){const wkUn=[4,5,6].some(i=>unav.has(irfuAddDays(d,i)));wkGames.length?wkWorked++:wkUn?0:wkFree++;}
    d=irfuAddDays(d,7);

      <button class="irc-btn" onclick="irfuCalShift(-1)">‹</button>
      <h3>${first.toLocaleDateString('en-IE',{month:'long',year:'numeric'})}</h3>
      <button class="irc-btn" onclick="irfuCalShift(1)">›</button>
      <button class="irc-btn" onclick="IRFU_CAL_MONTH=irfuToday().slice(0,7);irfuRenderCalendar()">Today</button>
      <span style="flex:1"></span>${viewBtns}</div>
    <div class="irc-sum"><div><b>${mGames}</b>games this month</div><div><b>${wkWorked}</b>weekends with a game</div><div><b>${wkFree}</b>free weekends</div><div><b>${L.peak}</b>consecutive weeks now</div></div>
    <div class="irc-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="irc-dow">${x}</div>`).join('')}${cells}</div>

// ===================== AIL MATRIX IMPORT =====================
const IRFU_MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const IRFU_DOW={mon:-5,tue:-4,tues:-4,wed:-3,thu:-2,thur:-2,thurs:-2,fri:-1,sat:0,sun:1};
const IRFU_COMP_RE=new RegExp('^('+[
  "URC SA","URC","EPCR R\\d+","EPCR","Challenge Cup R\\d+","Champions Cup R\\d+",
  "Men'?s Nations Cup","Nations Champ(?:ionship)?","Nations Cup","A Interpro","Pre-? ?Season",
  "Wom[e']?n'?s Interpro Final","Wom[e']?n'?s Interpro","Wom[e']?n'?s Global XV","WXV Global Series","SH Tests",
  "Jun(?:ior)? Cup","WAIL","Bateman Cup (?:SF|Final)","Bateman Cup","Celtic Challenge","Club Int",
  "U\\d\\ds?(?: [A-Za-z']+){0,3}?(?= (?:- )?(?:Munster|Leinster|Ulster|Connacht)\\b)"
].join('|')+')\\s*[-:]?\\s*','i');
const IRFU_ROLE_TOKENS=/\b(?:TMO|FPRO)(?:\s+(?:Hub|On Site|Op))?\b|\bNo\.?\s?[45]\b|\bAR\s?[12]\b|\bReferee\b|\bRef\b/gi;

function irfuMxNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');}
// "31/1/2 Aug" → Saturday ISO, keeping months in order across the season
function irfuMxWeekends(headers,startYear){
  let prevAbs=-1;
  return headers.map(h=>{
    const m=String(h||'').trim().match(/^([\d\s\/]+?)\s*([A-Za-z]{3,})/);
    if(!m)return null;
    const mon=IRFU_MONTHS[m[2].slice(0,3).toLowerCase()];if(mon===undefined)return null;
    const nums=m[1].split('/').map(x=>parseInt(x)).filter(n=>!isNaN(n));if(!nums.length)return null;
    let sun=nums[nums.length-1];
    if(sun>31&&nums.length>=2)sun=nums[nums.length-2]+1;
    let abs=startYear*12+mon;while(abs<=prevAbs-6)abs+=12;prevAbs=abs;
    const d=new Date(Math.floor(abs/12),abs%12,sun);d.setDate(d.getDate()-1);
    return irfuISO(d);
  });
}
function irfuMxRole(s){
  if(/\bFPRO\b/i.test(s))return'FPRO';
  if(/\bTMO\b/i.test(s))return'TMO';
  if(/\bNo\.?\s?4\b/i.test(s))return'No.4';
  if(/\bNo\.?\s?5\b/i.test(s))return'No.5';
  if(/\bAR\s?1\b/i.test(s))return'AR1';
  if(/\bAR\s?2\b/i.test(s))return'AR2';
  return'Referee';
}
// Explicit day inside the cell (e.g. "(12/08)", "Wed 14/10/26", "(26th)", "Sat 7's") → ISO, if it sits in that weekend's week
function irfuMxDay(s,sat){
  const satD=irfuParseISO(sat);
  const near=d=>{const diff=Math.round((d-satD)/864e5);return diff>=-6&&diff<=2;};
  let m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/\d{2,4})?\b/);
  if(m){const dd=+m[1],mm=+m[2]-1;for(const y of[satD.getFullYear(),satD.getFullYear()-1,satD.getFullYear()+1]){const d=new Date(y,mm,dd);if(d.getMonth()===mm&&near(d))return{iso:irfuISO(d),tok:m[0]};}}
  m=s.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i);
  if(m){for(let i=-6;i<=2;i++){const d=new Date(satD);d.setDate(d.getDate()+i);if(d.getDate()===+m[1])return{iso:irfuISO(d),tok:null};}}
  m=s.match(/\b(Mon|Tues?|Wed|Thu(?:rs?)?|Fri|Sat|Sun)(?:day)?\b/i);
  if(m){const off=IRFU_DOW[m[1].toLowerCase()];if(off!==undefined)return{iso:irfuAddDays(sat,off),tok:null};}
  return null;
}
function irfuMxClean(seg){
  let s=seg.replace(IRFU_ROLE_TOKENS,' ').replace(/\b(?:Hub|On Site)\b/gi,' ')
    .replace(/\(\s*(?:\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{1,2}(?:st|nd|rd|th)|Sun|Sat|Fri)\s*\)/gi,' ')
    .replace(/\b(?:Mon|Tues?|Wed|Thu(?:rs?)?|Fri|Sat|Sun)\s+\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/gi,' ')
    .replace(/(?<!-)\b\d{1,2}(?:st|nd|rd|th)\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b/gi,' ')
    .replace(/\bPre-?\s*Season\b/i,'Pre-Season')
    .replace(/\s+/g,' ').replace(/^[\s\-–:]+|[\s\-–:,]+$/g,'').replace(/\s+-\s*$/,'');
  s=s.replace(/\s+V\s+/g,' v ');
  let comp='';
  const ail=s.match(/^(1A|1B|2A|2B|2C)\b\s*[-:]?\s*/i);
  if(ail){comp='AIL '+ail[1].toUpperCase();s=s.slice(ail[0].length);}
  else{const c=s.match(IRFU_COMP_RE);if(c&&c[0].length<s.length){comp=c[1].trim();s=s.slice(c[0].length);}}
  s=s.replace(/^[\s\-–:]+|[\s\-–:,]+$/g,'');
  if(comp&&!/\sv\s/i.test(s)&&/\s-\s/.test(s))s=s.replace(/\s-\s/,' v ');
  return comp?`${comp}: ${s}`:s;
}
// One matrix cell → appointments + status (N/A / INJ)
function irfuMxParseCell(text,sat){
  const raw=String(text??'').replace(/\s+/g,' ').trim();
  if(!raw||raw==='0'||raw==='-')return{appts:[],status:null};
  const st=raw.match(/^(N\s?\/\s?A|INJ(?:URED)?|Unavailable)\b(.*)$/i);
  if(st&&!/\sv\s/i.test(raw)){
    const status=/^inj/i.test(st[1])?'INJ':'N/A',rest=st[2].toLowerCase();
    const days=/sun/.test(rest)?[1]:/sat/.test(rest)?[0]:/fri/.test(rest)?[-1]:[-1,0,1];
    return{appts:[],status,days:days.map(o=>irfuAddDays(sat,o))};
  }
  // Split into separate appointments: "/" (not dates like 29/09 or 3/4), "," "+" "&"
  let segs=raw.replace(/(\D)\s*\/|\/\s*(\D)/g,(m,a,b)=>(a!==undefined?a:'')+'|'+(b!==undefined?b:''))
    .split(/\||,|\s\+\s/).map(s=>s.trim()).filter(Boolean);
  // "AR1 - Connacht v Zebre Ref 1A - Old Wesley v Young Munster" → two
  const out=[];
  segs.forEach(s=>{
    while(true){
      const vs=[...s.matchAll(/\sv\s/gi)];if(vs.length<2){out.push(s);break;}
      const between=s.slice(vs[0].index+3,vs[1].index);
      const toks=[...between.matchAll(/\s(Ref|AR\s?[12]|No\.?\s?[45])\b/gi)];
      if(!toks.length){out.push(s);break;}
      const cut=vs[0].index+3+toks[toks.length-1].index;
      out.push(s.slice(0,cut).trim());s=s.slice(cut).trim();
    }
  });
  const appts=[];let lastComp='';
  out.forEach(seg=>{
    if(/training|\bTS\b|session|\bcamp\b|selection|^n\s?\/\s?a$|^inj/i.test(seg))return;
    let text=irfuMxClean(seg);
    if(!text||text.length<3||!/[a-z]{3}/i.test(text))return;
    const cm=text.match(/^([^:]+):/);
    if(cm)lastComp=cm[1];else if(lastComp&&/^3\/4\b/.test(text))text=`${lastComp}: ${text}`;
    const day=irfuMxDay(seg,sat);
    appts.push({date:day?day.iso:sat,role:irfuMxRole(seg),text,raw:seg});
  });
  return{appts,status:null};
}
// Workbook (SheetJS) → {refs:[{key,label,club,appts,unavail}], weeks, lastWeek}
function irfuMxParseWorkbook(wb,fileName){
  const names=wb.SheetNames;
  const pick=names.find(n=>/full\s*panel/i.test(n))||names.slice().sort((a,b)=>{
    const r=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,blankrows:false}).length;return r(b)-r(a);})[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[pick],{header:1,defval:'',raw:false,blankrows:true});
  const hr=rows.findIndex(r=>String(r[0]).trim().toLowerCase()==='referee');
  if(hr<0)throw new Error(`Couldn't find the "Referee" header row on the "${pick}" tab.`);
  const hdr=rows[hr];
  const clubCol=hdr.findIndex(h=>String(h).trim().toLowerCase()==='club');
  const ym=String(fileName||'').match(/(20\d\d)\D{0,3}(20\d\d)/);
  const now=new Date();
  const startYear=ym?+ym[1]:(now.getMonth()>=6?now.getFullYear():now.getFullYear()-1);
  const sats=irfuMxWeekends(hdr,startYear);
  const refs=[];let lastWeek=null;const perWeek={};
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i],label=String(r[0]||'').trim();
    if(!label||/^referee$/i.test(label))continue;
    const club=clubCol>=0?String(r[clubCol]||'').trim():'';
    const ref={label,club:/^(none|n\/a|-|0)?$/i.test(club)?'':club,appts:[],unavail:[]};
    sats.forEach((sat,c)=>{
      if(!sat||c===0||c===clubCol)return;
      const v=String(r[c]??'').trim();if(!v||v==='0')return;
      const p=irfuMxParseCell(v,sat);
      if(p.appts.length||p.status){if(!lastWeek||sat>lastWeek)lastWeek=sat;perWeek[sat]=(perWeek[sat]||0)+1;}
      p.appts.forEach(a=>ref.appts.push(a));
      if(p.status)p.days.forEach(d=>ref.unavail.push({d,why:p.status}));
    });
    refs.push(ref);
  }
  const busy=Object.keys(perWeek).filter(k=>perWeek[k]>=5).sort();
  return{sheet:pick,startYear,refs,lastWeek,filledTo:busy.length?irfuAddDays(busy[busy.length-1],1):lastWeek};
}
// "MacNeice J" / "Lyons E" / "Bennett" → board name
function irfuMxMatchName(label,boardNames){
  const alias=((IRFU_STATE&&IRFU_STATE.matrixAliases)||{})[label];
  if(alias&&alias!=='__skip')return alias;
  const m=label.trim().match(/^(.*?)(?:\s+([A-Z])\.?)?$/);
  const sur=irfuMxNorm(m[1]),ini=(m[2]||'').toLowerCase();
  const hits=boardNames.filter(n=>{
    const p=n.trim().split(/\s+/);
    return irfuMxNorm(p[p.length-1])===sur&&(!ini||irfuMxNorm(p[0])[0]===ini);
  });
  return hits.length===1?hits[0]:(alias||null);
}

// Filenames like "A Brace.jpg", "J MacNeice L.jpg", "K Davison 2.jpg", "C OFlynn R.jpg", "L Colgan 2026.jpg"
let IRFU_PHOTO_PENDING=null;
function irfuPhotoMatch(fileName,boardNames){
  let base=fileName.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ').trim();
  let toks=base.split(/\s+/);
  // drop version / variant suffixes: 2, 1, 2026, L, R, Alt, Final, New, copy
  while(toks.length>1&&/^(\d+|l|r|alt|final|new|copy|v\d+)$/i.test(toks[toks.length-1]))toks.pop();
  const full=irfuMxNorm(toks.join(''));
  // full name in the file ("Andy Brace.jpg")
  let hits=boardNames.filter(n=>irfuMxNorm(n)===full);
  if(hits.length===1)return hits[0];
  const ini=toks.length>1&&toks[0].replace('.','').length<=2?irfuMxNorm(toks[0])[0]:'';
  const sur=irfuMxNorm((ini?toks.slice(1):toks).join(''));
  hits=boardNames.filter(n=>{const p=n.trim().split(/\s+/);return irfuMxNorm(p[p.length-1])===sur;});
  if(hits.length>1&&ini)hits=hits.filter(n=>irfuMxNorm(n)[0]===ini);
  return hits.length===1?hits[0]:null;
}
// Head-and-shoulders crop for the IRFU studio portraits
function irfuHeadshotDataURL(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const W=240,H=288,c=document.createElement('canvas');c.width=W;c.height=H;
      const iw=img.naturalWidth,ih=img.naturalHeight;
      let sw=iw*0.62,sh=sw*1.2;
      if(sh>ih){sh=ih;sw=sh/1.2;}
      const sx=(iw-sw)/2,sy=Math.min(ih*0.015,ih-sh);
      const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read '+file.name));};
    img.src=url;
  });
}

let SEL_REFSTATS_T=null;
let SEL_REFSTATS_HOME='',SEL_REFSTATS_AWAY='',SEL_REFSTATS_DATE_FROM='',SEL_REFSTATS_DATE_TO='';
function renderRefStats(){
  const el=document.getElementById('rs');
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">🏉</div><h2>No data yet</h2><p>Upload XML files to view referee stats.</p></div>`;return;}
  // Keep the autocomplete datalist in the body so it survives el.innerHTML re-renders
  let dl=document.getElementById('rs-refs-datalist');
  if(!dl){dl=document.createElement('datalist');dl.id='rs-refs-datalist';document.body.appendChild(dl);}
  const allRefNames=[...new Set(MATCHES.map(m=>m.rn).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  dl.innerHTML=allRefNames.map(n=>`<option value="${n}">`).join('');
  // Use global filters (set via the top filter bar) — no local duplicate filter row needed
  const base=getFilteredMatches();
  let ms=[...base];
  // Aggregate per referee
  const refMap={};
  ms.forEach(m=>{
    const rid=m.rid||'unknown';
    const rn=m.rn||'Unknown Referee';
    if(!refMap[rid]){refMap[rid]={id:rid,n:rn,games:0,pen:0,fkC:0,yel:0,red:0,inf:{}};}
    const r=refMap[rid];
    r.games++;
    [m.hid,m.aid].forEach(tid=>{
      const s=m.stats[tid]||{};
      r.pen+=s.pen||0;
      r.fkC+=s.fkC||0;
      r.yel+=s.yel||0;
      r.red+=s.red||0;
      Object.entries(s.inf||{}).forEach(([k,v])=>{r.inf[k]=(r.inf[k]||0)+v;});
    });
  });
  const refList=Object.values(refMap).filter(r=>r.games>0);
  if(!refList.length){el.innerHTML=`<div class="page-hdr"><h2>Ref Stats</h2></div><div class="no-data">No referee data available.</div>`;return;}
  // Helper: build one stat card with search highlight
  function refCard(label,col,fn){
    const allSorted=[...refList].sort((a,b)=>(fn(b)/b.games)-(fn(a)/a.games));
    const maxV=Math.max(...allSorted.map(r=>fn(r)/r.games),1);
    const searchQ=(SEL_REFSTATS_SEARCH||'').toLowerCase().trim();
    // Find searched ref rank if any
    let searchedEntry=null;
    if(searchQ){
      const searchedIdx=allSorted.findIndex(r=>r.n.toLowerCase().includes(searchQ));
      if(searchedIdx>=0){searchedEntry={r:allSorted[searchedIdx],rank:searchedIdx+1};}
    }
    // Show top 10, exclude searched ref from normal list
    const top10=allSorted.filter(r=>!searchedEntry||r.id!==searchedEntry.r.id).slice(0,10);
    function buildRow(r,rank,highlight){
      const total=fn(r),avg=(total/r.games).toFixed(1);

      t.penW+=st.penW||0;t.fkW+=st.fkW||0;t.fkC+=st.fkC||0;
      t.loW+=st.loW||0;t.loT+=st.loT||0;t.yel+=st.yel||0;t.red+=st.red||0;
      t.scrum+=st.scrum||0;t.scrumW+=st.scrumW||0;t.scrumT+=st.scrumT||0;
      t.to+=st.to||0;t.toL+=st.toL||0;t.jackal+=st.jackal||0;t.jackalAtt+=st.jackalAtt||0;t.counterRuck+=st.counterRuck||0;
      t.pts+=(st.tries||0)*5+(st.conv||0)*2+(st.penG||0)*3+(st.dg||0)*3;

  const allTeams=Object.values(teamMap);
  function getMetricVal(t,metric){
    if(metric.k==='loW%')return t.loT>0?Math.round(t.loW/t.loT*100):0;
    if(metric.k==='scrumW%')return t.scrumT>0?Math.round(t.scrumW/t.scrumT*100):0;
    return t[metric.k]||0;
  }
  function buildMiniTable(metric){
    const teams=[...allTeams];

      teams.sort((a,b)=>{const va=getMetricVal(a,metric),vb=getMetricVal(b,metric);return metric.lower?va-vb:vb-va;});
    }else{
      teams.sort((a,b)=>{const va=a.games?getMetricVal(a,metric)/a.games:0,vb=b.games?getMetricVal(b,metric)/b.games:0;return metric.lower?va-vb:vb-va;});
    }
    const maxBase=RANK_SHOW_TOTALS?Math.max(...teams.map(t=>getMetricVal(t,metric)),1):Math.max(...teams.map(t=>t.games?getMetricVal(t,metric)/t.games:0),1);
    function buildRow(t,rank,hl){

      const dispVal=RANK_SHOW_TOTALS?(metric.pct?avg.toFixed(1)+'%':total):
                    (metric.pct?avg.toFixed(1)+'%':avg.toFixed(1));
      const barBase=RANK_SHOW_TOTALS?total:avg;
      const pct=Math.round((barBase/maxBase)*100);
      const rankClass=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':rank===teams.length?'rank-last':'';
      return`<tr style="${hl?'background:rgba(26,107,62,.12);':''}">
        <td style="width:22px"><span class="rank-badge ${rankClass}">${rank}</span></td>

        <td style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;white-space:nowrap;width:40px;${hl?'color:var(--green)':''}">${dispVal}</td>
        <td style="width:44px"><div class="rank-bar-track" style="min-width:0"><div class="rank-bar-fill" style="width:${pct}%;background:${metric.col}"></div></div></td>
      </tr>`;
    }
    // If focused team is outside top 10, pin them above the list so they're always visible
    const focusIdx=focusTeam?teams.findIndex(t=>t.id===focusTeam):-1;
    const focusOutsideTop10=focusIdx>=10;
    let pinnedHTML='';
    if(focusOutsideTop10){
      const ft=teams[focusIdx];
      pinnedHTML=buildRow(ft,focusIdx+1,true);
      pinnedHTML+=`<tr><td colspan="4" style="padding:2px 5px;font-size:9px;color:var(--txt-faint);letter-spacing:.8px;text-transform:uppercase;border-top:1px dashed var(--border)">Top 10:</td></tr>`;
    }
    const top10=teams.slice(0,10);
    const rest=teams.slice(10).filter(t=>!(focusOutsideTop10&&t.id===focusTeam));
    const top10HTML=top10.map((t,i)=>buildRow(t,i+1,!focusOutsideTop10&&focusTeam&&t.id===focusTeam)).join('');
    const restHTML=rest.map((t,j)=>buildRow(t,focusOutsideTop10?11+j:10+j,false)).join('');
    return`<div class="rk-mini-card">
      <div class="rk-mini-hdr"><span>${metric.l}</span><span class="rk-mini-dir">${RANK_SHOW_TOTALS?'Season Total':'Per Game Avg'}</span></div>
      <table><tbody>${pinnedHTML}${top10HTML}</tbody></table>
      ${restHTML?`<div style="max-height:220px;overflow-y:auto;border-top:1px solid var(--border)"><table><tbody>${restHTML}</tbody></table></div>`:''}
    </div>`;
  }
  const gridHTML=RANK_METRICS.map(m=>buildMiniTable(m)).join('');
  el.innerHTML=`
    <div class="page-hdr"><h2>League Rankings</h2><p>${ms.length} match${ms.length!==1?'es':''} · ${allTeams.length} team${allTeams.length!==1?'s':''}</p></div>
    <div class="ctrl-row">
      <div class="ctrl-group"><div class="ctrl-lbl">Tournament</div>
        <select onchange="SEL_RANK_T=this.value;renderRankings()">${tourOpts}</select></div>
      <div class="ctrl-group"><div class="ctrl-lbl">View</div>
        <div style="display:flex;gap:5px">
          <button onclick="RANK_SHOW_TOTALS=false;renderRankings()" style="font-size:11px;font-weight:600;padding:5px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;background:${!RANK_SHOW_TOTALS?'var(--green)':'var(--card)'};color:${!RANK_SHOW_TOTALS?'#fff':'var(--txt-dim)'}">Per Game</button>
          <button onclick="RANK_SHOW_TOTALS=true;renderRankings()" style="font-size:11px;font-weight:600;padding:5px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;background:${RANK_SHOW_TOTALS?'var(--green)':'var(--card)'};color:${RANK_SHOW_TOTALS?'#fff':'var(--txt-dim)'}">Totals</button>
        </div></div>
    </div>
    ${!allTeams.length?'<div class="no-data">No data for this tournament.</div>':`<div class="rk-grid">${gridHTML}</div>`}`;
}

// Helper: aggregate stats for a set of matches from ALL participating teams
function leagueAvgByWeek(ms){
  // Returns [{week, date, v: {tries, pen, penW, loW, loT, to, pts, ptsC, fkC, fkW, scrum, scrumW, scrumT}}] per week
  const byWeek={};
  ms.forEach(m=>{
    const w=m.week||'?';
    if(!byWeek[w])byWeek[w]={week:w,date:m.date,games:0,tries:0,pen:0,penW:0,loW:0,loT:0,to:0,pts:0,ptsC:0,fkC:0,fkW:0,scrum:0,scrumW:0,scrumT:0};
    const bw=byWeek[w];
    [m.hid,m.aid].forEach(tid=>{
      const s=m.stats[tid]||{};
      const oppId=tid===m.hid?m.aid:m.hid;
      const oScore=tid===m.hid?m.as:m.hs;
      bw.games++;bw.tries+=s.tries||0;bw.pen+=s.pen||0;bw.penW+=s.penW||0;
      bw.loW+=s.loW||0;bw.loT+=s.loT||0;bw.to+=s.to||0;
      bw.pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
      bw.ptsC+=oScore||0;
      bw.fkC+=s.fkC||0;bw.fkW+=s.fkW||0;
      bw.scrum+=s.scrum||0;bw.scrumW+=s.scrumW||0;bw.scrumT+=s.scrumT||0;
    });
  });
  return Object.values(byWeek).sort((a,b)=>+(a.week||0)-(+(b.week||0)));
}
// Helper: aggregate season stats per team for a set of matches
function teamSeasonStats(ms,tid){
  let t={games:0,wins:0,draws:0,losses:0,pts:0,ptsC:0,tries:0,triesC:0,pen:0,penW:0,fkC:0,fkW:0,loW:0,loT:0,scrum:0,scrumW:0,scrumT:0,to:0,yel:0,red:0};
  ms.forEach(m=>{
    const s=m.stats[tid]||{};
    const oppId=m.hid===tid?m.aid:m.hid;
    const os=m.stats[oppId]||{};
    const tScore=m.hid===tid?m.hs:m.as,oScore=m.hid===tid?m.as:m.hs;
    t.games++;if(tScore>oScore)t.wins++;else if(tScore<oScore)t.losses++;else t.draws++;
    t.tries+=s.tries||0;t.pen+=s.pen||0;t.penW+=s.penW||0;
    t.fkC+=s.fkC||0;t.fkW+=s.fkW||0;
    t.loW+=s.loW||0;t.loT+=s.loT||0;
    t.scrum+=s.scrum||0;t.scrumW+=s.scrumW||0;t.scrumT+=s.scrumT||0;
    t.to+=s.to||0;t.yel+=s.yel||0;t.red+=s.red||0;
    t.pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
    t.ptsC+=oScore||0;
    t.triesC+=os.tries||0;
  });
  return t;
}

  // ---- VIEW: Compare Leagues ----
  if(TR_VIEW==='compare'){

    const n2=TID_NAMES[+SEL_COMPARE_T2]||SEL_COMPARE_T2||'League 2';
    // Per-league season averages per game
    function leagueSeasonAvg(ms){
      let g=0,tries=0,pen=0,penW=0,loW=0,loT=0,to=0,pts=0;
      ms.forEach(m=>[m.hid,m.aid].forEach(tid=>{
        const s=m.stats[tid]||{};g++;
        tries+=s.tries||0;pen+=s.pen||0;penW+=s.penW||0;
        loW+=s.loW||0;loT+=s.loT||0;to+=s.to||0;
        pts+=(s.tries||0)*5+(s.conv||0)*2+(s.penG||0)*3+(s.dg||0)*3;
      }));
      return g?{tries:tries/g,pen:pen/g,penW:penW/g,lo:loT>0?Math.round(loW/loT*100):null,to:to/g,pts:pts/g}:{};
    }
    const avg1=leagueSeasonAvg(ms1),avg2=leagueSeasonAvg(ms2);
    const metrics=[
      {l:'Avg Points/Game',k:'pts'},{l:'Avg Tries/Game',k:'tries'},
      {l:'Avg Penalties Conceded/Game',k:'pen'},{l:'Avg Penalties Won/Game',k:'penW'},
      {l:'Lineout Win %',k:'lo',pct:true},{l:'Avg Turnovers Won/Game',k:'to'},

      <div class="ctrl-lbl" style="margin-bottom:10px">Performance Charts</div>
      <div class="t-grid3" id="tr-charts-grid"></div>
    </div>`}`;
  setTimeout(()=>renderTRCharts('tr-charts-grid',chartDefs),50);
}

function renderTRTot(){
  const el=document.getElementById('tr-tot');
  if(!el)return;
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">📊</div><h2>No data yet</h2><p>Upload XML files to view totals.</p></div>`;return;}
  const gfTeamTot=GLOBAL_FILTERS.teams&&GLOBAL_FILTERS.teams.length?GLOBAL_FILTERS.teams[0]:null;
  if(!gfTeamTot)SEL_TEAM_TOT='ALL';
  else SEL_TEAM_TOT=gfTeamTot;

  // ---- League view (All Teams) — totals ----
  if(SEL_TEAM_TOT==='ALL'){
    const ms=getFilteredMatches();
    const allTids=[...new Set(ms.flatMap(m=>[m.hid,m.aid]))];
    const teamData=allTids.map(tid=>{
      const tn=ms.find(m=>m.hid===tid)?.hn||ms.find(m=>m.aid===tid)?.an||tid;
      const tms2=ms.filter(m=>m.hid===tid||m.aid===tid);
      const t=teamSeasonStats(tms2,tid);
      return{tid,tn,games:t.games,wins:t.wins,draws:t.draws,losses:t.losses,
        pts:t.pts,ptsC:t.ptsC,tries:t.tries,pen:t.pen,penW:t.penW,
        lo:t.loT>0?Math.round(t.loW/t.loT*100):null,to:t.to,
        scrumWpct:t.scrumT>0?Math.round(t.scrumW/t.scrumT*100):null};
    });
    const TRS=TR_SORT_TOT;

// ===== CHART =====
function drawChart(canvas,data,opts={}){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||200,H=canvas.offsetHeight||130;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const P={t:16,r:10,b:42,l:30};const pw=W-P.l-P.r,ph=H-P.t-P.b;
  const vals=data.map(d=>d.v).filter(v=>v!=null&&!isNaN(v));
  if(!vals.length){ctx.fillStyle='#aaa';ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);return;}
  const mx=Math.max(...vals),mn=Math.min(...vals),sp=mx-mn||1;
  const yMn=0,yMx=opts.pct?100:Math.max(mx+sp*.25,1);
  const n=data.length;
  const xp=i=>P.l+(n<2?pw/2:i/(n-1)*pw);
  const yp=v=>v==null||isNaN(v)?null:P.t+ph*(1-(v-yMn)/(yMx-yMn));
  [0,1,2,3].forEach(i=>{
    const v=yMn+(yMx-yMn)*(i/3),y=yp(v);
    ctx.strokeStyle='#e8ede9';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+pw,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#aab5ad';ctx.font='9px Inter';ctx.textAlign='right';
    ctx.fillText(Math.round(v)+(opts.pct?'%':''),P.l-4,y+3);
  });
  const avgs=data.map((_,i)=>{const w=data.slice(Math.max(0,i-2),i+1).map(d=>d.v).filter(v=>v!=null&&!isNaN(v));return w.length?w.reduce((a,b)=>a+b,0)/w.length:null;});
  ctx.beginPath();ctx.strokeStyle=opts.lineCol||'rgba(26,107,62,.25)';ctx.lineWidth=2;let first=true;
  avgs.forEach((av,i)=>{const y=yp(av);if(y==null)return;first?(ctx.moveTo(xp(i),y),first=false):ctx.lineTo(xp(i),y);});ctx.stroke();
  const baseY=P.t+ph;
  data.forEach((d,i)=>{
    const v=d.v,x=xp(i),y=yp(v);if(y==null)return;
    const fill=d.res==='W'?'#1a6b3e':d.res==='L'?'#c0392b':'#7a8f80';
    ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='bold 11px Inter';ctx.fillStyle='#2a3a2e';ctx.textAlign='center';
    ctx.fillText(v==null?'':Math.round(v)+(opts.pct?'%':''),x,y-8);
    if(n<=10||i%2===0||i===n-1){
      const oppShort=(d.opp||'?').length>14?(d.opp||'?').slice(0,13)+'…':(d.opp||'?');
      ctx.save();ctx.translate(x,baseY+3);ctx.rotate(-Math.PI/4);
      ctx.font='7px Inter';ctx.fillStyle='#5a6e60';ctx.textAlign='right';
      ctx.fillText(oppShort,0,0);
      if(d.date){ctx.font='6px Inter';ctx.fillStyle='#9aad9f';ctx.fillText(fdate(d.date),0,8);}
      ctx.restore();
    }
  });
}

// dual-series line chart for league comparison
function drawChartDual(canvas,data1,data2,opts={}){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||200,H=canvas.offsetHeight||140;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const P={t:16,r:10,b:36,l:30};const pw=W-P.l-P.r,ph=H-P.t-P.b;
  const allVals=[...data1,...data2].map(d=>d.v).filter(v=>v!=null&&!isNaN(v));
  if(!allVals.length){ctx.fillStyle='#aaa';ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);return;}
  const yMn=0,yMx=Math.max(...allVals)*1.2||1;
  function xp(i,n){return P.l+(n<2?pw/2:i/(n-1)*pw);}
  function yp(v){return v==null?null:P.t+ph*(1-(v-yMn)/(yMx-yMn));}
  [0,1,2,3].forEach(i=>{
    const v=yMn+(yMx-yMn)*(i/3),y=yp(v);
    ctx.strokeStyle='#e8ede9';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+pw,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#aab5ad';ctx.font='9px Inter';ctx.textAlign='right';
    ctx.fillText(v.toFixed(1),P.l-4,y+3);
  });
  function drawLine(data,col){
    if(!data.length)return;
    const n=data.length;
    ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2;let first=true;
    data.forEach((d,i)=>{const y=yp(d.v);if(y==null)return;first?(ctx.moveTo(xp(i,n),y),first=false):ctx.lineTo(xp(i,n),y);});ctx.stroke();
    data.forEach((d,i)=>{const y=yp(d.v);if(y==null)return;
      ctx.beginPath();ctx.arc(xp(i,n),y,3.5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      const lbl=(d.opp||'').replace(/^Wk /,'');
      if(i===0||i===data.length-1||i%2===0){
        ctx.save();ctx.translate(xp(i,n),P.t+ph+3);ctx.rotate(-Math.PI/4);
        ctx.font='7px Inter';ctx.fillStyle='#5a6e60';ctx.textAlign='right';
        ctx.fillText('Wk '+(lbl||i+1),0,0);ctx.restore();
      }
    });
  }
  drawLine(data1,opts.lineCol1||'#2d7a4f');
  drawLine(data2,opts.lineCol2||'#e57373');
}

// ===== REFEREE =====
function renderRF(){
  const el=document.getElementById('rf');
  if(!MATCHES.length){el.innerHTML=`<div class="empty-state"><div class="es-icon">👤</div><h2>No data yet</h2><p>Upload XML files to analyse referee patterns.</p></div>`;return;}
  const rs=refs();
  if(GLOBAL_FILTERS.ref)SEL_REF=GLOBAL_FILTERS.ref;
  if(!SEL_REF||!rs.find(r=>r.id===SEL_REF))SEL_REF=rs[0]?.id||null;
  const sr=rs.find(r=>r.id===SEL_REF);

  // Compute stats for this referee across all/selected matches
  let detH='';
  let pitchLocs=[],homePens=[],awayPens=[],homeCards=[],awayCards=[],homeFKs=[],awayFKs=[];
  let totalPen=0,totalFK=0,totalYel=0,totalRed=0,hPen=0,aPen=0;
  let ng=0;
  let rms=[];
  let selMatchObj=null;
  let homeLabel='Home',awayLabel='Away';

  if(sr){
    const gfBase=getFilteredMatches().filter(m=>m.rid===SEL_REF);
    rms=[...gfBase].sort((a,b)=>dsort(b.date)-dsort(a.date));
    ng=rms.length;
    // Validate SEL_REF_MATCHES (remove stale IDs)
    const validIds=new Set(rms.map(m=>matchDocId(m)));
    SEL_REF_MATCHES.forEach(id=>{if(!validIds.has(id))SEL_REF_MATCHES.delete(id);});

    let matchesToProcess=SEL_REF_MATCHES.size>0?rms.filter(m=>SEL_REF_MATCHES.has(matchDocId(m))):rms;
    // Apply card filter only when no specific games are manually selected (to avoid hiding explicitly-chosen games)
    if(SEL_REF_MATCHES.size===0){
      if(RF_CARD_FILTER==='yel')matchesToProcess=matchesToProcess.filter(m=>{const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};return(hs.yel||0)+(as2.yel||0)>0;});
      if(RF_CARD_FILTER==='red')matchesToProcess=matchesToProcess.filter(m=>{const hs=m.stats[m.hid]||{},as2=m.stats[m.aid]||{};return(hs.red||0)+(as2.red||0)>0;});
